<div class="drop" role="button" tabindex="0">
  <div>
    <svg class="icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="9" y="4" width="30" height="40" rx="4" stroke="currentColor" stroke-width="2.5"/><rect x="15" y="14" width="18" height="4" rx="1.5" fill="currentColor" opacity=".3"/><rect x="15" y="22" width="18" height="5" rx="1.5" fill="currentColor"/><rect x="15" y="31" width="11" height="4" rx="1.5" fill="currentColor" opacity=".3"/></svg>
    <strong>{{ dropTitle or L.ui.dropTitle }}</strong>
    <span class="muted">{{ L.ui.dropOr }}</span><br>
    <span class="btn primary big">{{ L.ui.choose }}</span>
    <input type="file" accept="{{ accept or 'application/pdf,.pdf' }}" hidden>
    <small>{{ L.ui.dropNote }}</small>
  </div>
</div>
