    nav: Anonimizar em lote
    card: "Pro: anonimize dezenas de PDFs de uma vez, com relatório CSV."
    title: "Anonimizar PDFs em lote: tarje vários documentos de uma vez"
    description: "Anonimize vários PDFs de uma vez: e-mails, telefones, IBANs, nomes, endereços e suas próprias listas de termos, tarjados em cada arquivo. ZIP e relatório CSV. Local, Pro."
    h1: 'Anonimize <span class="hl">vários PDFs</span> de uma vez'
    h1_plain: Anonimizar PDFs em lote
    lede: "Solte uma pasta de documentos, escolha o que deve desaparecer e receba todos os arquivos tarjados em um único ZIP, com um relatório CSV para os seus registros. Continua 100 % local."
    suffix: anonimizado
