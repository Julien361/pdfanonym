    h1: Termos de uso
    lede: "Última atualização: 9 de outubro de 2026. Ao usar o pdfanonym.com, você aceita estes termos."
    body: |
      ## 1. O serviço

      O pdfanonym.com, publicado pela METIS (veja o [aviso legal](/pt/aviso-legal/)), oferece ferramentas on-line gratuitas para processar arquivos PDF: tarja, anonimização, remoção de texto, limpeza de metadados, edição de páginas, conversão, compressão, assinatura e proteção por senha. Não é necessário criar conta.

      ## 2. Processamento no seu dispositivo

      Os arquivos são processados no seu navegador, no seu próprio dispositivo. Eles não são enviados aos nossos servidores, e não temos acesso a eles. Você continua sendo o único titular dos seus documentos e do conteúdo deles. A [página de privacidade](/pt/privacidade/) explica isso em detalhes.

      ## 3. Fornecido no estado em que se encontra

      As ferramentas gratuitas são fornecidas no estado em que se encontram (os planos pagos são regidos pela seção 9), sem nenhuma garantia de resultado, disponibilidade ou adequação a uma finalidade específica. Elas podem ser alteradas, interrompidas ou removidas a qualquer momento.

      ## 4. Confira o resultado antes de compartilhar

      Você é responsável por conferir cada documento antes de usá-lo ou compartilhá-lo. Em especial:

      - **A detecção automática de dados pessoais não é exaustiva.** Nomes escritos sem pronome de tratamento, endereços postais, texto manuscrito, páginas digitalizadas e formatos incomuns podem não ser detectados. Leia o documento e complete a tarja você mesmo.
      - **A tarja só se aplica ao que você marca.** As informações também podem aparecer em imagens, anexos, comentários ou outras cópias do arquivo. Nosso [guia](/pt/como-tarjar-um-pdf/) lista as verificações a fazer.
      - **Guarde seus arquivos originais.** As alterações feitas pelas ferramentas, como tarja, achatamento ou criptografia, são permanentes por natureza.

      ## 5. Uso lícito

      Você se compromete a usar as ferramentas somente com documentos de que é titular ou que está autorizado a modificar, e em conformidade com a lei. Em especial, você não deve usar a ferramenta de desbloqueio para remover proteções de documentos que não tem o direito de modificar, nem usar qualquer ferramenta para violar direitos de terceiros, incluindo direitos autorais e privacidade.

      ## 6. Assinatura eletrônica

      Uma assinatura desenhada com a ferramenta de assinatura é uma assinatura eletrônica simples nos termos do regulamento europeu eIDAS. Ela não substitui uma assinatura eletrônica avançada ou qualificada quando esta for exigida.

      ## 7. Responsabilidade

      Na medida permitida pela lei, a METIS não será responsável por nenhum dano resultante do uso das ferramentas ou da impossibilidade de usá-las, incluindo a divulgação de informações que não foram tarjadas, a perda ou alteração de arquivos, ou uma decisão tomada com base em um documento processado. Nada nestes termos limita a responsabilidade que não pode ser limitada pela lei aplicável, nem os direitos que os consumidores têm pela legislação imperativa do seu país de residência.

      ## 8. Software de código aberto

      O código-fonte do site é publicado sob a GNU Affero General Public License v3 (veja [Código-fonte](/pt/codigo-fonte/)). Essa licença rege seus direitos sobre o código. O nome e o logotipo do pdfanonym não são cobertos por ela.

      ## 9. Planos pagos (somente profissionais)

      Os planos pagos (passe de 24 horas, Pro, Equipe) são vendidos pela METIS **exclusivamente a clientes profissionais**: empresas, autônomos e órgãos públicos que compram para fins da sua atividade comercial, empresarial ou profissional. Eles não são oferecidos a consumidores. Ao fazer um pedido, você confirma que atua na qualidade de profissional.

      - **Os preços** aparecem na [página de preços](/pt/precos/) sem impostos. O IVA é acrescentado conforme as regras aplicáveis ao seu país; empresas da UE com número de IVA válido são faturadas pelo mecanismo de autoliquidação (reverse charge). O pagamento é processado pela Stripe.
      - **O acesso** começa imediatamente após o pagamento.
      - **As assinaturas** (Pro, Equipe) são renovadas automaticamente pelo mesmo período até serem canceladas. Você pode cancelar a qualquer momento na sua página da conta; o cancelamento produz efeito no fim do período já pago, que não é reembolsado.
      - **O passe de 24 horas** dá acesso aos recursos Pro por 24 horas a partir do pagamento e não é renovado.
      - **As licenças** são pessoais no Pro e por usuário no Equipe. A chave de licença fica guardada no seu navegador; guarde uma cópia para usá-la em outro dispositivo.
      - **Dúvidas e reclamações**: contact@pdfanonym.com.

      ## 10. Alterações e lei aplicável

