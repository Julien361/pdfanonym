pages:
  home:
    slug: ""
    title: "pdfanonym: tarjar e anonimizar PDF no navegador, grátis"
    description: "Tarjar e anonimizar PDF de verdade: apague nomes, números e metadados ocultos no navegador, sem enviar o arquivo. Grátis, sem cadastro, sem marca d'água."
    h1: 'Limpe seus PDFs <span class="hl">antes</span> de compartilhar'
    lede: "Para anonimizar um PDF, tarje nomes, apague texto e remova os metadados ocultos. Tudo acontece no seu próprio computador: o documento nunca é enviado a um servidor, nem mesmo ao nosso."
    cta: Tarjar um PDF agora
    toolsTitle: Escolha uma ferramenta
    faq:
      - q: O pdfanonym é gratuito mesmo?
        a: "Sim. As {free_tools} ferramentas são gratuitas, sem cadastro, sem limite diário e sem marca d'água. Um <a href=\"/pt/precos/\">plano Pro</a> opcional adiciona anonimização em lote, detecção ampliada e relatórios para profissionais."
      - q: Como posso conferir que meu arquivo não é enviado?
        a: "Abra as ferramentas de desenvolvedor do navegador, vá até a aba Rede (Network) e processe um arquivo: nenhuma requisição vai carregar o documento. A página também traz uma política de segurança que a impede de enviar dados para qualquer outro site. E o código-fonte completo está disponível para leitura."
      - q: Funciona offline?
        a: "Sim. Depois que a página de uma ferramenta termina de carregar, você pode se desconectar da internet e continuar trabalhando nos seus PDFs."
    body: |
      ## Por que mais uma ferramenta de PDF?

      Porque a maioria erra num ponto essencial. Quando você "tarja" um nome num editor online comum, ele só desenha um retângulo por cima do texto. A página parece limpa, mas qualquer pessoa ainda consegue selecionar, copiar ou buscar as palavras que ficaram embaixo. Advogados já foram pegos assim em petições, e órgãos públicos também.

      Para tarjar PDF de verdade, o pdfanonym remove os caracteres do próprio arquivo. O que você apaga deixa de existir: não dá para copiar, buscar nem recuperar. E, se você não sabe onde estão os dados pessoais, dá para [anonimizar PDF](/pt/anonimizar-pdf/) com a detecção automática de e-mails, telefones e IBANs.

      ## Privado por construção, não por promessa

      Os serviços que exigem upload pedem que você confie a eles seu contrato, seu holerite ou seu laudo médico. Nós não pedimos essa confiança porque nunca recebemos o arquivo. O motor de PDF roda dentro do seu navegador (é o [MuPDF](https://mupdf.com), compilado para WebAssembly), então o documento sai do seu disco, passa pela sua tela e volta para o seu disco.

      Isso faz diferença se você lida com arquivos de clientes, documentos de RH ou qualquer dado pessoal protegido pela LGPD: não há nenhum terceiro envolvido no tratamento e nada para apagar depois. O mesmo vale para as tarefas do dia a dia, como [juntar PDF](/pt/juntar-pdf/) ou [comprimir PDF](/pt/comprimir-pdf/): tudo acontece no seu dispositivo.

  redact:
    slug: tarjar-pdf
    nav: Tarjar PDF
    card: Cubra nomes, números e trechos sensíveis. O texto sob a tarja é apagado.
    title: "Tarjar PDF online, grátis e privado (texto apagado de verdade)"
    description: "Tarjar PDF de verdade: o texto sob a tarja é apagado do arquivo. Direto no navegador, sem upload, sem cadastro, sem marca d'água. Busca em todas as páginas."
    h1: 'Tarjar PDF e <span class="redacted">apagar</span> o texto de vez'
    h1_plain: Tarjar PDF
    lede: "Selecione um nome, um número de conta ou um parágrafo inteiro: o pdfanonym remove esse conteúdo do arquivo e deixa uma tarja preta no lugar. Nada é enviado."
    black: true
    suffix: tarjado
    stepsTitle: Como tarjar um PDF em três passos
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página ou escolha no seu computador. Ele abre na hora, porque nunca sai do seu dispositivo."
      - h: Marque o que deve sumir
        p: "Arraste sobre o texto, clique numa palavra, dê um clique duplo numa linha ou digite um nome na busca e clique em <b>Marcar tudo</b>. Para digitalizações, mude para <b>Área</b> e desenhe um retângulo."
      - h: Aplique e baixe
        p: "Pressione <kbd>Del</kbd> ou <b>Aplicar</b> para apagar o texto, confira o resultado e clique em <b>Baixar</b>. Por padrão, os metadados ocultos também são removidos."
    compare:
      title: Uma caixa preta não é uma tarja
      intro: "A maioria dos editores de PDF deixa você desenhar um retângulo preto e chama isso de tarja. A diferença só aparece quando alguém copia o texto."
      bad_h: Caixa desenhada por cima
      bad_p: "A página parece tarjada, mas as palavras continuam no arquivo. Selecione a área, copie e cole num e-mail: o nome escondido aparece. A busca também encontra, assim como qualquer ferramenta de extração de texto."
      good_h: Tarja de verdade
      good_p: "Os caracteres sob a tarja são removidos do conteúdo da página. Não sobra nada para copiar, buscar ou extrair. A tarja preta é só uma marca visual, e você pode até preferir deixar um espaço em branco."
    body: |
      ## O que dá para tarjar?

      Tudo o que for texto no PDF: nomes, endereços, e-mails, telefones, dados bancários, números de documentos pessoais ou fiscais, salários, números de processo, assinaturas digitadas como texto. A busca encontra todas as ocorrências em todas as páginas, sem diferenciar maiúsculas nem acentos, então o sobrenome de um cliente é marcado em um arquivo de 200 páginas com um único clique. Se você não sabe exatamente onde estão os dados, pode [anonimizar o PDF](/pt/anonimizar-pdf/) com a detecção automática de e-mails, telefones e IBANs.

      Se o seu PDF é uma **digitalização**, o "texto" na verdade é uma imagem. Mude para o modo **Área**, desenhe um retângulo sobre o trecho e marque **imagens** nas opções: os pixels dentro do retângulo são apagados da própria imagem.

      ## Quem precisa tarjar PDF?

      - **Advogados e assistentes jurídicos** preparando documentos para juntar aos autos e petições.
      - **Equipes de RH** compartilhando holerites, contratos ou relatórios de apuração interna.
      - **Quem responde a uma solicitação do titular com base na LGPD ou a um pedido de acesso à informação**, quando os dados de terceiros precisam ser retirados antes da entrega.
      - **Proprietários, inquilinos e autônomos** que enviam extratos bancários ou documentos de identidade dos quais só parte da informação é necessária.

      ## Confira a tarja antes de enviar

      Depois de baixar, abra o arquivo, selecione a área tarjada e tente copiá-la; em seguida, busque uma das palavras que você removeu. Nada deve aparecer. A tarja não apaga o autor nem o título escondidos nas propriedades do arquivo, a não ser que a opção de metadados esteja marcada; para entender o que fica guardado ali, veja como [remover metadados de PDF](/pt/remover-metadados-pdf/). Nosso guia sobre [como tarjar um PDF corretamente](/pt/como-tarjar-um-pdf/) traz todas as verificações.
    faq:
      - q: O texto é apagado de verdade ou só coberto?
        a: "Apagado. O pdfanonym aplica a tarja ao conteúdo da página, então os caracteres deixam de existir no arquivo. Copiar, buscar ou extrair o texto não retorna nada."
      - q: Dá para tarjar um PDF digitalizado?
        a: "Sim, com o modo Área. Desenhe um retângulo e marque “imagens” nas opções: a parte da imagem digitalizada sob o retângulo fica em branco. A busca de texto não funciona em digitalizações porque não existe camada de texto."
      - q: Posso remover o texto sem deixar uma tarja preta?
        a: "Pode. Desmarque “Deixar uma tarja preta” nas opções ou use nossa ferramenta para <a href=\"/pt/apagar-texto-pdf/\">apagar texto de PDF</a>, que deixa um espaço em branco no lugar."
      - q: Existe limite de páginas ou de tamanho de arquivo?
        a: "Não há limite fixo. Arquivos muito grandes (várias centenas de páginas) dependem da memória do seu computador, mas documentos do dia a dia abrem em um segundo."
      - q: Posso desfazer uma tarja?
        a: "Sim, enquanto a página estiver aberta: pressione Ctrl/Cmd+Z. Depois que o arquivo é baixado, a tarja é definitiva, e a ideia é exatamente essa."
      - q: Meus arquivos ficam guardados em algum lugar?
        a: "Não. Eles nunca são enviados, então do nosso lado não existe nada para guardar ou apagar."

  remove:
    slug: apagar-texto-pdf
    nav: Apagar texto
    card: Apague palavras ou parágrafos de um PDF e deixe um espaço em branco limpo.
    title: "Apagar texto PDF ou passar corretivo de verdade (grátis, offline)"
    description: "Apague, remova ou passe corretivo no texto de um PDF sem deixar as palavras por baixo. Borracha de PDF grátis que roda no navegador: sem upload, sem cadastro."
    h1: 'Apagar texto de um PDF <span class="hl">de verdade</span>'
    h1_plain: Apagar texto de PDF
    lede: "Apague uma palavra, uma linha ou um bloco inteiro do seu PDF. O texto é removido do arquivo, não escondido sob um retângulo branco, e o resto da página continua exatamente onde estava."
    black: false
    suffix: editado
    stepsTitle: Como apagar texto de um PDF
    steps:
      - h: Abra o PDF
        p: "Solte o arquivo aqui. Ele é lido pelo seu navegador, sem ser enviado a lugar nenhum."
      - h: Selecione o texto
        p: "Arraste sobre ele, clique numa palavra ou faça uma busca e clique em <b>Marcar tudo</b>. Use o modo <b>Área</b> para pegar um bloco inteiro."
      - h: Apague e baixe
        p: "Pressione <kbd>Del</kbd>. As palavras somem e deixam um espaço em branco. Desfaça com <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd> e depois baixe."
    compare:
      title: Por que as ferramentas de "corretivo" deixam seu texto para trás
      intro: "Muitas ferramentas oferecem um pincel de corretivo. Ele pinta uma forma branca sobre as palavras, o que funciona no papel e falha num PDF."
      bad_h: Corretivo por cima
      bad_p: "As palavras continuam debaixo da forma branca. Copie a página ou abra em outro editor e elas voltam. Os leitores de tela também as leem em voz alta."
      good_h: Apagado da página
      good_p: "O pdfanonym remove os próprios caracteres. O texto ao redor mantém a posição exata, então o layout não se mexe, e não sobra nada embaixo para ser encontrado."
    body: |
      ## Como passar corretivo num PDF sem deixar o texto por baixo

      Num PDF, "corretivo" geralmente quer dizer pintar um retângulo branco sobre as palavras, a versão digital do corretivo líquido. Isso só esconde o texto dos olhos. O pdfanonym faz o que você realmente espera de um corretivo: as palavras são apagadas do arquivo e fica um espaço em branco no lugar delas. Selecione o texto, pressione <kbd>Del</kbd> e o resultado fica igualzinho a um corretivo, só que não sobra nada para recuperar.

      ## Bom saber

      PDF não é arquivo de editor de texto: cada palavra ocupa uma posição fixa na página. Quando você remove uma palavra no meio de uma linha, as palavras seguintes **não** deslizam para a esquerda para preencher o vão; fica um espaço em branco. Para confidencialidade, é exatamente isso que você quer, e o layout fica intacto.

      Se precisar **substituir** um texto por outro, remova o original aqui primeiro e depois acrescente o texto novo, por exemplo com a ferramenta para [adicionar texto em PDF](/pt/adicionar-texto-pdf/).

      ## Usos comuns

      - Remover um preço, um nome ou uma data de um orçamento antes de reaproveitá-lo como modelo.
      - Apagar anotações de rascunho ou menções "CONFIDENCIAL" esquecidas num documento.
      - Limpar dados pessoais de um formulário antes de compartilhar um exemplo, sem esquecer de [remover os metadados do PDF](/pt/remover-metadados-pdf/), onde o nome do autor costuma aparecer.

      Prefere uma barra preta visível? Use [Tarjar PDF](/pt/tarjar-pdf/).
    faq:
      - q: O texto que sobra vai sair do lugar?
        a: "Não. Todos os outros caracteres mantêm a posição exata. Fica um espaço em branco onde estava o texto removido."
      - q: Posso remover texto de um PDF digitalizado?
        a: "Digitalizações contêm uma imagem do texto, não texto. Use o modo Área e marque “imagens” para deixar essa parte da imagem em branco."
      - q: Remover texto diminui a qualidade?
        a: "Não. Só os caracteres selecionados são afetados; o resto da página, as fontes e as imagens ficam como estão."
      - q: É gratuito?
        a: "Sim, sem cadastro, sem limite e sem marca d'água."

  metadata:
    slug: remover-metadados-pdf
    nav: Editar ou remover metadados
    card: Veja, edite ou remova o autor, o software, as datas, os comentários e os anexos escondidos num PDF.
    title: "Editar metadados PDF: veja, altere ou remova, grátis"
    description: "Editor de metadados PDF grátis: veja o autor, o título, o software e as datas escondidos num PDF, altere ou remova tudo. Roda no navegador, sem upload."
    h1: 'Ver, editar ou remover <span class="hl">metadados</span> de PDF'
    h1_plain: Editor de metadados PDF
    lede: "Os metadados do PDF podem levar seu nome, sua empresa, o software que você usou e a data em que escreveu o documento, além de comentários que você nem lembra mais. Veja exatamente o que tem dentro e remova ou substitua pelos seus próprios valores."
    suffix: limpo
    reportCaption: O que este PDF carrega além do conteúdo visível
    runLabel: Remover metadados e baixar
    stepsTitle: Como remover metadados de um PDF
    steps:
      - h: Abra o PDF
        p: "Solte o arquivo na página. A análise é feita no seu computador."
      - h: Leia o relatório
        p: "Cada campo preenchido aparece em vermelho: autor, título, software, datas, bloco XMP, comentários, anexos, scripts."
      - h: Limpe e baixe
        p: "Clique no botão. Salvamos um novo arquivo sem esses dados, conferimos de novo e mostramos o que restou."
    body: |
      ## O que são metadados de PDF?

      Além das páginas que você vê, um PDF guarda informações sobre si mesmo. As **propriedades do documento** trazem título, autor, assunto, palavras-chave, o aplicativo que criou o arquivo (por exemplo "Microsoft Word") e o que o converteu em PDF, além das datas de criação e de modificação. Muitos arquivos também têm um **bloco XMP**, uma segunda cópia dessas mesmas informações em XML que algumas ferramentas esquecem de limpar.

      Outras coisas viajam junto com o arquivo sem serem "metadados" no sentido estrito: **comentários e notas adesivas**, **destaques**, **arquivos anexados** e, às vezes, **JavaScript**. Se você prefere que comentários e campos de formulário passem a fazer parte da página em vez de sumirem, pode [achatar o PDF](/pt/achatar-pdf/).

      ## Por que remover?

      - O campo autor costuma conter o nome completo de quem escreveu o arquivo Word original, ou o nome da empresa titular da licença.
      - As datas revelam quando o documento foi realmente redigido, o que pode pesar numa negociação ou num litígio.
      - Comentários deixados durante a revisão ("confirmar esse valor com o cliente") são fáceis de esquecer e fáceis de ler.
      - Um arquivo anexado pode conter um outro documento inteiro.

      ## Editar metadados PDF em vez de remover

      Às vezes você quer propriedades limpas e corretas, e não vazias: um título adequado que apareça nas abas do navegador e nos resultados de busca, sua empresa como autora, palavras-chave que façam sentido. Abra **Editar as propriedades em vez disso** abaixo do relatório, altere o título, o autor, o assunto, as palavras-chave, o criador ou o produtor, e baixe. Campos vazios são removidos. O bloco XMP antigo é descartado ao mesmo tempo, porque senão alguns leitores continuariam mostrando os valores anteriores.

      ## O que esta ferramenta não altera

      Ela não mexe no conteúdo visível das páginas. Se um nome está impresso na página, use [Tarjar PDF](/pt/tarjar-pdf/) para apagá-lo. Combine as duas ferramentas para ter um documento seguro para publicar.
    faq:
      - q: Quais metadados são removidos?
        a: "O dicionário de informações do documento (título, autor, assunto, palavras-chave, criador, produtor, datas), o fluxo de metadados XMP, os dados privados de aplicativo e, se a opção estiver marcada, comentários, anexos e JavaScript. O arquivo também recebe um novo ID interno."
      - q: Posso mudar o título ou o autor em vez de apagar?
        a: "Sim. Abra “Editar as propriedades em vez disso” abaixo do relatório, digite os novos valores e baixe. Deixe um campo vazio para removê-lo."
      - q: Como confiro o resultado?
        a: "Depois da limpeza, a ferramenta reabre o novo arquivo e mostra o relatório de novo. Você também pode conferir no seu leitor de PDF, em Arquivo e depois Propriedades."
      - q: O conteúdo visível muda?
        a: "Não. Texto, imagens e layout continuam exatamente iguais."
      - q: Por que meu leitor de PDF ainda mostra um produtor?
        a: "Alguns leitores exibem um valor padrão quando o campo está vazio, ou o arquivo aberto é o original. Abra a cópia baixada, cujo nome termina em “-limpo”."

  flatten:
    slug: achatar-pdf
    nav: Achatar PDF
    card: Transforme campos de formulário, comentários e carimbos em conteúdo fixo que ninguém consegue editar.
    title: "Achatar PDF online grátis: trave formulários e anotações"
    description: "Achatar PDF transforma campos de formulário preenchidos, comentários e assinaturas em conteúdo fixo da página. Grátis, no navegador, sem upload, sem cadastro."
    h1: 'Achatar um PDF: <span class="hl">trave</span> formulários e anotações'
    h1_plain: Achatar PDF
    lede: "Preencheu um formulário? Achatar o PDF incorpora os valores dos campos, os comentários e os carimbos à própria página, para que sejam impressos sem surpresa e não possam mais ser alterados."
    suffix: achatado
    reportCaption: Elementos interativos encontrados neste PDF
    runLabel: Achatar e baixar
    stepsTitle: Como achatar um PDF
    steps:
      - h: Abra o PDF
        p: "Solte aqui seu formulário preenchido ou documento com anotações."
      - h: Escolha o que achatar
        p: "Campos de formulário, comentários e carimbos, ou os dois. Você pode remover os metadados ocultos ao mesmo tempo."
      - h: Baixe
        p: "Você recebe um PDF comum, em que tudo faz parte da página."
    body: |
      ## O que significa achatar um PDF?

      Um PDF interativo tem camadas por cima da página: campos de formulário em que você digita, caixas de seleção, comentários, carimbos, desenhos. O leitor exibe tudo isso, mas são objetos separados que podem ser editados, movidos ou apagados.

      **Achatar** desenha esses elementos no conteúdo da página e remove os objetos interativos. O documento continua com a mesma aparência, mas passa a se comportar como uma folha impressa.

      ## Quando achatar?

      - **Antes de enviar um formulário preenchido**, para que o destinatário não altere suas respostas e todos os leitores as exibam da mesma forma.
      - **Antes de imprimir**, porque algumas impressoras e leitores mais antigos ignoram os campos de formulário.
      - **Antes de arquivar** contratos ou relatórios; se forem confidenciais, depois você pode [proteger o PDF com senha](/pt/proteger-pdf/).
      - **Antes de tarjar**: o texto digitado num campo de formulário não faz parte da página. Nossa [ferramenta de tarja](/pt/tarjar-pdf/) incorpora os campos automaticamente, mas muitas outras ferramentas não.
      - **Antes de enviar para um portal** que recusa formulários interativos ou os exibe vazios.

      ## Por que as respostas do meu formulário somem quando envio um PDF?

      Porque elas nunca fizeram parte da página. Os valores de um formulário ficam em objetos de campo separados, e cada leitor decide como desenhá-los. Alguns apps de celular, pré-visualizações de e-mail, impressoras e leitores mais antigos simplesmente os ignoram, ou só os mostram quando você clica num campo. Achatar resolve isso gravando os valores no conteúdo da página, onde todo leitor é obrigado a exibi-los. E se o formulário não tem campos preenchíveis, você pode [adicionar texto ao PDF](/pt/adicionar-texto-pdf/) diretamente na página.

      ## Achatar ou "Imprimir como PDF"?

      Um truque comum é imprimir o documento numa impressora de PDF. Muitas vezes funciona, mas reconstrói o arquivo inteiro: links, marcadores e tags de acessibilidade podem se perder, e alguns drivers transformam as páginas em imagens ou mudam o tamanho da página. Achatar mexe só nas partes interativas e mantém todo o resto como estava.

      ## O que é achatado

      | Elemento | Depois de achatar |
      |---|---|
      | Campos de texto, caixas de seleção, botões de opção, listas suspensas | O valor atual é desenhado na página |
      | Comentários, destaques, carimbos, desenhos | Desenhados na página como aparecem |
      | Assinatura desenhada ou carimbada | Mantida como parte da página |
      | Links e marcadores | Mantidos |
      | Texto | Continua sendo texto real e selecionável |
    faq:
      - q: Dá para desfazer o achatamento de um PDF?
        a: "Não. Depois de achatados, os valores dos campos viram conteúdo comum da página. Guarde o arquivo original se você puder precisar editar o formulário de novo."
      - q: Minha assinatura continua lá?
        a: "Uma assinatura desenhada ou carimbada como anotação é mantida e passa a fazer parte da página. Já uma assinatura digital certificada é invalidada por qualquer alteração no arquivo, inclusive o achatamento."
      - q: Achatar diminui a qualidade?
        a: "Não. O texto continua nítido e selecionável; nada é convertido em imagem."
      - q: Achatar deixa o arquivo menor?
        a: "Normalmente um pouco, porque os objetos de campo são removidos, mas a diferença é pequena. Achatar serve para travar o conteúdo, não para comprimir."
      - q: Posso achatar só o formulário e manter os comentários?
        a: "Sim. Desmarque “Comentários, carimbos e desenhos” antes de achatar: só os campos de formulário são incorporados à página."
      - q: Ele achata camadas?
        a: "Não. As camadas de conteúdo opcional (OCG), usadas em alguns desenhos técnicos e mapas, ficam como estão. Esta ferramenta achata campos de formulário e anotações."

  delete_pages:
    slug: excluir-paginas-pdf
    nav: Excluir páginas
    card: Remova páginas em branco, duplicadas ou desnecessárias de um PDF em poucos cliques.
    title: "Excluir páginas PDF online, grátis e sem upload"
    description: "Excluir páginas de um PDF no navegador: clique nas páginas que sobram, remova e baixe o arquivo. Grátis, sem upload, sem cadastro e sem marca d'água."
    h1: 'Excluir páginas de um PDF <span class="hl">sem enviar o arquivo</span>'
    h1_plain: Excluir páginas PDF
    lede: "Veja todas as páginas em miniatura, clique nas que você não precisa e remova. Seu PDF é processado no seu computador e nunca é enviado para lugar nenhum."
    suffix: editado
    hint: "Clique nas páginas para selecioná-las (Shift+clique para um intervalo) e pressione Del ou “Excluir selecionadas”."
    stepsTitle: Como excluir páginas de um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. As miniaturas de todas as páginas aparecem em um segundo."
      - h: Selecione as páginas que vai remover
        p: "Clique em uma página para selecioná-la, Shift+clique para selecionar um intervalo, ou use o ✕ de uma miniatura para excluir uma única página."
      - h: Exclua e baixe
        p: "Pressione <kbd>Del</kbd> ou <b>Excluir selecionadas</b>. Mudou de ideia? <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd>. Depois, <b>Baixar</b>."
    body: |
      ## Remover páginas PDF sem perder qualidade

      Excluir páginas de um PDF não recodifica o resto do documento: as páginas que ficam são copiadas exatamente como estavam, com texto, fontes, imagens, comentários e links da web. Nada é comprimido nem convertido em imagem, então o resultado fica idêntico ao original, menos as páginas que você removeu. Se, ao contrário, você quer guardar só algumas páginas, é mais rápido [extrair páginas do PDF](/pt/extrair-paginas-pdf/).

      ## Motivos comuns para remover páginas de um PDF

      - Páginas em branco deixadas por um scanner frente e verso.
      - Uma capa, o cabeçalho de um fax ou termos e condições que não precisam ser enviados.
      - Páginas com dados pessoais que você não deveria compartilhar. Se for só uma linha, é melhor [tarjá-la](/pt/tarjar-pdf/) em vez de excluir a página inteira.
      - Duplicatas depois de [juntar arquivos PDF](/pt/juntar-pdf/).

      ## Privado por princípio

      Os sites que removem páginas online costumam enviar o documento inteiro para tirar uma única folha. Aqui o PDF fica no seu dispositivo: o mecanismo de páginas roda no navegador, por isso também funciona offline depois de carregado.
    faq:
      - q: Posso excluir várias páginas de uma vez?
        a: "Sim. Clique em cada página que quer remover, ou clique em uma e dê Shift+clique em outra para selecionar todas as do meio, depois pressione Del."
      - q: Posso desfazer uma exclusão?
        a: "Sim, enquanto a página estiver aberta: pressione Ctrl/Cmd+Z ou o botão Desfazer, quantas vezes precisar."
      - q: Excluir páginas reduz o tamanho do arquivo?
        a: "Normalmente sim, porque o conteúdo usado só pelas páginas removidas é descartado ao salvar o arquivo."
      - q: Existe limite de páginas?
        a: "Não há limite fixo. Documentos grandes (várias centenas de páginas) dependem da memória do seu computador."

  extract_pages:
    slug: extrair-paginas-pdf
    nav: Extrair páginas
    card: Salve as páginas escolhidas de um PDF em um arquivo novo e separado.
    title: "Extrair páginas PDF online e salvar em novo arquivo, grátis"
    description: "Extrair páginas de um PDF e salvá-las em um arquivo novo, grátis e no navegador: sem upload, sem cadastro, sem marca d'água e com a qualidade original."
    h1: 'Extrair páginas de um PDF para um <span class="hl">novo arquivo</span>'
    h1_plain: Extrair páginas PDF
    lede: "Escolha as páginas de que precisa, na ordem que quiser, e salve em um PDF à parte. O arquivo original continua intacto."
    suffix: editado
    hint: "Selecione as páginas que quer manter (Shift+clique para um intervalo) e depois “Extrair selecionadas”. Antes, você pode mudar a ordem delas."
    stepsTitle: Como extrair páginas de um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo aqui. Cada página aparece em miniatura."
      - h: Selecione as páginas
        p: "Clique nas páginas que quer extrair. Shift+clique seleciona um intervalo. Arraste as miniaturas para mudar a ordem."
      - h: Extraia
        p: "Clique em <b>Extrair selecionadas</b>: um novo PDF só com essas páginas é baixado."
    body: |
      ## Extrair ou dividir?

      Extrair páginas de um PDF significa copiar algumas delas para um novo documento, enquanto o original continua completo. É o jeito mais rápido de enviar só a parte que importa de um arquivo longo: um capítulo de um relatório, a página de assinaturas de um contrato, as notas fiscais de um único mês dentro de uma exportação anual.

      Você pode extrair várias vezes do mesmo arquivo: selecione um primeiro grupo, extraia, depois selecione outro grupo e extraia de novo. Cada extração baixa um PDF separado. Se preferir tirar só algumas folhas e manter o resto, [excluir páginas do PDF](/pt/excluir-paginas-pdf/) é mais direto.

      ## Combine páginas de vários PDFs

      Clique em **Adicionar PDF** para carregar mais arquivos. As páginas deles entram na grade, você pode misturá-las e reorganizá-las, e depois extrair a seleção ou baixar tudo como um único documento. Para simplesmente unir arquivos inteiros, use [juntar PDF](/pt/juntar-pdf/).

      ## A mesma qualidade do original

      As páginas são copiadas como estão, com texto real, fontes, imagens, comentários e links da web. Nada é convertido em imagem, então as páginas extraídas continuam nítidas e pesquisáveis. Se precisar de uma página como imagem, converta de [PDF para JPG](/pt/pdf-para-jpg/). Se alguma tiver dados que não podem sair, [tarje no próprio computador](/pt/tarjar-pdf/) antes de enviar.
    faq:
      - q: O PDF original é alterado?
        a: "Não. A extração cria um arquivo novo; o original fica exatamente como estava no seu computador."
      - q: Posso extrair páginas em outra ordem?
        a: "Sim. Arraste as miniaturas para a ordem que quiser antes de extrair: o novo PDF segue a ordem das páginas selecionadas na grade."
      - q: Posso extrair páginas de um PDF protegido por senha?
        a: "Se você souber a senha, sim: ela é pedida ao abrir o arquivo. O PDF extraído é salvo sem senha."
      - q: Funciona no celular?
        a: "Sim. Toque nas páginas para selecioná-las e mantenha uma miniatura pressionada para movê-la."

  rotate:
    slug: girar-pdf
    nav: Girar PDF
    card: Gire 90° uma página ou o documento inteiro e salve na posição certa.
    title: "Girar PDF online e salvar na posição certa, grátis"
    description: "Girar PDF ou uma única página 90° para a esquerda ou para a direita e salvar de forma permanente. Grátis, no navegador, sem upload e sem cadastro."
    h1: 'Girar páginas de PDF e <span class="hl">salvar</span> assim'
    h1_plain: Girar PDF
    lede: "Corrija um escaneamento que saiu de lado ou de cabeça para baixo. Gire páginas avulsas ou o documento inteiro e baixe um PDF que abre na posição certa em qualquer lugar."
    suffix: girado
    hint: "Gire uma página com as setas da miniatura, ou selecione páginas (nenhuma = todas) e use Esquerda / Direita."
    stepsTitle: Como girar um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página e veja todas as páginas em miniatura."
      - h: Gire
        p: "Use ↺ ou ↻ em uma única página, ou selecione várias (ou nenhuma, para o arquivo todo) e clique em <b>Esquerda</b> ou <b>Direita</b>."
      - h: Baixe
        p: "A rotação fica salva no arquivo: ele vai abrir certo em qualquer leitor, em qualquer dispositivo."
    body: |
      ## Girar PDF de forma permanente, não só na tela

      O botão de girar da maioria dos leitores de PDF só muda a visualização. Você fecha o arquivo, envia, e ele está de lado de novo. O pdfanonym grava a rotação no próprio PDF, então qualquer leitor mostra as páginas na posição certa. Para documentos fotografados com o celular, primeiro converta de [JPG para PDF](/pt/jpg-para-pdf/) e depois endireite as páginas aqui.

      ## Girar só algumas páginas

      Documentos que misturam retrato e paisagem são comuns: um relatório com uma tabela larga, um escaneamento em que uma folha entrou ao contrário. Gire essas páginas uma a uma com as setas das miniaturas e deixe as outras como estão. Se as páginas também estiverem fora de ordem, você pode [organizar as páginas do PDF](/pt/organizar-paginas-pdf/) arrastando as miniaturas.

      ## Sem perda de qualidade

      A rotação é uma configuração da página, não uma transformação de imagem. O texto continua sendo texto, nada é recomprimido e o tamanho do arquivo quase não muda. Tudo acontece no navegador, assim como a [tarja de PDF feita no seu computador](/pt/tarjar-pdf/).
    faq:
      - q: Como giro todas as páginas de uma vez?
        a: "Confira se nenhuma página está selecionada e clique em Esquerda ou Direita: a rotação vale para o documento inteiro."
      - q: A rotação fica salva?
        a: "Sim. Ela é gravada no PDF baixado, então ele abre na posição certa em qualquer leitor."
      - q: Posso girar 180°?
        a: "Clique duas vezes na mesma seta."
      - q: Girar reduz a qualidade?
        a: "Não. Só muda a configuração de orientação da página; texto e imagens não são recodificados."

  reorder:
    slug: organizar-paginas-pdf
    nav: Organizar páginas
    card: Arraste e solte as miniaturas para colocar as páginas de um PDF na ordem certa.
    title: "Organizar páginas PDF online: arrastar e soltar, grátis"
    description: "Organizar páginas PDF arrastando e soltando, juntar vários arquivos e baixar o resultado. Grátis, no navegador, sem upload e sem precisar de cadastro."
    h1: 'Organizar páginas PDF <span class="hl">arrastando e soltando</span>'
    h1_plain: Organizar páginas PDF
    lede: "Mova as páginas até o documento ficar na ordem certa, adicione páginas de outros PDFs e baixe um arquivo limpo. Nada sai do seu computador."
    suffix: organizado
    hint: "Arraste uma miniatura para movê-la. No celular, mantenha pressionado e depois arraste."
    stepsTitle: Como organizar as páginas de um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo aqui. Adicione mais arquivos com <b>Adicionar PDF</b> para juntá-los."
      - h: Arraste as páginas para o lugar
        p: "Arraste uma miniatura e solte onde ela deve ficar. Se precisar, exclua ou gire páginas no caminho."
      - h: Baixe
        p: "Clique em <b>Baixar</b> para salvar o PDF na nova ordem."
    body: |
      ## Organizar páginas PDF em segundos

      Escaneou um documento fora de ordem? Precisa do resumo antes dos anexos, ou da página assinada no final? Arraste as miniaturas para o lugar: os números das páginas se atualizam na hora e Ctrl/Cmd+Z desfaz qualquer movimento. Páginas em branco ou repetidas? Dá para [excluir páginas do PDF](/pt/excluir-paginas-pdf/) antes de baixar.

      ## Junte e organize vários PDFs

      Use **Adicionar PDF** para trazer outros arquivos. Todas as páginas aparecem em uma só grade, então você pode intercalá-las, remover as que não precisa e baixar um único documento bem organizado. Se só quiser unir arquivos inteiros, use [juntar PDF](/pt/juntar-pdf/).

      ## O que é mantido

      Cada página é copiada como está: texto, fontes, imagens, comentários e links da web. O documento não é refeito como imagens, então continua leve e pesquisável. Com a ordem definida, você pode [numerar as páginas do PDF](/pt/numerar-paginas-pdf/). Para esconder um dado antes de compartilhar, use a [tarja de PDF no seu computador](/pt/tarjar-pdf/).
    faq:
      - q: Posso mover várias páginas de uma vez?
        a: "Mova uma por vez arrastando; cada movimento leva um segundo e Ctrl/Cmd+Z desfaz o último."
      - q: Posso juntar PDFs aqui?
        a: "Sim. Clique em “Adicionar PDF” (ou solte vários arquivos de uma vez) para combiná-los, organize as páginas e baixe um único arquivo."
      - q: Os marcadores acompanham a nova ordem?
        a: "Não. O novo arquivo é montado página por página e não mantém os marcadores originais (sumário), nem os links que levam a outra página do documento. Os links da web nas páginas são mantidos."
      - q: Funciona no celular?
        a: "Sim. Mantenha uma miniatura pressionada e depois arraste para o novo lugar."

  grayscale:
    slug: pdf-preto-e-branco
    nav: Preto e branco
    card: Converta um PDF colorido para escala de cinza com o texto nítido e selecionável.
    title: "PDF preto e branco: converter para escala de cinza grátis"
    description: "Deixe seu PDF preto e branco no navegador: o texto continua selecionável, as imagens passam para escala de cinza e nada é enviado. Grátis, sem cadastro."
    h1: 'Converter PDF para <span class="hl">preto e branco</span>'
    h1_plain: Converter PDF para preto e branco
    lede: "Deixe seu PDF preto e branco para economizar tinta, atender às exigências de uma gráfica ou preparar um documento para impressão sem cor. Cada cor vira um tom da escala de cinza, e o texto continua sendo texto de verdade, selecionável."
    suffix: pb
    reportCaption: Este PDF
    runLabel: Converter para preto e branco e baixar
    stepsTitle: Como converter um PDF para preto e branco
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. Ele é processado no seu computador."
      - h: Converta
        p: "Clique no botão. Texto, formas, imagens, comentários e aparência dos campos de formulário passam para escala de cinza."
      - h: Confira e baixe
        p: "O novo arquivo é baixado na hora, e uma prévia da primeira página aparece para você conferir o resultado."
    body: |
      ## PDF preto e branco sem transformar as páginas em imagens

      Para deixar um PDF preto e branco, muitos conversores "imprimem" cada página como imagem e depois juntam essas imagens em um PDF. Funciona, mas o texto deixa de ser texto: você não consegue selecionar, pesquisar nem copiar, e o arquivo muitas vezes fica bem mais pesado. O pdfanonym reescreve as cores dentro do próprio documento, em escala de cinza. O texto continua nítido em qualquer zoom, os links seguem funcionando e o arquivo costuma ficar mais leve que o original, porque as fotos coloridas viram imagens em escala de cinza com um só canal. Se o objetivo é só reduzir o tamanho, [comprimir o PDF](/pt/comprimir-pdf/) mantém as cores.

      ## O que é convertido

      | Elemento | Resultado |
      |---|---|
      | Texto e formas coloridos (RGB e CMYK) | Tons de cinza com o mesmo brilho |
      | Fotos e ilustrações | Imagens em escala de cinza |
      | Comentários, carimbos, aparência dos campos de formulário | Escala de cinza |
      | Texto | Continua sendo texto de verdade, selecionável |

      O brilho é preservado com a fórmula padrão de luminância: cores claras continuam claras e cores escuras continuam escuras. Um título vermelho não vira um bloco preto.

      ## Limites

      Alguns elementos raros ficam como estão e são indicados depois da conversão: degradês suaves (sombreamentos), cores especiais usadas em arquivos de impressão profissional e imagens minúsculas embutidas direto no código da página. A prévia mostra o resultado para você conferir antes de imprimir.

      ## Preto e branco ou escala de cinza?

      O que quase todo mundo chama de "preto e branco" é escala de cinza: 256 tons entre o preto e o branco, o que mantém as fotos legíveis. É isso que esta ferramenta gera. Depois, a impressora reproduz os cinzas só com tinta preta. Se só algumas páginas vão para a impressora, você pode [extrair páginas do PDF](/pt/extrair-paginas-pdf/) antes de converter.
    faq:
      - q: O texto vai continuar selecionável?
        a: "Sim. O texto não é transformado em imagem: você pode selecionar, pesquisar e copiar exatamente como antes."
      - q: O arquivo fica menor?
        a: "Muitas vezes sim, porque as imagens coloridas são salvas com um canal em vez de três. Arquivos que só têm texto quase não mudam."
      - q: Posso converter só algumas páginas?
        a: "Não nesta ferramenta. Use antes <a href=\"/pt/extrair-paginas-pdf/\">Extrair páginas</a> para ficar só com as páginas que você precisa e depois converta esse arquivo."
      - q: Por que algo continuou colorido?
        a: "Degradês suaves e cores especiais profissionais não são convertidos. Eles são raros em documentos de escritório; o relatório depois da conversão avisa se o seu arquivo tem algum."

  anonymize:
    slug: anonimizar-pdf
    nav: Anonimizar PDF
    card: Detecte e-mails, telefones, IBANs e nomes automaticamente e tarje tudo com um clique.
    title: "Anonimizar PDF: detectar e tarjar dados pessoais na hora"
    description: "Anonimizar PDF: encontre e-mails, telefones, IBANs, cartões e nomes automaticamente e tarje tudo de vez. Alinhado à LGPD: o arquivo não sai do navegador."
    h1: 'Anonimizar PDF: os dados pessoais <span class="redacted">encontrados</span> para você'
    h1_plain: Anonimizar PDF
    lede: "Para anonimizar um PDF, basta abrir o documento: o pdfanonym varre cada página atrás de e-mails, telefones, dados bancários, números de cartão e nomes, e deixa você tarjar tudo de uma vez. Nada é enviado."
    black: true
    suffix: anonimizado
    stepsTitle: Como anonimizar um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. A análise começa sozinha, no seu computador."
      - h: Confira o que foi encontrado
        p: "Os dados pessoais aparecem agrupados por tipo, com exemplos. Desmarque o que deve ficar e clique em <b>Marcar selecionados</b>. Acrescente o que faltar à mão ou pela caixa de busca."
      - h: Tarje e baixe
        p: "Pressione <kbd>Del</kbd> ou clique em <b>Aplicar</b>: o texto é apagado do arquivo. Os metadados ocultos também são removidos."
    body: |
      ## O que a análise detecta ao anonimizar um PDF

      | Dado | Como é verificado |
      |---|---|
      | Endereços de e-mail | Formato padrão de endereço |
      | Números de telefone | Formatos internacionais (+33, +49…) e nacionais |
      | IBANs | Dígito de controle oficial (mod 97): números inválidos são ignorados |
      | Números de cartão bancário | Algoritmo de Luhn; números de empresa como o SIRET ficam de fora |
      | Números da seguridade social francesa | Chave de controle verificada |
      | Endereços IP | Só faixas válidas |
      | Nomes após um tratamento | Mr, Mrs, Dr, Monsieur, Madame, Herr, Frau, Sr., Sra., Sig.… |
      | Datas | Detectadas, mas deixadas desmarcadas, porque os documentos estão cheios de datas que não são pessoais |

      Os dígitos de controle fazem diferença: eles mantêm os falsos positivos baixos, então você pode confiar na lista em vez de revisar centenas de números aleatórios.

      ## O que ela não consegue adivinhar

      Um nome escrito sem tratamento ("João Silva assinou…") parece qualquer outra palavra, por isso não é detectado automaticamente. Digite o nome na caixa de busca e pressione **Marcar tudo**: todas as ocorrências são encontradas, em maiúsculas ou não, com ou sem acento. Endereços postais e informações escritas à mão também não são detectados: para esses trechos, use a ferramenta para [tarjar PDF](/pt/tarjar-pdf/) e marque-os à mão. Leia sempre o documento uma vez antes de compartilhar, seguindo as verificações do guia [como tarjar um PDF](/pt/como-tarjar-um-pdf/).

      ## Por que anonimizar no seu computador

      Enviar um arquivo cheio de dados pessoais a um serviço online justamente para tirar esses dados é uma contradição: pela LGPD, isso significa envolver mais um operador no tratamento. O pdfanonym roda inteiramente no seu navegador, então os dados nunca saem do seu dispositivo. Se você tem dezenas de arquivos para tratar, dá para [anonimizar PDF em lote](/pt/anonimizar-pdf-em-lote/).
    faq:
      - q: Os dados detectados são removidos de verdade?
        a: "Sim, depois que você aplica a tarja. Os caracteres são apagados do arquivo, não escondidos sob um retângulo, e os metadados do documento (autor, título…) também são limpos."
      - q: Funciona com PDFs digitalizados?
        a: "Não: uma digitalização contém imagens, não texto, então não há nada para analisar. Use o modo Área para tarjar trechos à mão."
      - q: Quais idiomas e países são cobertos?
        a: "E-mails, telefones internacionais, IBANs, cartões e endereços IP funcionam para qualquer país. Os tratamentos são reconhecidos em inglês, francês, alemão, espanhol, italiano e português. Os números de seguridade social são verificados no formato francês."
      - q: Posso manter alguns dos itens detectados?
        a: "Sim. Desmarque uma categoria antes de marcar ou retire marcações individuais da lista à direita."

  merge:
    slug: juntar-pdf
    nav: Juntar PDF
    card: Una vários PDFs em um só arquivo, na ordem que você escolher.
    title: "Juntar PDF online: unir arquivos grátis e sem upload"
    description: "Juntar PDF no navegador: solte vários arquivos, organize as páginas arrastando e soltando e baixe um documento único. Grátis, sem upload e sem cadastro."
    h1: 'Juntar PDF <span class="hl">sem enviar seus arquivos</span>'
    h1_plain: Juntar PDF
    lede: "Para juntar PDF ou unir PDF em um só documento, solte vários arquivos de uma vez, coloque as páginas na ordem certa e baixe. Tudo é combinado no seu próprio computador."
    suffix: unido
    hint: "Solte vários arquivos de uma vez ou use “Adicionar PDF”. Arraste as miniaturas para mudar a ordem."
    stepsTitle: Como juntar arquivos PDF
    steps:
      - h: Solte seus PDFs
        p: "Selecione vários arquivos de uma vez ou adicione um por um com <b>Adicionar PDF</b>."
      - h: Organize as páginas
        p: "Cada página aparece como miniatura. Arraste para mudar a ordem e, se precisar, gire ou exclua páginas."
      - h: Baixe
        p: "Clique em <b>Baixar</b> para receber um único PDF."
    body: |
      ## Juntar PDF e organizar de uma vez

      Juntar PDF raramente é só colar um arquivo atrás do outro. Aqui, todas as páginas de todos os arquivos aparecem em uma só grade: você coloca a página assinada no lugar certo, tira uma página em branco ou endireita uma digitalização de lado antes de baixar. Se precisar só mudar a ordem das páginas de um único arquivo, use [organizar páginas PDF](/pt/organizar-paginas-pdf/).

      ## Qualidade e links

      As páginas são copiadas como estão: o texto continua sendo texto, as imagens mantêm a resolução, e os comentários e links da web são preservados. Os recursos compartilhados por várias páginas do mesmo arquivo são guardados uma só vez, então o resultado continua leve. Se ainda ficar grande demais para um e-mail, dá para [comprimir o PDF](/pt/comprimir-pdf/) em seguida.

      ## Privado desde a concepção

      Unir PDF de contratos, holerites ou exames médicos em um site que exige upload significa mandar todos eles para um servidor. Aqui, eles nunca saem do seu dispositivo. Depois de juntar, você ainda pode [numerar as páginas do PDF](/pt/numerar-paginas-pdf/) do dossiê, também sem upload.
    faq:
      - q: Quantos arquivos posso juntar?
        a: "Não há limite fixo. Conjuntos muito grandes dependem da memória do seu computador."
      - q: Posso juntar PDFs protegidos por senha?
        a: "Sim, se você souber as senhas: cada uma é pedida quando o arquivo é adicionado. O arquivo final não tem senha; adicione uma com a ferramenta Proteger PDF, se precisar."
      - q: Os marcadores são mantidos?
        a: "Não. O arquivo final não mantém os marcadores originais (sumário) nem os links que levam a outra página. Os links da web são mantidos."

  add_text:
    slug: adicionar-texto-pdf
    nav: Adicionar texto
    card: Escreva em qualquer lugar de uma página PDF, como num formulário sem campos.
    title: "Adicionar texto em PDF online: escreva onde quiser, grátis"
    description: "Adicionar texto em PDF no navegador: clique onde quiser, digite, escolha tamanho e cor e baixe. Texto de verdade, sem upload, sem cadastro, sem marca d’água."
    h1: 'Adicionar texto em PDF, <span class="hl">em qualquer lugar da página</span>'
    h1_plain: Adicionar texto em PDF
    lede: "Adicione texto em PDF para preencher um formulário sem campos, incluir uma data ou uma observação, ou completar um documento antes de imprimir. Clique, digite, baixe."
    suffix: editado
    hint: "Clique em uma página para digitar. Arraste um texto para movê-lo, clique nele para editar, Del para apagar."
    stepsTitle: Como adicionar texto em um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. Ele abre no seu computador."
      - h: Clique e digite
        p: "Clique onde o texto deve ficar e digite. Escolha o tamanho e a cor na barra de ferramentas; arraste um texto para movê-lo."
      - h: Baixe
        p: "O texto é gravado no PDF como texto de verdade, selecionável."
    body: |
      ## Adicionar texto em PDF como texto de verdade, não como imagem

      O que você digita é adicionado à página como texto real, em uma fonte padrão (Helvetica). Ele fica nítido em qualquer zoom, pode ser selecionado e pesquisado, e sai na impressão exatamente como aparece na tela.

      ## Usos comuns

      - Preencher um formulário "plano", que tem caixas desenhadas na página mas nenhum campo preenchível. Se o formulário tem campos, preencha-os e depois [achate o PDF](/pt/achatar-pdf/) para fixar as respostas.
      - Acrescentar uma data, uma referência ou "Lido e aprovado" antes de assinar.
      - Escrever uma observação em uma planta ou documento antes de devolvê-lo.
      - Corrigir uma palavra: [edite o texto do PDF](/pt/editar-texto-pdf/) diretamente, clicando na palavra e digitando a nova.

      Para incluir também uma assinatura à mão, mude para **Assinatura** na barra de ferramentas ou use [Assinar PDF](/pt/assinar-pdf/).

      ## Caracteres

      O texto é escrito em Helvetica, que cobre o alfabeto latino com os acentos da Europa Ocidental (é, ü, ñ, ç, ß…). Caracteres fora desse conjunto, como o cirílico ou o chinês, são substituídos por um ponto de interrogação.
    faq:
      - q: Posso editar um texto que já estava no PDF?
        a: "Não com esta ferramenta: ela adiciona texto novo. Para mudar uma palavra que já está lá, use Editar texto: clique na palavra e digite a nova."
      - q: Posso escrever várias linhas?
        a: "Sim. Pressione Enter enquanto digita para começar uma nova linha."
      - q: O texto adicionado pode ser editado depois?
        a: "Não no pdfanonym depois de baixado: ele passa a fazer parte da página. Guarde o original se puder precisar de alterações."

