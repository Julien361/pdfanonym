    stepsTitle: Como funciona a anonimização em lote
    steps:
      - h: Solte seus PDFs
        p: "Selecione quantos arquivos precisar. Eles são processados um após o outro no seu computador."
      - h: Escolha o que tarjar
        p: "Marque as categorias (e-mails, telefones, IBANs, nomes, endereços…) e adicione seus próprios termos: nomes de clientes, números de processo, códigos internos."
      - h: Baixe o ZIP
        p: "Cada arquivo é tarjado e limpo de metadados. Um relatório CSV lista, para cada arquivo e página, quantos itens foram removidos em cada categoria."
    body: |
      ## Feito para o trabalho recorrente

      Responder a pedidos de acesso da LGPD ou do RGPD, preparar autos, publicar decisões, compartilhar documentos de RH com um auditor: quando os mesmos tipos de dados precisam sumir de muitos documentos, o modo em lote faz em uma só passada o que levaria uma tarde inteira.

      ## O que é detectado

      Tudo o que o [anonimizador gratuito](/pt/anonimizar-pdf/) encontra (e-mails, telefones, IBANs, cartões, números de seguridade social, IPs, nomes após pronome de tratamento), mais a detecção Pro: nomes escritos sem pronome de tratamento, endereços postais, datas de nascimento, placas de veículos e números de IVA. Suas listas de termos são aplicadas a todos os arquivos, sem diferenciar maiúsculas e acentos.

      ## Confira antes de compartilhar

      A detecção automática não é exaustiva. O relatório CSV ajuda você a identificar os arquivos em que nada ou muito pouco foi encontrado, que merecem uma leitura mais atenta. O texto de páginas digitalizadas não é analisado. Lembre também que os campos autor e título podem conter nomes: saiba como [remover metadados de PDF](/pt/remover-metadados-pdf/).
    faq:
      - q: O modo em lote está incluído no plano Pro?
        a: "Sim, nos planos Passe de 24 horas, Pro e Equipe."
      - q: Quantos arquivos posso processar de uma vez?
        a: "Não há limite fixo. Os arquivos são processados um por um, então o limite é a memória do seu computador e a sua paciência: centenas de documentos comuns funcionam bem."
      - q: Meus arquivos são enviados para o processamento em lote?
        a: "Não. Como todas as ferramentas do pdfanonym, o modo em lote roda inteiramente no seu navegador."

