  edit_text:
    slug: editar-texto-pdf
    nav: Editar texto
    card: Clique em qualquer palavra do PDF e substitua-a, na mesma fonte.
    title: 'Editar texto de PDF: clique numa palavra e substitua, grátis'
    description: 'Edite o texto de um PDF no navegador: clique numa palavra, digite a nova e baixe. Mesma posição, tamanho e cor. Sem envio, sem marca d''água.'
    h1: Editar o texto de um PDF, <span class="hl">palavra por palavra</span>
    h1_plain: Editar o texto de um PDF
    lede: 'Uma data, um nome, um valor, um erro de digitação: clique na palavra do PDF, digite a certa e pronto. O texto antigo é realmente removido do arquivo.'
    suffix: editado
    hint: Clique numa palavra, digite o novo texto e pressione Enter para confirmar (Esc para cancelar, Tab para a próxima palavra). Deixe vazio para apagar a palavra.
    stepsTitle: Como editar o texto de um PDF
    steps:
    - h: Abra o PDF
      p: Arraste-o para a página. Ele abre no seu computador; nada é enviado.
    - h: Clique numa palavra
      p: A palavra fica editável. Digite a substituição e pressione Enter. Para substituir várias palavras de uma vez, arraste de uma à outra.
    - h: Baixe
      p: Cada alteração aparece na hora exatamente como ficará no arquivo. Desfazer volta atrás; Baixar salva o PDF editado.
    body: '## A palavra é substituída, não coberta


      Muitas ferramentas “editam” um PDF colocando um retângulo branco sobre o texto antigo e escrevendo por cima. A palavra antiga continua no arquivo e reaparece ao copiar e colar ou numa busca. Aqui, a palavra original é realmente removida da página e a nova é escrita exatamente no lugar dela, na mesma linha de base. O fundo (cor, moldura, imagem) não é alterado.


      ## Mesma fonte, mesmo tamanho, mesma cor


      Quando a fonte do documento contém todas as letras que você digita, ela é reutilizada e o resultado combina com o resto da página. Caso contrário, é escolhida a fonte padrão mais próxima (sem serifa, com serifa ou monoespaçada, em negrito ou itálico como a original), no mesmo tamanho e na mesma cor. Se a nova palavra for mais longa ou mais curta, o resto da frase se desloca para manter o espaçamento; uma coluna de tabela separada por um espaço largo não se mexe.


      ## Usos comuns


      - Corrigir uma data, uma referência ou um valor sem refazer o documento inteiro.

      - Consertar um erro de digitação num PDF cujo arquivo Word você não tem mais.

      - Atualizar um nome, um endereço ou um número de telefone.


      Para reescrever parágrafos inteiros, [converta o PDF para Word](/pt/pdf-para-word/): o layout é mantido e todo o texto fica editável no Word.

      Para escrever onde ainda não há texto, use [Adicionar texto](/pt/adicionar-texto-pdf/). Para remover de vez informações sensíveis sem substituí-las, [tarje o PDF](/pt/tarjar-pdf/).


      ## Limites


      Um PDF digitalizado contém apenas uma imagem da página, então não há palavras para editar. Texto vertical ou girado não é editável. Caracteres fora do alfabeto latino da Europa Ocidental só podem ser escritos se a fonte do documento já os contiver.

      '
    faq:
    - q: O texto antigo fica escondido no arquivo?
      a: Não. A palavra original é apagada do conteúdo da página antes de a nova ser escrita. Ela não reaparece ao copiar e colar nem numa busca.
    - q: Posso substituir uma frase inteira?
      a: 'Sim. Arraste da primeira à última palavra da linha: elas são substituídas juntas pelo que você digitar. Uma frase em várias linhas é editada linha por linha.'
    - q: Por que a fonte não é exatamente a mesma?
      a: Os PDFs costumam incorporar só as letras usadas no documento. Se você digitar uma letra que falta, a fonte padrão mais próxima é usada para essa palavra, no mesmo tamanho e na mesma cor.
    - q: Meu arquivo é enviado a um servidor?
      a: Não. Tudo acontece no seu navegador; o PDF não sai do seu computador.
