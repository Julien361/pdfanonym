  guide:
    slug: como-tarjar-um-pdf
    nav: Como tarjar um PDF
    title: "Como tarjar um PDF corretamente (e conferir se funcionou)"
    description: "Guia prático para tarjar PDF: por que a caixa preta falha, como tarjar grátis, como lidar com digitalizações e metadados, e cinco verificações antes de enviar."
    h1: Como tarjar um PDF corretamente
    lede: "Tarjar um PDF leva um minuto. Tarjar mal leva o mesmo minuto, e o erro só aparece quando outra pessoa encontra o texto. Veja como fazer do jeito certo."
    cta_tool: redact
    cta: Abrir a ferramenta gratuita de tarja
    body: |
      ## A resposta curta

      Use uma ferramenta que **remove** o texto, não uma que só o cobre. Abra seu PDF na [ferramenta de tarja do pdfanonym](/pt/tarjar-pdf/), selecione o que precisa sair (ou busque), clique em **Aplicar**, baixe e confira o resultado tentando copiar e buscar as palavras tarjadas. Se nada aparecer, a tarja funcionou.

      O resto deste guia explica por que essa verificação importa e como lidar com os casos que costumam enganar as pessoas.

      ## Por que retângulos pretos falham

      Uma página de PDF é montada a partir de instruções: "escreva estes caracteres aqui", "desenhe esta forma ali". Quando você desenha um retângulo preto sobre um nome, só acrescenta mais uma instrução por cima. A instrução que escreve o nome continua no arquivo.

      O resultado parece perfeito na tela e no papel. Mas selecione a área e copie, e o nome vai parar na sua área de transferência. Faça uma busca no documento, e o leitor vai direto até ele. Ferramentas de extração de texto, mecanismos de busca e assistentes de IA leem as palavras escondidas tão facilmente quanto as visíveis.

      Não é um risco teórico. Em 2019, uma petição apresentada à justiça pelos advogados de Paul Manafort nos Estados Unidos continha trechos "tarjados" que jornalistas recuperaram simplesmente copiando e colando. Deslizes parecidos já expuseram manuais de segurança, contratos e dados pessoais em vários países.

      ## Passo a passo: tarjar um PDF com texto

      1. **Guarde o original.** A tarja é definitiva por natureza. Trabalhe numa cópia.
      2. **Abra o arquivo** numa ferramenta de tarja de verdade. Com o pdfanonym, solte o arquivo na [página de tarja](/pt/tarjar-pdf/); ele abre localmente.
      3. **Encontre todas as ocorrências.** Digite um nome, uma referência ou um número na busca e clique em *Marcar tudo*. A busca ignora maiúsculas e acentos, então "Conceição" também encontra "CONCEICAO". Repita para cada informação. Para e-mails, telefones e IBANs, você também pode [anonimizar o PDF](/pt/anonimizar-pdf/) com a detecção automática.
      4. **Marque o resto à mão.** Arraste sobre os trechos, clique em palavras isoladas, dê um clique duplo numa linha para pegá-la inteira.
      5. **Aplique.** O texto sob cada marcação é apagado e substituído por uma tarja preta (ou por um espaço em branco, se preferir).
      6. **Remova também os metadados.** Deixe a opção marcada: os campos autor, título e software muitas vezes contêm exatamente os nomes que você acabou de tarjar. Para conferir ou editar esses campos à parte, use a ferramenta para [remover metadados de PDF](/pt/remover-metadados-pdf/).
      7. **Baixe e confira** (veja abaixo).

      ## Tarjar um PDF digitalizado

      Uma digitalização é uma foto da página. Não existe texto para apagar, só pixels. Isso tem duas consequências:

      - Buscar um nome não encontra nada, então você precisa localizar cada ocorrência a olho.
      - A tarja precisa alterar a própria imagem. No pdfanonym, mude para o modo **Área**, marque **imagens** nas opções e desenhe um retângulo sobre cada trecho: os pixels dentro dele são apagados da imagem.

      Algumas digitalizações também trazem uma camada de texto invisível gerada por OCR, que o scanner acrescenta para que o documento possa ser pesquisado. Nesse caso, essa camada oculta também precisa sair. O modo Área remove tanto o texto quanto a imagem sob o retângulo.

      ## Cinco verificações antes de enviar

      1. **Teste da cópia.** Selecione a área tarjada, copie e cole num editor de texto simples. Nada deve aparecer.
      2. **Teste da busca.** Busque no PDF cada palavra tarjada. Zero resultados.
      3. **Teste das propriedades.** No seu leitor, abra Arquivo e depois Propriedades. Autor, título e assunto não devem revelar nada.
      4. **Teste dos comentários.** Abra o painel de comentários: notas de revisão podem citar justamente o trecho que você removeu. Para incorporar formulários e comentários à página antes da tarja, você pode [achatar o PDF](/pt/achatar-pdf/).
      5. **Teste dos anexos.** Procure um ícone de clipe ou um painel de anexos. Um arquivo incorporado pode conter o original sem tarja.

      ## Tarja e LGPD

      Ao atender a uma solicitação do titular com base na LGPD, o documento a ser entregue pode conter dados de outras pessoas, e a tarja é a forma habitual de retirá-los. Fazer isso num serviço que exige upload significa enviar os dados dessas pessoas para mais um operador, o que você depois teria de justificar. Uma ferramenta que funciona localmente elimina essa questão por completo. Quando são dezenas de documentos, dá para [anonimizar PDF em lote](/pt/anonimizar-pdf-em-lote/) de uma só vez.
    faq:
      - q: Um PDF tarjado pode ser destarjado?
        a: "Se o texto foi realmente removido, não: não sobra nada para recuperar. Se ele só foi coberto por uma forma, sim, muitas vezes com um simples copiar e colar. É por isso que o teste da cópia é tão importante."
      - q: O Adobe Acrobat Reader tarja de graça?
        a: "O Reader gratuito não inclui a tarja de verdade; ela é reservada às versões pagas do Acrobat. Desenhar um retângulo com as ferramentas de comentário não tarja nada."
      - q: E para tarjar no celular?
        a: "O pdfanonym funciona em navegadores de celular: abra a página de tarja, escolha o PDF nos seus arquivos e marque o texto com o dedo. Para documentos longos, um computador é mais confortável."

  privacy:
    slug: privacidade
    nav: Privacidade
    title: "Privacidade: seus arquivos ficam com você · pdfanonym"
    description: "O pdfanonym processa PDFs no seu navegador. Não recebemos, não armazenamos e não vemos seus arquivos, e não usamos cookies nem rastreadores."
    h1: Privacidade
    lede: "Resumindo: nunca vemos seus arquivos e não rastreamos você."
    body: |
      ## Seus documentos

      Os PDFs que você abre no pdfanonym são processados **dentro do seu navegador**, no seu próprio dispositivo, por um motor de PDF baixado junto com a página. Eles não são enviados para os nossos servidores nem para os de ninguém. Não temos cópia deles, não temos como lê-los e não há nada para apagar.

      Você pode conferir: abra as ferramentas de desenvolvedor do navegador, selecione a aba Rede (Network) e processe um arquivo. Nenhuma requisição carrega o seu documento. O site também envia um cabeçalho Content-Security-Policy que impede a página de se conectar a qualquer outro domínio.

      ## Cookies e rastreamento

      O pdfanonym **não grava cookies**, **não usa scripts de análise nem de publicidade** e **não carrega recursos de terceiros** (fontes e scripts são servidos pelo nosso próprio domínio). Seu navegador pode guardar pequenas preferências localmente; elas nunca saem do seu dispositivo.

      ## Compras

      Se você comprar um plano Pro, o pagamento é processado pela Stripe, que trata seu cartão, seu e-mail e seus dados de cobrança de acordo com a própria política de privacidade; nunca vemos o número do seu cartão. Nosso serviço de licenças recebe apenas o identificador da sua sessão de pagamento Stripe e devolve uma chave de licença assinada, que fica guardada no seu navegador. Os registros de cobrança (nome, e-mail, endereço, número de IVA, faturas) são mantidos pela Stripe e pela METIS pelo prazo exigido pela legislação contábil. Seus arquivos PDF nunca estão envolvidos. Para saber quais sites nos trazem clientes, seu navegador também guarda o site de onde você veio e a primeira página visitada no pdfanonym (sem cookies nem identificadores); essa informação só é enviada à Stripe com o seu pedido se você comprar.

      ## Logs do servidor

      Como qualquer site, nosso provedor de hospedagem (Cloudflare) processa os dados técnicos necessários para entregar as páginas, como seu endereço IP e o tipo de navegador, e pode manter logs de curta duração por segurança. Esses logs nunca incluem seus documentos.

      ## Contato

      Dúvidas sobre privacidade: contact@pdfanonym.com.

