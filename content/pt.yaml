    body: |
      ## Licença

      O site é distribuído sob a **GNU Affero General Public License, versão 3** (AGPL-3.0). Ele usa o [MuPDF](https://mupdf.com), da Artifex Software, sob a mesma licença, compilado para WebAssembly.

      ## Download

      - [Código-fonte completo deste site (zip)](/source/pdfanonym-source.zip): templates, textos, scripts, estilos e script de build.
      - GitHub : [github.com/Julien361/pdfanonym](https://github.com/Julien361/pdfanonym)
      - O motor de PDF é o pacote oficial [mupdf.js](https://www.npmjs.com/package/mupdf), incluído sem modificações no arquivo compactado (pasta `src/assets/mupdf`). O código-fonte dele é publicado pela Artifex em [github.com/ArtifexSoftware/mupdf.js](https://github.com/ArtifexSoftware/mupdf.js).

      ## Rode você mesmo

      Descompacte o arquivo e sirva a pasta `src` com qualquer servidor web estático, ou rode `python3 build.py` para gerar as páginas de novo. Sem banco de dados, sem backend.

