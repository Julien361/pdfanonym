    suffix: assinado
    hint: "Clique em uma página para posicionar sua assinatura. Arraste para mover, use o canto para redimensionar."
    stepsTitle: Como assinar um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o documento a ser assinado. Ele fica no seu computador."
      - h: Desenhe sua assinatura
        p: "Desenhe com o mouse, o trackpad ou o dedo e clique em <b>Usar esta assinatura</b>."
      - h: Posicione e baixe
        p: "Clique onde ela deve ficar, ajuste o tamanho, acrescente a data com a ferramenta <b>Texto</b> se precisar e baixe."
    body: |
      ## Uma assinatura limpa, com fundo transparente

      Seu desenho é recortado automaticamente e colocado com fundo transparente, então ele se encaixa sobre as linhas de assinatura e tabelas sem uma caixa branca em volta. Você pode colocá-lo em várias páginas e redimensionar cada cópia. Para acrescentar a data ou "Lido e aprovado" ao lado, use [adicionar texto em PDF](/pt/adicionar-texto-pdf/).

      ## Que tipo de assinatura é essa?

      Uma assinatura desenhada é o que o regulamento europeu eIDAS chama de assinatura eletrônica simples. Ela é muito usada em documentos do dia a dia: orçamentos, comprovantes de entrega, formulários internos, contratos de aluguel entre particulares. Alguns documentos exigem uma assinatura eletrônica avançada ou qualificada, baseada em um certificado e na verificação de identidade; para esses, use um serviço de assinatura especializado.

      ## Sua assinatura fica com você

      A imagem da assinatura é criada no seu navegador e gravada no PDF no seu computador. Ela nunca é enviada nem guardada por nós. Depois de assinar, você pode [achatar o PDF](/pt/achatar-pdf/) para fixar a assinatura na página e [proteger o PDF com senha](/pt/proteger-pdf/) antes de enviá-lo.
    faq:
      - q: Posso assinar pelo celular?
        a: "Sim. Abra a página no celular, desenhe com o dedo e toque onde a assinatura deve ficar."
      - q: Posso adicionar a data e o meu nome?
        a: "Sim. Mude para a ferramenta Texto na barra de ferramentas, clique ao lado da assinatura e digite."
      - q: Minha assinatura fica salva para a próxima vez?
        a: "Não. Nada é guardado: você desenha de novo a cada documento, o que também significa que ninguém pode reutilizá-la a partir deste site."

  watermark:
    slug: marca-dagua-pdf
    nav: Marca d’água
    card: Carimbe CONFIDENCIAL, RASCUNHO ou o seu nome em todas as páginas.
    title: "Marca d’água PDF: adicionar online, grátis e privado"
    description: "Coloque uma marca d’água PDF em texto (CONFIDENCIAL, RASCUNHO, CÓPIA…) em todas as páginas. Escolha opacidade, cor e direção com prévia ao vivo. Sem upload."
    h1: 'Adicionar <span class="hl">marca d’água</span> em PDF'
    h1_plain: Adicionar marca d’água em PDF
    lede: "Com uma marca d’água PDF, você identifica um documento como confidencial, rascunho ou cópia para um destinatário específico. Digite o texto, ajuste com a prévia ao vivo e baixe."
    suffix: marcado
    runLabel: Adicionar marca d’água e baixar
    stepsTitle: Como colocar marca d’água em um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página."
      - h: Configure a marca d’água
        p: "Digite o texto e escolha opacidade, cor e direção. A prévia da primeira página se atualiza enquanto você ajusta."
      - h: Baixe
        p: "A marca d’água é adicionada a todas as páginas."
    body: |
      ## Ideias de marca d’água PDF

      - **CONFIDENCIAL** ou **USO INTERNO** em documentos que não devem circular.
      - **RASCUNHO** em versões que ainda não são finais.
      - **Cópia para [destinatário]** em um documento de identidade ou holerite que você envia a um locador ou a uma imobiliária: se vazar, fica claro de onde veio e para que servia.

      ## O que uma marca d’água faz e o que não faz

      A marca d’água desestimula o uso indevido e deixa evidente a origem de uma cópia. Ela não impede que alguém determinado, com um programa de edição, consiga removê-la. Para uma proteção mais forte, também [achate](/pt/achatar-pdf/) o arquivo e [proteja com senha](/pt/proteger-pdf/).

      ## Caracteres

      A marca d’água usa Helvetica Bold, que cobre o alfabeto latino com os acentos da Europa Ocidental. Outros sistemas de escrita não são suportados.
    faq:
      - q: O texto por baixo da marca d’água continua legível?
        a: "Sim. A marca d’água é semitransparente; ajuste a opacidade entre 5 % e 60 %."
      - q: Posso colocar marca d’água só em algumas páginas?
        a: "Esta ferramenta marca todas as páginas. Para marcar uma seleção, extraia antes essas páginas, aplique a marca d’água e depois junte os arquivos."
      - q: Posso usar uma imagem como marca d’água?
        a: "Ainda não: por enquanto, só marcas d’água em texto."

  page_numbers:
    slug: numerar-paginas-pdf
    nav: Numerar páginas
    card: Numere as páginas de um PDF com a posição e o formato que você escolher.
    title: "Numerar páginas PDF online: grátis e privado"
    description: "Numerar páginas PDF: posição, formato (1, Página 1, Página 1 de 10), número inicial, pular a capa. Prévia ao vivo, no seu navegador, sem upload."
    h1: 'Numerar <span class="hl">páginas</span> de um PDF'
    h1_plain: Numerar páginas PDF
    lede: "Numerar páginas PDF de um relatório, de um anexo ou de um conjunto de documentos leva segundos. Escolha onde ficam os números e como eles aparecem; a prévia se atualiza ao vivo."
    suffix: numerado
    runLabel: Numerar páginas e baixar
    stepsTitle: Como numerar as páginas de um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página."
      - h: Escolha a posição e o formato
        p: "Embaixo ou em cima, à esquerda, no centro ou à direita; 1, Página 1 ou Página 1 de 12; número inicial; pule a capa se precisar."
      - h: Baixe
        p: "Os números são adicionados a todas as páginas como texto de verdade."
    body: |
      ## Formatos para cada uso

      Números simples servem para a maioria dos documentos. "Página 1 de 12" é comum em contratos e documentos oficiais, porque deixa evidente quando falta uma página. Se um documento continua outro, defina o número inicial (por exemplo, 25) e marque **Pular a primeira página (capa)** para deixar a capa sem número. Em documentos sensíveis, combine a numeração com uma [marca d’água no PDF](/pt/marca-dagua-pdf/), como CONFIDENCIAL.

      ## Certo em todas as páginas

      Os números são posicionados em relação ao que você vê na tela, mesmo em páginas giradas ou recortadas, então nunca ficam de lado nem fora da página.

      ## Combine com outras ferramentas

      Montando um conjunto de documentos? [Junte](/pt/juntar-pdf/) os arquivos primeiro e depois numere o resultado, para que a numeração siga por todo o conjunto.
    faq:
      - q: Posso começar a numeração por um número diferente de 1?
        a: "Sim. Defina qualquer número em “Começar em”."
      - q: Posso deixar a capa sem número?
        a: "Sim. Marque “Pular a primeira página (capa)”: a numeração começa na segunda página."
      - q: Os números são texto pesquisável?
        a: "Sim. Eles são adicionados como texto de verdade, em Helvetica."

  compress:
    slug: comprimir-pdf
    nav: Comprimir PDF
    card: Deixe um PDF menor para e-mail e uploads reduzindo as imagens grandes demais.
    title: "Comprimir PDF online: diminuir tamanho grátis e sem upload"
    description: "Comprimir PDF e diminuir tamanho no navegador: imagens grandes são redimensionadas e recomprimidas, fontes são enxugadas. Três níveis, sem upload, sem cadastro."
    h1: 'Comprimir PDF <span class="hl">sem enviar o arquivo</span>'
    h1_plain: Comprimir PDF
    lede: "Pesado demais para mandar por e-mail ou enviar a um portal? Comprimir PDF reduz as imagens grandes demais e os dados inúteis, mantém o texto nítido e mostra o tamanho antes e depois."
    suffix: comprimido
    runLabel: Comprimir e baixar
    stepsTitle: Como comprimir um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. O tamanho atual aparece."
      - h: Escolha um nível
        p: "Leve, Recomendado ou Forte. O Recomendado serve para tela e impressão de escritório."
      - h: Baixe
        p: "Você vê o novo tamanho e a porcentagem economizada. Se não houver economia possível, seu arquivo fica como está."
    body: |
      ## O que deixa um PDF pesado

      Quase sempre, as imagens. Uma foto tirada direto do celular ou uma digitalização a 600 dpi tem muito mais pixels do que a página precisa. Para diminuir tamanho PDF, o pdfanonym reduz cada imagem à resolução que a página consegue de fato exibir (cerca de 220, 150 ou 100 dpi, conforme o nível) e recomprime essa imagem. As fontes são enxugadas para manter só os caracteres usados, e os objetos sem uso são removidos. Para documentos que vão ser impressos, [deixar o PDF preto e branco](/pt/pdf-preto-e-branco/) também reduz o peso das fotos coloridas.

      ## O que esperar

      | Documento | Resultado típico |
      |---|---|
      | Fotos, digitalizações coloridas, apresentações | Grande redução, muitas vezes de 50 % a 90 % |
      | Relatórios mistos | Redução moderada |
      | Documentos só com texto, arquivos já otimizados | Pouca ou nenhuma mudança |

      Texto e desenhos vetoriais nunca são convertidos em imagem, então continuam perfeitamente nítidos em qualquer nível. Se você só precisa de uma imagem da página, converter de [PDF para JPG](/pt/pdf-para-jpg/) pode gerar um arquivo menor.

      ## Arquivos grandes

      Tudo roda no seu computador, então um arquivo digitalizado de 100 páginas pode levar alguns segundos. Não há tempo de upload nem limite de tamanho imposto por um servidor. Se o PDF vai ser criado a partir de fotos, converta de [JPG para PDF](/pt/jpg-para-pdf/) e comprima o resultado aqui.
    faq:
      - q: A compressão reduz a qualidade?
        a: "O Leve mantém as imagens próximas do original. No Recomendado, é difícil notar diferença na tela e na impressão de escritório. O Forte mostra perda visível nas fotos quando você dá zoom. O texto nunca é afetado."
      - q: Por que meu arquivo quase não diminuiu?
        a: "Ele tem poucas imagens, ou as imagens já estavam comprimidas. Nesse caso, a ferramenta avisa e mantém seu arquivo como está."
      - q: Existe limite de tamanho?
        a: "Nós não impomos limite; arquivos muito grandes dependem da memória do seu computador."

  pdf_to_jpg:
    slug: pdf-para-jpg
    nav: PDF para JPG
    card: Transforme cada página de um PDF em uma imagem JPG ou PNG.
    title: "PDF para JPG online: converter páginas em imagens, grátis"
    description: "Converta PDF para JPG ou PNG: cada página vira uma imagem, em qualidade de tela ou de impressão. Várias páginas são baixadas em ZIP. Sem upload, sem cadastro."
    h1: 'Converter PDF para <span class="hl">imagens JPG</span>'
    h1_plain: PDF para JPG
    lede: "Converta PDF para JPG para compartilhar uma página nas redes sociais, inserir numa apresentação ou enviar onde PDFs não são aceitos. Cada página vira uma imagem."
    suffix: imagens
    runLabel: Converter e baixar
    stepsTitle: Como converter PDF para JPG
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página."
      - h: Escolha formato e qualidade
        p: "JPG para fotos e arquivos pequenos, PNG para texto e desenhos nítidos. 150 dpi serve para tela, 300 dpi para impressão."
      - h: Baixe
        p: "Uma página gera uma imagem; várias páginas vêm juntas em um arquivo ZIP."
    body: |
      ## JPG ou PNG?

      O **JPG** gera arquivos pequenos e é aceito em todo lugar; é a escolha certa para páginas com fotos. O **PNG** não tem perda: texto e linhas ficam perfeitamente nítidos, em troca de arquivos maiores. Se a ideia é só deixar o documento mais leve para enviar, [comprimir o PDF](/pt/comprimir-pdf/) mantém o texto pesquisável.

      ## Qual qualidade?

      | Configuração | Uso |
      |---|---|
      | 96 dpi | Telas, mensagens, prévias |
      | 150 dpi | Uso geral, apresentações |
      | 300 dpi | Impressão, arquivamento |

      ## Convertido no seu computador

      As páginas de PDF para JPG são renderizadas pelo mesmo mecanismo usado por muitos leitores de PDF, direto no seu navegador. Seu documento não é enviado para lugar nenhum. Para mandar só algumas páginas mantendo o texto, [extraia as páginas do PDF](/pt/extrair-paginas-pdf/) em vez de convertê-las; e, para o caminho inverso, use [JPG para PDF](/pt/jpg-para-pdf/).
    faq:
      - q: Como converto só uma página?
        a: "Use Extrair páginas para ficar com a página que você precisa e depois converta esse arquivo. Uma única página é baixada como uma única imagem."
      - q: Posso converter imagens de volta para PDF?
        a: "Sim, com JPG para PDF."
      - q: O texto nas imagens é selecionável?
        a: "Não. Uma imagem é uma foto da página; guarde o PDF se precisar de texto selecionável."

  jpg_to_pdf:
    slug: jpg-para-pdf
    nav: JPG para PDF
    card: Junte fotos e digitalizações em um só PDF, na ordem que você escolher.
    title: "JPG para PDF online: converter imagens em PDF, grátis"
    description: "JPG para PDF: transforme imagens JPG, PNG e outras em um único PDF. Mude a ordem arrastando, escolha tamanho e margens. Grátis, no navegador, sem upload."
    h1: 'Converter imagens em <span class="hl">um só PDF</span>'
    h1_plain: JPG para PDF
    lede: "Fotos de recibos, páginas digitalizadas, capturas de tela: converta JPG para PDF soltando as imagens, colocando na ordem e recebendo um único PDF pronto para enviar."
    suffix: imagens
    hint: "Arraste as miniaturas para mudar a ordem. ✕ remove uma imagem."
    runLabel: Criar PDF
    stepsTitle: Como converter JPG para PDF
    steps:
      - h: Solte suas imagens
        p: "JPG, PNG e outros formatos comuns. Adicione mais com <b>Adicionar imagens</b>."
      - h: Organize e configure
        p: "Arraste para mudar a ordem. Escolha o tamanho da página (igual à imagem, A4 ou Carta) e a margem."
      - h: Crie o PDF
        p: "Uma imagem por página, na sua ordem, baixadas em um só arquivo."
    body: |
      ## Tamanho da página: qual escolher?

      **Igual à imagem** cria páginas do tamanho exato de cada foto, o ideal para capturas de tela e fotos. **A4** ou **Carta** coloca cada imagem em uma página padrão, centralizada e ajustada, o que é melhor para documentos que você vai imprimir ou mandar a um órgão público. Imagens na horizontal ganham páginas na horizontal automaticamente. Para unir o resultado a outros documentos, use [juntar PDF](/pt/juntar-pdf/).

      ## Formatos aceitos

      JPG e PNG são adicionados como estão, sem recompressão. Outros formatos que seu navegador consegue abrir (GIF, BMP, WebP e, em alguns aparelhos, HEIC) são convertidos antes. Se o PDF final ficar pesado por causa de fotos grandes, [comprima o PDF](/pt/comprimir-pdf/) em seguida.

      ## Privado desde a concepção

      Recibos, documentos de identidade e extratos bancários são o tipo de coisa que as pessoas costumam transformar em PDF. Aqui, as imagens ficam no seu dispositivo. Se uma foto entrou de lado, você pode [girar o PDF](/pt/girar-pdf/) depois, também sem upload.
    faq:
      - q: A qualidade das imagens diminui?
        a: "As imagens JPG e PNG são incorporadas como estão, sem recompressão. Use Comprimir PDF depois, se o arquivo ficar pesado demais."
      - q: Quantas imagens posso adicionar?
        a: "Não há limite fixo; fotos muito grandes usam mais memória."
      - q: Posso misturar fotos e um PDF que já tenho?
        a: "Crie aqui um PDF a partir das fotos e depois use Juntar PDF para combiná-lo com o outro documento."

  word_to_pdf:
    slug: word-para-pdf
    nav: Word para PDF
    card: Transforme um documento Word (.docx) em PDF sem enviá-lo para um servidor.
    title: "Word para PDF: converter DOCX em PDF grátis e sem upload"
    description: "Converta Word para PDF no navegador: formatação, tabelas, imagens, cabeçalhos e números de página preservados. Grátis, sem cadastro, seu arquivo nunca é enviado."
    h1: 'Converter um documento Word <span class="hl">para PDF</span>'
    h1_plain: Word para PDF
    lede: "Contrato, orçamento, currículo, carta: converta seu arquivo Word para PDF direto no seu dispositivo. O documento nunca é enviado a um servidor."
    suffix: pdf
    hint: Prévia das páginas do PDF gerado.
    runLabel: Baixar o PDF
    stepsTitle: Como converter Word para PDF
    steps:
      - h: Solte seu arquivo Word
        p: "Um documento <b>.docx</b> (Word 2007 ou mais recente, LibreOffice, Google Docs exportado como .docx)."
      - h: Confira a prévia
        p: "A conversão leva alguns segundos no navegador. Cada página do PDF aparece em miniatura."
      - h: Baixe o PDF
        p: "O PDF mantém o layout, o texto continua selecionável e os links continuam clicáveis."
    body: |
      ## O que é preservado

      A conversão de Word para PDF mantém o tamanho e as margens da página, os estilos de título, negrito, itálico e cores, as tabelas com bordas e sombreamento, as imagens, as listas com marcadores e numeradas, os cabeçalhos e rodapés com os números de página recalculados, as notas de rodapé e os links da web, que continuam clicáveis. O texto é gravado como texto vetorial: fica nítido na impressão e pode ser selecionado ou pesquisado no PDF.

      ## Limites que você deve conhecer

      As fontes são substituídas por fontes padrão parecidas (Calibri ou Arial viram uma fonte sem serifa, Times ou Cambria uma fonte com serifa). Por isso as quebras de linha podem cair de forma um pouco diferente e, em um documento longo, o número de páginas pode variar em uma. Caixas de texto, formas desenhadas, gráficos e SmartArt não são reproduzidos, e imagens posicionadas livremente voltam para o fluxo do texto. As escritas árabe e hebraica não são suportadas. Arquivos **.doc** antigos precisam primeiro ser salvos como .docx. Confira a prévia antes de enviar um documento importante.

      ## Por que converter sem enviar o arquivo

      Os conversores online comuns enviam seu documento para os servidores deles. Para um contrato, um holerite ou um laudo médico, isso faz diferença. Aqui o arquivo é lido e convertido pelo seu navegador: nada sai do seu dispositivo e, depois que a página carrega, a conversão funciona até sem internet. O PDF gerado também não leva as propriedades do arquivo Word (autor, empresa, última modificação por).

      Com o PDF pronto, você pode [protegê-lo com senha](/pt/proteger-pdf/), [assiná-lo](/pt/assinar-pdf/) ou [juntá-lo com outros PDFs](/pt/juntar-pdf/). Se ele contiver dados que precisam ser ocultados antes de compartilhar, [tarje-o](/pt/tarjar-pdf/).
    faq:
      - q: Meu arquivo Word é enviado para um servidor?
        a: "Não. O documento é lido e convertido no seu navegador; nenhum arquivo é transmitido. Você pode conferir desligando a internet depois que a página carregar."
      - q: Arquivos .doc e .odt são aceitos?
        a: "Só o formato .docx é aceito. Abra o .doc ou .odt no Word ou no LibreOffice e salve como .docx antes de soltá-lo aqui."
      - q: Por que a fonte não é exatamente a mesma?
        a: "As fontes do Word não vêm dentro do arquivo. A conversão usa fontes padrão parecidas: a formatação é mantida, mas a largura das linhas pode mudar um pouco."
      - q: Os números de página ficam corretos?
        a: "Sim. Os campos Página e Número de páginas dos cabeçalhos e rodapés são recalculados para cada página do PDF."
      - q: Posso editar o PDF?
        a: "O texto continua sendo texto de verdade, selecionável. Para corrigir uma palavra depois, use <a href='/pt/editar-texto-pdf/'>Editar texto</a>."

  pdf_to_word:
    slug: pdf-para-word
    nav: PDF para Word
    card: Transforme um PDF em documento Word (.docx) editável sem enviá-lo para um servidor.
    title: "PDF para Word: converter PDF em DOCX editável grátis e sem upload"
    description: "Converta PDF para Word no navegador: layout idêntico (tabelas, quadros, logotipos) e texto editável. Grátis, sem cadastro, seu arquivo nunca é enviado."
    h1: 'Converter um PDF <span class="hl">para Word</span>'
    h1_plain: PDF para Word
    lede: "Recupere um contrato, um orçamento ou um relatório como documento Word para editar. A conversão acontece no seu dispositivo: o PDF nunca é enviado a um servidor."
    suffix: word
    hint: "O documento Word mantém cada página do PDF com seu formato e suas margens."
    runLabel: Baixar o arquivo Word
    stepsTitle: Como converter PDF para Word
    steps:
      - h: Solte seu PDF
        p: "Um PDF que contenha texto (criado no Word, num programa de faturamento, num site…). Um PDF protegido pede a senha."
      - h: Deixe a conversão acontecer
        p: "Texto, fontes, imagens e links são lidos página por página no navegador."
      - h: Baixe o arquivo Word
        p: "Um arquivo <b>.docx</b> para abrir no Word, LibreOffice, Pages ou Google Docs."
    body: |
      ## Duas formas de converter

      **Igual ao original** (padrão): cada página do Word fica idêntica à página do PDF. O grafismo da página (bordas de tabela, quadros, linhas, fundos coloridos, logotipos, imagens) é mantido como está no fundo, e o texto é colocado por cima exatamente no mesmo ponto, em caixas de texto editáveis e com as mesmas quebras de linha. É a escolha certa para corrigir um valor, uma data ou um nome sem desalinhar nada.

      **Texto corrido**: o texto é reconstruído em parágrafos de verdade que o Word reorganiza enquanto você digita, com fontes, cores, listas, alinhamentos, fundos coloridos, imagens e links. É a escolha certa para retomar e reescrever um documento a fundo.

      ## Limites que você deve conhecer

      No layout igual ao original, o grafismo da página é uma imagem: você edita o texto, não as linhas nem as células de uma tabela, e uma frase que você aumenta não passa sozinha para a linha seguinte. No texto corrido, as tabelas viram colunas alinhadas por tabulações, sem bordas, e uma página pode transbordar para a seguinte. Nos dois modos, uma fonte do PDF que não está instalada no seu computador é substituída por uma parecida; um PDF digitalizado só contém imagens, sem texto editável (a ferramenta não faz reconhecimento de caracteres); alguns programas de faturamento gravam o texto em fontes sem nome, cujo negrito não pode ser recuperado.

      ## Por que converter sem enviar o arquivo

      Os conversores de PDF para Word online enviam seu documento para os servidores deles. Para um contrato, um holerite ou um laudo médico, isso faz diferença. Aqui tudo acontece no seu navegador: nada sai do seu dispositivo e o arquivo Word gerado não contém dados do autor.

      Só precisa corrigir algumas palavras? [Edite o texto direto no PDF](/pt/editar-texto-pdf/). Para voltar ao PDF depois das mudanças, [converta o Word para PDF](/pt/word-para-pdf/). Antes de compartilhar o documento, lembre-se de [tarjar os dados sensíveis](/pt/tarjar-pdf/).
    faq:
      - q: "Meu PDF é enviado para um servidor?"
        a: "Não. O PDF é lido e o arquivo Word é criado no seu navegador; nenhum arquivo é transmitido. Você pode conferir desligando a internet depois que a página carregar."
      - q: "Qual modo escolher?"
        a: "Igual ao original para retocar um documento que precisa manter a aparência: orçamento, fatura, certificado, formulário. Texto corrido para retomar o conteúdo e reescrevê-lo."
      - q: "O texto será editável?"
        a: "Sim, se o PDF contiver texto. No layout igual ao original ele fica em caixas de texto exatamente no lugar; no texto corrido forma parágrafos que o Word reorganiza. Um PDF digitalizado só contém imagens, sem texto editável."
      - q: "As tabelas são preservadas?"
        a: "No layout igual ao original, sim, idênticas: bordas, sombreamento e conteúdo. No texto corrido, o conteúdo é alinhado em colunas com tabulações, sem bordas."
      - q: "Funciona com PDF protegido por senha?"
        a: "Sim. A senha é pedida ao abrir o arquivo e usada só no seu navegador."

  protect:
    slug: proteger-pdf
    nav: Proteger PDF
    card: Tranque um PDF com senha usando criptografia AES-256.
    title: "Proteger PDF com senha online: AES-256, grátis e privado"
    description: "Proteger PDF com senha usando criptografia AES-256 e escolher o que é permitido (imprimir, copiar, editar). No navegador: o arquivo e a senha ficam com você."
    h1: 'Proteger PDF com <span class="hl">senha</span>'
    h1_plain: Proteger PDF com senha
    lede: "Proteja PDF com senha antes de mandar por e-mail ou guardar na nuvem. Só quem tem a senha consegue abrir o documento."
    suffix: protegido
    runLabel: Proteger e baixar
    stepsTitle: Como proteger um PDF com senha
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página."
      - h: Escolha uma senha
        p: "Digite duas vezes. Escolha se imprimir, copiar ou editar ficam permitidos depois que o arquivo for aberto."
      - h: Baixe
        p: "O PDF é criptografado com AES-256, a criptografia padrão de PDF mais forte."
    body: |
      ## Criptografia forte, feita no seu computador

      O PDF é criptografado com AES-256. Sem a senha, o conteúdo não pode ser lido. Como a criptografia acontece no seu navegador, nem o documento nem a senha são enviados a um servidor. Quem recebe a senha também vê as propriedades do arquivo, então vale [remover os metadados do PDF](/pt/remover-metadados-pdf/) antes.

      ## Escolha uma boa senha

      Use pelo menos 12 caracteres, de preferência algumas palavras sem relação entre si. Mande a senha por um canal diferente do arquivo: se enviar o PDF por e-mail, passe a senha por telefone ou mensagem de texto. Para tirar a senha mais tarde, use [desbloquear PDF](/pt/desbloquear-pdf/).

      ## Permissões

      Você também pode restringir impressão, cópia e edição para quem abrir o arquivo. Essas restrições são respeitadas pelos leitores mais comuns, mas sozinhas não são uma proteção forte; é a senha que mantém o conteúdo privado. Para impedir que formulários e comentários sejam alterados, [achate o PDF](/pt/achatar-pdf/) antes de protegê-lo.
    faq:
      - q: E se eu esquecer a senha?
        a: "Ela não pode ser recuperada, nem por nós nem por ninguém: nunca temos acesso a ela. Guarde uma cópia do arquivo sem proteção em um lugar seguro."
      - q: Quais leitores abrem o arquivo protegido?
        a: "Todos os leitores de PDF atuais (Adobe Acrobat Reader, navegadores, Pré-Visualização da Apple, apps para celular) são compatíveis com AES-256."
      - q: Posso tirar a senha depois?
        a: "Sim, com Desbloquear PDF, desde que você saiba a senha."

  unlock:
    slug: desbloquear-pdf
    nav: Desbloquear PDF
    card: Remova a senha ou as restrições de impressão e cópia do seu próprio PDF.
    title: "Desbloquear PDF online: remover senha e restrições"
    description: "Desbloquear PDF: remover senha PDF de um arquivo que você abre ou liberar as restrições de impressão e cópia. No navegador, sem upload. Só para seus documentos."
    h1: 'Desbloquear um PDF <span class="hl">que é seu</span>'
    h1_plain: Desbloquear PDF
    lede: "Cansado de digitar a senha do seu próprio extrato bancário toda vez? Desbloquear PDF remove essa senha de uma vez. As restrições que impedem imprimir ou copiar também podem ser retiradas."
    suffix: desbloqueado
    runLabel: Desbloquear e baixar
    stepsTitle: Como desbloquear um PDF
    steps:
      - h: Abra seu PDF
        p: "Solte o arquivo na página. Se ele precisar de senha para abrir, aparece um campo."
      - h: Digite a senha
        p: "Digite a senha que você normalmente usa para abri-lo. Arquivos que abrem sem senha não precisam de nada."
      - h: Baixe
        p: "Você recebe o mesmo documento, sem senha nem restrições."
    body: |
      ## Dois tipos de proteção em PDF

      Alguns PDFs pedem senha para **abrir**; extratos bancários, holerites e documentos fiscais costumam fazer isso. Outros abrem livremente, mas **restringem** o que você pode fazer: imprimir, copiar texto, preencher formulários. Esta ferramenta resolve os dois casos para remover senha PDF ou restrições, desde que você consiga abrir o arquivo normalmente.

      ## Só para os seus documentos

      Para desbloquear, é preciso a senha do arquivo: isto não é um quebrador de senhas. Use em documentos que são seus ou que você tem permissão para modificar, como os seus próprios extratos, ou arquivos cujo autor lhe passou a senha. Para recolocar uma senha depois das alterações, use [proteger PDF](/pt/proteger-pdf/).

      ## Fica no seu computador

      Seu PDF e a senha dele são processados no navegador e nunca são enviados para lugar nenhum. Sem a criptografia, você também pode [comprimir o PDF](/pt/comprimir-pdf/) ou editá-lo normalmente.
    faq:
      - q: Vocês conseguem desbloquear um PDF se eu esqueci a senha?
        a: "Não. A senha é necessária para descriptografar o arquivo; não tentamos adivinhá-la nem quebrá-la."
      - q: O conteúdo é alterado?
        a: "Não. Páginas, texto, imagens e links continuam iguais; só a criptografia e as restrições são removidas."
      - q: Posso proteger de novo com outra senha?
        a: "Sim, com Proteger PDF."

  batch:
