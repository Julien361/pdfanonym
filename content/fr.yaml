  guide:
    slug: comment-caviarder-un-pdf
    nav: Comment caviarder un PDF
    title: "Comment caviarder un PDF correctement (et le vérifier)"
    description: "Guide pratique du caviardage de PDF : pourquoi les rectangles noirs échouent, comment caviarder gratuitement, scans, métadonnées et cinq vérifications avant l'envoi."
    h1: Comment caviarder un PDF correctement
    lede: "Caviarder un PDF prend une minute. Le caviarder mal prend la même minute, et l'erreur ne se voit que le jour où quelqu'un d'autre retrouve le texte. Voici comment bien faire."
    cta_tool: redact
    cta: Ouvrir l'outil de caviardage gratuit
    body: |
      ## La réponse courte

      Utilisez un outil qui **supprime** le texte, pas un outil qui le recouvre. Ouvrez votre PDF dans [l'outil de caviardage pdfanonym](/fr/caviarder-pdf/), sélectionnez ce qui doit partir (ou recherchez-le), cliquez sur **Appliquer**, téléchargez, puis vérifiez en essayant de copier et de rechercher les mots caviardés. Si rien ne ressort, le caviardage a fonctionné.

      La suite de ce guide explique pourquoi cette vérification compte, et comment traiter les cas qui piègent.

      ## Pourquoi les rectangles noirs échouent

      Une page PDF est construite à partir d'instructions : « écris ces caractères ici », « dessine cette forme là ». Quand vous dessinez un rectangle noir sur un nom, vous ajoutez une instruction de plus, par-dessus. L'instruction qui écrit le nom est toujours dans le fichier.

      À l'écran comme sur papier, le résultat est parfait. Mais sélectionnez la zone et copiez-la : le nom arrive dans votre presse-papiers. Lancez une recherche : le lecteur saute directement dessus. Les outils d'extraction de texte, les moteurs de recherche et les assistants d'IA lisent les mots cachés aussi facilement que les autres.

      Ce n'est pas un risque théorique. En 2019, aux États-Unis, une pièce déposée par les avocats de Paul Manafort contenait des passages « caviardés » que des journalistes ont retrouvés par un simple copier-coller. Des erreurs du même genre ont exposé des manuels de sécurité, des contrats et des données personnelles dans de nombreux pays.

      ## Pas à pas : caviarder un PDF texte

      1. **Gardez l'original.** Le caviardage est définitif par principe. Travaillez sur une copie.
      2. **Ouvrez le fichier** dans un vrai outil de caviardage. Avec pdfanonym, déposez-le sur [la page de caviardage](/fr/caviarder-pdf/) ; il s'ouvre en local. Si le document contient un formulaire rempli avec un autre outil, pensez à [aplatir le PDF](/fr/aplatir-pdf/) pour que les réponses fassent partie de la page.
      3. **Trouvez chaque occurrence.** Tapez un nom, une référence ou un numéro dans la recherche, puis *Tout marquer*. La recherche ignore majuscules et accents : « Hélène » trouve aussi « HELENE ». Recommencez pour chaque information. Pour repérer automatiquement e-mails, téléphones et IBAN, l'outil pour [anonymiser un PDF](/fr/anonymiser-pdf/) fait cette recherche à votre place.
      4. **Marquez le reste à la main.** Glissez sur les passages, cliquez sur des mots isolés, double-cliquez sur une ligne pour la prendre en entier.
      5. **Appliquez.** Le texte sous chaque marque est supprimé et remplacé par un rectangle noir (ou un blanc si vous préférez).
      6. **Supprimez aussi les métadonnées.** Laissez l'option cochée : les champs auteur, titre et logiciel contiennent souvent exactement les noms que vous venez de caviarder. Pour voir ou modifier ces champs séparément, utilisez l'outil pour [supprimer les métadonnées d'un PDF](/fr/supprimer-metadonnees-pdf/).
      7. **Téléchargez et vérifiez** (voir plus bas).

      ## Caviarder un PDF scanné

      Un scan est une photo de page. Il n'y a pas de texte à supprimer, seulement des pixels. Deux conséquences :

      - Rechercher un nom ne trouve rien : il faut repérer chaque occurrence à l'œil.
      - Le caviardage doit modifier l'image elle-même. Dans pdfanonym, passez en mode **Zone**, cochez **les images** dans les options et tracez un rectangle sur chaque passage : les pixels sont effacés de l'image.

      Certains scans contiennent aussi une couche de texte invisible (OCR), ajoutée par le scanner pour rendre le document consultable. Dans ce cas, cette couche cachée doit partir elle aussi. Le mode Zone supprime à la fois le texte et l'image sous le rectangle.

      ## Cinq vérifications avant d'envoyer

      1. **Test de copie.** Sélectionnez la zone caviardée, copiez, collez dans un éditeur de texte simple. Rien ne doit apparaître.
      2. **Test de recherche.** Recherchez chaque mot caviardé dans le PDF. Zéro résultat.
      3. **Test des propriétés.** Dans votre lecteur, menu Fichier puis Propriétés. L'auteur, le titre et le sujet ne doivent rien révéler.
      4. **Test des commentaires.** Ouvrez le panneau des commentaires : une note de relecture peut citer le passage que vous venez de retirer.
      5. **Test des pièces jointes.** Cherchez une icône de trombone ou un panneau de pièces jointes. Un fichier joint peut contenir l'original non caviardé.

      ## Caviardage et RGPD

      Quand vous communiquez un document en réponse à une demande d'accès RGPD, les données concernant d'autres personnes doivent en principe être retirées, sauf justification. Le caviardage est la méthode habituelle. Le faire avec un service en ligne qui exige l'envoi du fichier revient à transmettre ces données personnelles à un prestataire de plus, dont il faudrait ensuite rendre compte. Un outil qui travaille en local évite complètement la question. Et pour traiter de nombreux documents d'un coup, la formule Pro permet d'[anonymiser des PDF par lots](/fr/anonymiser-pdf-par-lots/).
    faq:
      - q: Un PDF caviardé peut-il être « décaviardé » ?
        a: "Si le texte a vraiment été supprimé, non : il ne reste rien à récupérer. S'il a seulement été recouvert d'une forme, oui, souvent par un simple copier-coller. D'où l'importance du test de copie."
      - q: Adobe Acrobat Reader permet-il de caviarder gratuitement ?
        a: "Le Reader gratuit n'inclut pas de vrai caviardage ; la fonction est réservée aux versions payantes d'Acrobat. Dessiner un rectangle avec les outils de commentaire ne caviarde rien."
      - q: Peut-on caviarder sur un téléphone ?
        a: "pdfanonym fonctionne dans les navigateurs mobiles : ouvrez la page de caviardage, choisissez le PDF dans vos fichiers et marquez le texte du doigt. Un ordinateur reste plus confortable pour les longs documents."

  privacy:
    slug: confidentialite
    nav: Confidentialité
    title: "Confidentialité : vos fichiers restent chez vous · pdfanonym"
    description: "pdfanonym traite les PDF dans votre navigateur. Nous ne recevons, ne stockons ni ne voyons vos fichiers, et nous n'utilisons ni cookie ni traceur."
    h1: Confidentialité
    lede: "En bref : nous ne voyons jamais vos fichiers, et nous ne vous suivons pas."
    body: |
      ## Vos documents

      Les PDF que vous ouvrez sur pdfanonym sont traités **dans votre navigateur**, sur votre propre appareil, par un moteur PDF téléchargé avec la page. Ils ne sont envoyés ni à nos serveurs ni à ceux de quelqu'un d'autre. Nous n'en avons aucune copie, aucun moyen de les lire et rien à effacer.

      Vous pouvez le vérifier : ouvrez les outils de développement de votre navigateur, onglet Réseau, et traitez un fichier. Aucune requête ne transporte votre document. Le site envoie aussi un en-tête Content-Security-Policy qui empêche la page de se connecter à un autre domaine.

      ## Cookies et suivi

      pdfanonym ne dépose **aucun cookie**, n'utilise **aucun script de mesure d'audience ni de publicité** et ne charge **aucune ressource tierce** (polices et scripts sont servis depuis notre propre domaine). Votre navigateur peut garder de petites préférences en local ; elles ne quittent jamais votre appareil.

      ## Achats

      Si vous achetez une formule Pro, le paiement est géré par Stripe, qui traite votre carte, votre e-mail et vos données de facturation selon sa propre politique de confidentialité ; nous ne voyons jamais votre numéro de carte. Notre service de licence reçoit uniquement l'identifiant de votre session de paiement Stripe et renvoie une clé de licence signée, enregistrée dans votre navigateur. Les données de facturation (nom, e-mail, adresse, numéro de TVA, factures) sont conservées par Stripe et METIS aussi longtemps que l'exige le droit comptable. Vos fichiers PDF ne sont jamais concernés. Pour savoir quels sites nous amènent des clients, votre navigateur garde aussi en mémoire le site d'où vous venez et la première page consultée sur pdfanonym (sans cookie ni identifiant) ; cette information n'est transmise à Stripe avec votre commande que si vous achetez.

      ## Journaux du serveur

      Comme tout site web, notre hébergeur (Cloudflare) traite les données techniques nécessaires à l'affichage des pages, comme votre adresse IP et votre type de navigateur, et peut conserver des journaux de courte durée pour la sécurité. Ces journaux ne contiennent jamais vos documents.

      ## Contact

      Pour toute question sur la confidentialité : contact@pdfanonym.com.

