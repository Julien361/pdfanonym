    body: |
      ## Deux types de protection PDF

      Avant d'enlever le mot de passe d'un PDF, il faut savoir de quelle protection il s'agit. Certains PDF demandent un mot de passe pour être **ouverts** ; c'est souvent le cas des relevés bancaires, des bulletins de paie et des documents fiscaux. D'autres s'ouvrent librement mais **limitent** ce que vous pouvez faire : imprimer, copier le texte, remplir des formulaires. Cet outil gère les deux, à condition que vous puissiez ouvrir le fichier normalement. Une fois déverrouillé, le fichier peut passer par les autres outils, par exemple pour [compresser le PDF](/fr/compresser-pdf/) avant un dépôt en ligne.

      ## Uniquement pour vos propres documents

      Le déverrouillage exige le mot de passe du fichier : ce n'est pas un outil pour casser les mots de passe. Utilisez-le pour des documents qui vous appartiennent ou que vous avez le droit de modifier, comme vos propres relevés, ou des fichiers dont l'auteur vous a donné le mot de passe.

      ## Tout reste sur votre ordinateur

      Votre PDF et son mot de passe sont traités dans votre navigateur et ne sont jamais envoyés nulle part. Pour remettre un mot de passe différent ensuite, [protégez le PDF par mot de passe](/fr/proteger-pdf/) à nouveau.
    faq:
