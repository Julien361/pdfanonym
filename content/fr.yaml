  edit_text:
    slug: modifier-texte-pdf
    nav: Modifier le texte
    card: Cliquez sur n'importe quel mot du PDF et remplacez-le, dans la même police.
    title: 'Modifier le texte d''un PDF : cliquer sur un mot et le remplacer'
    description: 'Modifiez le texte d''un PDF dans le navigateur : cliquez sur un mot, tapez le nouveau, téléchargez. Même place, même taille, même couleur. Sans envoi ni filigrane.'
    h1: Modifier le texte d'un PDF, <span class="hl">mot par mot</span>
    h1_plain: Modifier le texte d'un PDF
    lede: 'Une date, un nom, un montant, une faute de frappe : cliquez sur le mot dans le PDF, tapez le bon, c''est fait. L''ancien texte disparaît vraiment du fichier.'
    suffix: modifie
    hint: Cliquez sur un mot, tapez le nouveau texte, Entrée pour valider (Échap pour annuler, Tab pour passer au mot suivant). Laissez vide pour effacer le mot.
    stepsTitle: Comment modifier le texte d'un PDF
    steps:
    - h: Ouvrez votre PDF
      p: Déposez-le sur la page. Il s'ouvre sur votre ordinateur, rien n'est envoyé.
    - h: Cliquez sur un mot
      p: Le mot passe en saisie. Tapez le remplacement et appuyez sur Entrée. Pour remplacer plusieurs mots d'un coup, glissez de l'un à l'autre.
    - h: Téléchargez
      p: Chaque changement s'affiche aussitôt tel qu'il sera dans le fichier. Annuler revient en arrière, Télécharger enregistre le PDF modifié.
    body: '## Le mot est remplacé, pas recouvert


      Beaucoup d''outils « modifient » un PDF en posant un rectangle blanc sur l''ancien texte et en écrivant par-dessus. L''ancien mot reste alors dans le fichier : il réapparaît au copier-coller ou par une recherche. Ici, le mot d''origine est réellement retiré de la page, puis le nouveau est écrit exactement à sa place, sur la même ligne de base. Le fond (couleur, cadre, image) n''est pas touché.


      ## Même police, même taille, même couleur


      Quand la police du document contient toutes les lettres que vous tapez, elle est réutilisée : le résultat est identique au reste de la page. Sinon, la police standard la plus proche est choisie (sans empattement, à empattement ou à chasse fixe, en gras ou en italique comme l''original), à la même taille et dans la même couleur. Si le nouveau mot est plus long ou plus court, la suite de la phrase se décale pour garder l''espacement ; une colonne de tableau, séparée par un grand espace, ne bouge pas.


      ## Usages courants


      - Corriger une date, une référence ou un montant sans refaire tout le document.

      - Rectifier une faute de frappe dans un PDF dont vous n''avez plus le fichier Word.

      - Mettre à jour un nom, une adresse ou un numéro de téléphone.


      Pour écrire là où il n''y a pas encore de texte, utilisez plutôt [Ajouter du texte](/fr/ajouter-texte-pdf/). Pour retirer définitivement des informations sensibles sans les remplacer, [caviardez le PDF](/fr/caviarder-pdf/).


      ## Limites


      Un PDF scanné ne contient qu''une image de la page : il n''y a pas de mots à modifier. Le texte vertical ou incliné n''est pas modifiable. Les caractères hors de l''alphabet latin d''Europe de l''Ouest ne peuvent être écrits que si la police du document les contient déjà.

      '
    faq:
    - q: L'ancien texte reste-t-il caché dans le fichier ?
      a: Non. Le mot d'origine est supprimé du contenu de la page avant que le nouveau soit écrit. Il ne réapparaît ni au copier-coller, ni par une recherche.
    - q: Puis-je remplacer une phrase entière ?
      a: 'Oui. Glissez du premier au dernier mot de la ligne : ils sont remplacés ensemble par ce que vous tapez. Une phrase sur plusieurs lignes se modifie ligne par ligne.'
    - q: Pourquoi la police n'est-elle pas exactement la même ?
      a: Les PDF n'embarquent souvent que les lettres utilisées dans le document. Si vous tapez une lettre absente, la police standard la plus proche est utilisée pour ce mot, à la même taille et dans la même couleur.
    - q: Mon fichier est-il envoyé sur un serveur ?
      a: Non. Tout se passe dans votre navigateur ; le PDF ne quitte pas votre ordinateur.
