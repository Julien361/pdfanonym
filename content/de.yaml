        p: "Der Text wird als echter, markierbarer Text ins PDF geschrieben."
    body: |
      ## Echter Text, kein Bild

      Wenn du Text in ein PDF einfügst, landet er als richtiger Text in einer Standardschrift (Helvetica) auf der Seite. Er bleibt bei jedem Zoom scharf, lässt sich markieren und durchsuchen und wird genau so gedruckt, wie er auf dem Bildschirm aussieht. Um vorhandenen Text zu ersetzen, kannst du [den PDF-Text direkt bearbeiten](/de/pdf-text-bearbeiten/): Wort anklicken und das neue eintippen.

      ## Typische Einsätze

      - Ein „flaches“ Formular ausfüllen, also eines mit Kästchen auf der Seite, aber ohne ausfüllbare Felder.
      - Vor dem Unterschreiben ein Datum, ein Aktenzeichen oder „Gelesen und genehmigt“ ergänzen.
      - Eine Notiz auf einen Plan oder ein Dokument schreiben, bevor du es zurückschickst. Damit niemand deine Einträge verschiebt, kannst du das [PDF flatten](/de/pdf-flatten/).

      Um zusätzlich eine handschriftliche Unterschrift einzufügen, wechsle in der Werkzeugleiste zu **Unterschrift** oder nutz [PDF unterschreiben](/de/pdf-unterschreiben/).

      ## Zeichen

      Der Text wird in Helvetica geschrieben. Die Schrift deckt das lateinische Alphabet samt westeuropäischer Akzente ab (é, ü, ñ, ç, ß…). Zeichen außerhalb davon, etwa Kyrillisch oder Chinesisch, werden durch ein Fragezeichen ersetzt.
    faq:
      - q: Kann ich Text bearbeiten, der schon im PDF steht?
        a: "Nicht mit diesem Werkzeug: Es fügt neuen Text hinzu. Um ein vorhandenes Wort zu ändern, nutz Text bearbeiten: Wort anklicken und das neue eintippen."
      - q: Kann ich mehrere Zeilen schreiben?
        a: "Ja. Drück beim Tippen Enter, um eine neue Zeile zu beginnen."
      - q: Kann ich den eingefügten Text später noch ändern?
        a: "Nicht in pdfanonym, sobald die Datei heruntergeladen ist: Der Text wird Teil der Seite. Heb dein Original auf, falls du noch etwas ändern musst."

  sign:
    slug: pdf-unterschreiben
    nav: PDF unterschreiben
    card: Unterschrift zeichnen und ins Dokument setzen, ohne Drucken und Scannen.
    title: "PDF unterschreiben online: kostenlos und privat"
    description: "PDF unterschreiben im Browser: Unterschrift mit der Maus oder dem Finger zeichnen und ins PDF setzen. Kostenlos, ohne Upload, ohne Konto, ohne Wasserzeichen."
    h1: 'PDF unterschreiben mit deiner <span class="hl">eigenen Unterschrift</span>'
    h1_plain: PDF unterschreiben
    lede: "Schluss mit Ausdrucken, Unterschreiben und Einscannen. Zeichne deine Unterschrift einmal, setz sie an die richtige Stelle und lade das unterschriebene PDF herunter."
    suffix: unterschrieben
    hint: "Klick auf eine Seite, um deine Unterschrift zu platzieren. Ziehen zum Verschieben, Ecke für die Größe."
    stepsTitle: So unterschreibst du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh das Dokument, das du unterschreiben willst, auf die Seite. Es bleibt auf deinem Rechner."
      - h: Unterschrift zeichnen
        p: "Zeichne sie mit der Maus, dem Trackpad oder dem Finger und klick dann auf <b>Diese Unterschrift verwenden</b>."
      - h: Platzieren und herunterladen
        p: "Klick auf die richtige Stelle, pass die Größe an, ergänze bei Bedarf mit dem Werkzeug <b>Text</b> das Datum und lade die Datei herunter."
    body: |
      ## Eine saubere, transparente Unterschrift

      Wenn du ein PDF unterschreibst, wird deine Zeichnung automatisch zugeschnitten und mit transparentem Hintergrund eingesetzt. Sie sitzt also auf Unterschriftslinien und in Tabellen, ohne weißen Kasten drumherum. Du kannst sie auf mehreren Seiten platzieren und jede Kopie in der Größe anpassen. Datum oder Ort daneben ergänzt du mit [Text in PDF einfügen](/de/text-in-pdf-einfuegen/).

      ## Was für eine Unterschrift ist das?

      Eine gezeichnete Unterschrift ist das, was die europäische eIDAS-Verordnung eine einfache elektronische Signatur nennt. Sie ist für Alltagsdokumente weit verbreitet: Angebote, Lieferscheine, interne Formulare, Mietverträge zwischen Privatleuten. Manche Dokumente verlangen eine fortgeschrittene oder qualifizierte elektronische Signatur, die auf einem Zertifikat und einer Identitätsprüfung beruht; dafür nutzt du einen spezialisierten Signaturdienst.

      ## Deine Unterschrift bleibt bei dir

      Das Bild deiner Unterschrift entsteht in deinem Browser und wird auf deinem Rechner in dein PDF geschrieben. Es wird weder hochgeladen noch von uns gespeichert. Bevor du den Vertrag verschickst, kannst du das [PDF flatten](/de/pdf-flatten/), damit die Unterschrift fest zur Seite gehört, und es zusätzlich [mit einem Passwort schützen](/de/pdf-passwort-schuetzen/).
    faq:
      - q: Kann ich auf dem Handy unterschreiben?
        a: "Ja. Öffne die Seite auf deinem Handy, zeichne mit dem Finger und tipp dann auf die Stelle, an die die Unterschrift gehört."
      - q: Kann ich Datum und Namen ergänzen?
        a: "Ja. Wechsle in der Werkzeugleiste zum Werkzeug „Text“, klick neben die Unterschrift und tipp los."
      - q: Wird meine Unterschrift für das nächste Mal gespeichert?
        a: "Nein. Nichts wird gespeichert: Du zeichnest sie für jedes Dokument neu. Das heißt auch, dass niemand sie über diese Website wiederverwenden kann."

  watermark:
    slug: pdf-wasserzeichen
    nav: Wasserzeichen
    card: VERTRAULICH, ENTWURF oder deinen Namen quer über jede Seite stempeln.
    title: "PDF Wasserzeichen einfügen online: kostenlos und privat"
    description: "PDF Wasserzeichen aus Text (VERTRAULICH, ENTWURF, KOPIE…) auf jede Seite setzen. Deckkraft, Farbe und Ausrichtung wählen, mit Live-Vorschau. Ohne Upload."
    h1: 'PDF Wasserzeichen <span class="hl">einfügen</span>'
    h1_plain: PDF Wasserzeichen einfügen
    lede: "Kennzeichne ein PDF mit einem Wasserzeichen als vertraulich, als Entwurf oder als Kopie für einen bestimmten Empfänger. Text eingeben, mit Live-Vorschau anpassen, herunterladen."
    suffix: wasserzeichen
    runLabel: Wasserzeichen einfügen und herunterladen
    stepsTitle: So fügst du ein Wasserzeichen in ein PDF ein
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite."
      - h: Wasserzeichen einstellen
        p: "Gib den Text ein, wähl Deckkraft, Farbe und Ausrichtung. Die Vorschau der ersten Seite ändert sich dabei laufend."
      - h: Herunterladen
        p: "Das Wasserzeichen wird auf jeder Seite eingefügt."
    body: |
      ## Ideen für dein PDF Wasserzeichen

      - **VERTRAULICH** oder **INTERN** auf Dokumenten, die nicht weitergegeben werden sollen.
      - **ENTWURF** auf Fassungen, die noch nicht endgültig sind.
      - **Kopie für [Empfänger]** auf einem Ausweis oder einer Gehaltsabrechnung, die du an einen Vermieter oder eine Agentur schickst: Taucht sie irgendwo auf, ist klar, woher sie stammt und wofür sie gedacht war.

      ## Was ein Wasserzeichen kann und was nicht

      Ein Wasserzeichen schreckt vor Missbrauch ab und macht die Herkunft einer Kopie offensichtlich. Es hält aber niemanden auf, der mit einem Bearbeitungsprogramm entschlossen ist, es zu entfernen. Für stärkeren Schutz solltest du die Datei zusätzlich [flatten](/de/pdf-flatten/) und [mit einem Passwort schützen](/de/pdf-passwort-schuetzen/).

      ## Zeichen

      Das Wasserzeichen nutzt Helvetica Bold. Die Schrift deckt das lateinische Alphabet samt westeuropäischer Akzente ab. Andere Schriftsysteme werden nicht unterstützt.
    faq:
      - q: Ist der Text hinter dem Wasserzeichen noch lesbar?
        a: "Ja. Das Wasserzeichen ist halbtransparent; stell die Deckkraft zwischen 5 % und 60 % ein."
      - q: Kann ich nur einige Seiten mit einem Wasserzeichen versehen?
        a: "Dieses Werkzeug versieht jede Seite damit. Für eine Auswahl extrahierst du zuerst diese Seiten, fügst das Wasserzeichen ein und fügst dann alles wieder zusammen."
      - q: Kann ich ein Bild als Wasserzeichen nutzen?
        a: "Noch nicht: Im Moment werden nur Wasserzeichen aus Text unterstützt."

  page_numbers:
    slug: pdf-seitenzahlen
    nav: Seitenzahlen
    card: Die Seiten eines PDFs nummerieren, mit Position und Format nach Wahl.
    title: "PDF Seitenzahlen einfügen online: kostenlos und privat"
    description: "PDF Seitenzahlen einfügen: Position, Format (1, Seite 1, Seite 1 von 10), Startnummer, Deckblatt auslassen. Live-Vorschau, direkt im Browser, ohne Upload."
    h1: 'PDF <span class="hl">Seitenzahlen</span> einfügen'
    h1_plain: PDF Seitenzahlen einfügen
    lede: "Nummerier einen Bericht, eine Anlage oder ein Dokumentenpaket in Sekunden. Wähl, wo die Seitenzahlen stehen und wie sie aussehen; die Vorschau ändert sich sofort."
    suffix: nummeriert
    runLabel: Seitenzahlen einfügen und herunterladen
    stepsTitle: So nummerierst du PDF-Seiten
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite."
      - h: Position und Format wählen
        p: "Unten oder oben, links, mittig oder rechts; 1, Seite 1 oder Seite 1 von 12; Startnummer; bei Bedarf das Deckblatt auslassen."
      - h: Herunterladen
        p: "Die Seitenzahlen werden auf jeder Seite als echter Text eingefügt."
    body: |
      ## Formate für jeden Zweck

      Wenn du PDF Seitenzahlen einfügen willst, reichen für die meisten Dokumente einfache Zahlen. „Seite 1 von 12“ ist bei Verträgen und amtlichen Unterlagen üblich, damit eine fehlende Seite sofort auffällt. Setzt ein Dokument ein anderes fort, stellst du die Startnummer ein (zum Beispiel 25) und setzt den Haken bei **Erste Seite auslassen**, damit das Deckblatt ohne Nummer bleibt.

      ## Richtig auf jeder Seite

      Die Zahlen werden nach dem ausgerichtet, was du auf dem Bildschirm siehst, auch auf gedrehten oder beschnittenen Seiten. So stehen sie nie quer oder außerhalb der Seite. Soll jede Seite zusätzlich einen Vermerk wie ENTWURF tragen, kannst du ein [PDF Wasserzeichen](/de/pdf-wasserzeichen/) hinzufügen.

      ## Mit anderen Werkzeugen kombinieren

      Du stellst ein Dokumentenpaket zusammen? [Füg die Dateien zuerst zusammen](/de/pdf-zusammenfuegen/) und nummerier dann das Ergebnis, damit die Zählung über das ganze Paket läuft.
    faq:
      - q: Kann ich die Nummerierung bei einer anderen Zahl als 1 beginnen?
        a: "Ja. Stell bei „Beginnen bei“ eine beliebige Zahl ein."
      - q: Kann ich das Deckblatt ohne Seitenzahl lassen?
        a: "Ja. Setz den Haken bei „Erste Seite auslassen“: Die Nummerierung beginnt auf der zweiten Seite."
      - q: Sind die Seitenzahlen durchsuchbarer Text?
        a: "Ja. Sie werden als echter Text in Helvetica eingefügt."

  compress:
    slug: pdf-komprimieren
    nav: PDF komprimieren
    card: Ein PDF für E-Mail und Upload verkleinern, indem zu große Bilder geschrumpft werden.
    title: "PDF komprimieren online: PDF verkleinern, kostenlos und privat"
    description: "PDF komprimieren im Browser: Zu große Bilder werden verkleinert und neu komprimiert, Schriften gekürzt. Drei Stufen, ohne Upload, ohne Konto."
    h1: 'PDF komprimieren, <span class="hl">ohne es hochzuladen</span>'
    h1_plain: PDF komprimieren
    lede: "Zu schwer für die E-Mail oder für das Upload-Portal? PDF verkleinern geht hier lokal: Zu große Bilder und ungenutzte Daten schrumpfen, der Text bleibt scharf, und du siehst die Größe vorher und nachher."
    suffix: komprimiert
    runLabel: Komprimieren und herunterladen
    stepsTitle: So komprimierst du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Die aktuelle Größe wird angezeigt."
      - h: Stufe wählen
        p: "Leicht, Empfohlen oder Stark. Empfohlen passt für den Bildschirm und den Bürodruck."
      - h: Herunterladen
        p: "Du siehst die neue Größe und die Ersparnis in Prozent. Ist keine Ersparnis möglich, bleibt deine Datei unverändert."
    body: |
      ## Was ein PDF schwer macht

      Fast immer: Bilder. Ein Foto direkt vom Handy oder ein Scan mit 600 dpi enthält weit mehr Pixel, als eine Seite braucht. Beim PDF komprimieren verkleinert pdfanonym jedes Bild auf die Auflösung, die die Seite tatsächlich darstellen kann (etwa 220, 150 oder 100 dpi je nach Stufe), und komprimiert es neu. Schriften werden auf die tatsächlich verwendeten Zeichen gekürzt, ungenutzte Objekte werden entfernt. Brauchst du keine Farbe, spart es zusätzlich Platz, das [PDF in Schwarz-Weiß](/de/pdf-schwarz-weiss/) umzuwandeln.

      ## Was du erwarten kannst

      | Dokument | Typisches Ergebnis |
      |---|---|
      | Fotos, Farbscans, Präsentationen | Starke Verkleinerung, oft 50 % bis 90 % |
      | Gemischte Berichte | Mittlere Verkleinerung |
      | Reine Textdokumente, bereits optimierte Dateien | Kaum oder keine Änderung |

      Text und Vektorgrafiken werden nie in Bilder umgewandelt. Sie bleiben deshalb auf jeder Stufe gestochen scharf. Willst du dagegen eine Seite als kleines Bild verschicken, nimm [PDF in JPG umwandeln](/de/pdf-in-jpg/).

      ## Große Dateien

      Alles läuft auf deinem Rechner, deshalb kann eine gescannte Datei mit 100 Seiten ein paar Sekunden dauern. Dafür gibt es keine Upload-Zeit und kein Größenlimit von einem Server. Fotos vom Handy wandelst du am besten erst mit [JPG in PDF umwandeln](/de/jpg-in-pdf/) um und komprimierst dann das Ergebnis.
    faq:
      - q: Leidet die Qualität unter der Komprimierung?
        a: "Leicht hält die Bilder nah am Original. Empfohlen ist auf dem Bildschirm und im Bürodruck kaum zu unterscheiden. Stark zeigt beim Hineinzoomen sichtbare Verluste bei Fotos. Der Text ist nie betroffen."
      - q: Warum ist meine Datei kaum kleiner geworden?
        a: "Sie enthält wenige Bilddaten, oder ihre Bilder waren schon komprimiert. In dem Fall sagt dir das Werkzeug Bescheid und lässt deine Datei, wie sie ist."
      - q: Gibt es ein Größenlimit?
        a: "Wir setzen kein Limit; sehr große Dateien hängen vom Arbeitsspeicher deines Rechners ab."

  pdf_to_jpg:
    slug: pdf-in-jpg
    nav: PDF in JPG
    card: Jede Seite eines PDFs in ein JPG- oder PNG-Bild umwandeln.
    title: "PDF in JPG umwandeln online: kostenlos und privat"
    description: "PDF in JPG umwandeln: Jede Seite wird zu einem JPG- oder PNG-Bild, in Bildschirm- oder Druckqualität. Mehrere Seiten kommen als ZIP. Ohne Upload, ohne Konto."
    h1: 'PDF in <span class="hl">JPG-Bilder</span> umwandeln'
    h1_plain: PDF in JPG umwandeln
    lede: "Teil eine Seite in sozialen Netzwerken, füg sie in eine Präsentation ein oder schick sie dorthin, wo keine PDFs angenommen werden. Wenn du ein PDF in JPG umwandelst, wird jede Seite zu einem Bild."
    suffix: bilder
    runLabel: Umwandeln und herunterladen
    stepsTitle: So wandelst du ein PDF in JPG um
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite."
      - h: Format und Qualität wählen
        p: "JPG für Fotos und kleine Dateien, PNG für scharfen Text und Zeichnungen. 150 dpi passen für den Bildschirm, 300 dpi für den Druck."
      - h: Herunterladen
        p: "Eine Seite ergibt ein Bild; mehrere Seiten werden in eine ZIP-Datei gepackt."
    body: |
      ## JPG oder PNG?

      **JPG** ergibt kleine Dateien und wird überall akzeptiert; für Seiten mit Fotos ist es die richtige Wahl. **PNG** ist verlustfrei: Text und Linien bleiben gestochen scharf, dafür werden die Dateien größer. Brauchst du nur eine Seite, kannst du sie vorher [aus dem PDF extrahieren](/de/pdf-seiten-extrahieren/).

      ## Welche Qualität?

      | Einstellung | Einsatz |
      |---|---|
      | 96 dpi | Bildschirm, Nachrichten, Vorschauen |
      | 150 dpi | Allgemeiner Gebrauch, Präsentationen |
      | 300 dpi | Druck, Archivierung |

      ## Auf deinem Rechner umgewandelt

      Die Seiten werden von derselben Engine dargestellt, die viele PDF-Reader nutzen, direkt in deinem Browser. Dein Dokument wird nirgendwohin geschickt. Für den umgekehrten Weg gibt es [JPG in PDF umwandeln](/de/jpg-in-pdf/), und ist dein PDF nur zu groß zum Versenden, reicht es oft, das [PDF zu komprimieren](/de/pdf-komprimieren/).
    faq:
      - q: Wie wandle ich nur eine Seite um?
        a: "Nutz Seiten extrahieren, um nur die gewünschte Seite zu behalten, und wandle dann diese Datei um. Eine einzelne Seite wird als einzelnes Bild heruntergeladen."
      - q: Kann ich Bilder wieder in ein PDF umwandeln?
        a: "Ja, mit JPG in PDF."
      - q: Ist der Text in den Bildern markierbar?
        a: "Nein. Ein Bild ist eine Aufnahme der Seite; behalte das PDF, wenn du markierbaren Text brauchst."

  jpg_to_pdf:
    slug: jpg-in-pdf
    nav: JPG in PDF
    card: Fotos und Scans zu einem PDF zusammenfassen, in der Reihenfolge, die du willst.
    title: "JPG in PDF umwandeln online: kostenlos und privat"
    description: "JPG in PDF umwandeln: JPG, PNG und andere Bilder in ein einziges PDF packen. Per Drag & Drop sortieren, Seitengröße und Rand wählen. Kostenlos, ohne Upload."
    h1: 'Bilder in <span class="hl">ein PDF</span> umwandeln'
    h1_plain: JPG in PDF umwandeln
    lede: "Fotos von Belegen, gescannte Seiten, Screenshots: Zieh sie hinein, bring sie in die richtige Reihenfolge und wandle die JPG in ein PDF um, das du direkt verschicken kannst."
    suffix: bilder
    hint: "Zieh die Vorschaubilder, um die Reihenfolge zu ändern. ✕ entfernt ein Bild."
    runLabel: PDF erstellen
    stepsTitle: So wandelst du JPG in PDF um
    steps:
      - h: Bilder hineinziehen
        p: "JPG, PNG und andere gängige Formate. Weitere fügst du mit <b>Bilder hinzufügen</b> hinzu."
      - h: Sortieren und einrichten
        p: "Zieh die Bilder in die richtige Reihenfolge. Wähl die Seitengröße (wie das Bild, A4 oder Letter) und den Rand."
      - h: PDF erstellen
        p: "Ein Bild pro Seite, in deiner Reihenfolge, als eine Datei heruntergeladen."
    body: |
      ## Welche Seitengröße wählen?

      **Wie das Bild** erzeugt Seiten, die genau zu jedem Bild passen, ideal für Screenshots und Fotos. **A4** oder **Letter** setzt jedes Bild auf eine Standardseite, zentriert und passend skaliert. Das ist besser für Dokumente, die du druckst oder an eine Behörde schickst. Bilder im Querformat bekommen automatisch Seiten im Querformat. Liegt eine Seite trotzdem falsch, kannst du sie danach [im PDF drehen](/de/pdf-drehen/).

      ## Unterstützte Formate

      JPG und PNG werden unverändert übernommen, ohne neue Komprimierung. Andere Formate, die dein Browser öffnen kann (GIF, BMP, WebP und auf manchen Geräten HEIC), werden zuerst umgewandelt. Handyfotos sind oft groß; um das Ergebnis zu verkleinern, kannst du das [PDF komprimieren](/de/pdf-komprimieren/).

      ## Privat durch Technik

      Belege, Ausweise und Kontoauszüge sind typische Dinge, die Leute in PDFs verwandeln. Hier bleiben die Bilder auf deinem Gerät. Willst du sie an ein bestehendes Dokument anhängen, kannst du danach die Dateien [PDF zusammenfügen](/de/pdf-zusammenfuegen/).
    faq:
      - q: Wird die Bildqualität verringert?
        a: "JPG- und PNG-Bilder werden unverändert eingebettet, ohne neue Komprimierung. Ist die Datei zu schwer, nutz danach PDF komprimieren."
      - q: Wie viele Bilder kann ich hinzufügen?
        a: "Es gibt kein festes Limit; sehr große Fotos brauchen mehr Arbeitsspeicher."
      - q: Kann ich Fotos und ein vorhandenes PDF kombinieren?
        a: "Erstell hier ein PDF aus den Fotos und nutz dann PDF zusammenfügen, um es mit deinem anderen Dokument zu kombinieren."

  protect:
    slug: pdf-passwort-schuetzen
    nav: PDF schützen
    card: Ein PDF mit Passwort und AES-256-Verschlüsselung sperren.
    title: "PDF mit Passwort schützen online: AES-256, kostenlos"
    description: "PDF mit Passwort schützen: AES-256-Verschlüsselung und erlaubte Aktionen wählen (Drucken, Kopieren, Bearbeiten). Im Browser, Datei und Passwort bleiben bei dir."
    h1: 'PDF mit <span class="hl">Passwort</span> schützen'
    h1_plain: PDF mit Passwort schützen
    lede: "Verschlüssel ein Dokument, bevor du es per E-Mail verschickst oder in der Cloud ablegst. Wenn du ein PDF mit Passwort schützt, kann es nur öffnen, wer das Passwort kennt."
    suffix: geschuetzt
    runLabel: Schützen und herunterladen
    stepsTitle: So schützt du ein PDF mit einem Passwort
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite."
      - h: Passwort wählen
        p: "Gib es zweimal ein. Leg fest, ob Drucken, Kopieren oder Bearbeiten erlaubt sind, sobald die Datei geöffnet ist."
      - h: Herunterladen
        p: "Das PDF wird mit AES-256 verschlüsselt, der stärksten Standardverschlüsselung für PDFs."
    body: |
      ## Starke Verschlüsselung, lokal erledigt

      Das PDF wird mit AES-256 verschlüsselt. Ohne das Passwort lässt sich sein Inhalt nicht lesen. Weil die Verschlüsselung in deinem Browser passiert, wird weder das Dokument noch das Passwort jemals an einen Server geschickt. Die Dokumenteigenschaften wie Autor oder Titel kannst du vorher mit [PDF Metadaten entfernen](/de/pdf-metadaten-entfernen/) bereinigen.

      ## Ein gutes Passwort wählen

      Nimm mindestens 12 Zeichen, am besten ein paar Wörter, die nichts miteinander zu tun haben. Schick das Passwort auf einem anderen Weg als die Datei: Wenn du das PDF per E-Mail verschickst, gib das Passwort per Telefon oder SMS weiter.

      ## Berechtigungen

      Du kannst außerdem Drucken, Kopieren und Bearbeiten für alle einschränken, die die Datei öffnen. Gängige Reader halten sich an diese Einschränkungen, für sich allein sind sie aber kein starker Schutz; was den Inhalt wirklich privat hält, ist das Passwort. Damit ausgefüllte Formularfelder nicht mehr änderbar sind, kannst du das [PDF flatten](/de/pdf-flatten/), bevor du es verschlüsselst. Brauchst du den Schutz später nicht mehr, kannst du das [PDF Passwort entfernen](/de/pdf-passwort-entfernen/).
    faq:
      - q: Was, wenn ich das Passwort vergesse?
        a: "Es lässt sich nicht wiederherstellen, weder von uns noch von sonst jemandem: Wir bekommen es nie zu sehen. Bewahr eine Kopie der ungeschützten Datei an einem sicheren Ort auf."
      - q: Mit welchen Readern lässt sich die geschützte Datei öffnen?
        a: "Alle aktuellen PDF-Reader (Adobe Acrobat Reader, Browser, Apple Vorschau, mobile Apps) unterstützen AES-256."
      - q: Kann ich das Passwort später wieder entfernen?
        a: "Ja, mit PDF entsperren, solange du das Passwort kennst."

  unlock:
    slug: pdf-passwort-entfernen
    nav: PDF entsperren
    card: Das Passwort oder die Druck- und Kopiersperre aus deinem eigenen PDF entfernen.
    title: "PDF Passwort entfernen online: Sperren aufheben"
    description: "PDF Passwort entfernen bei einer Datei, die du öffnen kannst, oder Druck- und Kopiersperren aufheben. Im Browser, ohne Upload. Nur für deine eigenen Dokumente."
    h1: 'PDF Passwort entfernen, <span class="hl">bei deinen eigenen Dateien</span>'
    h1_plain: PDF Passwort entfernen
    lede: "Keine Lust mehr, bei deinem eigenen Kontoauszug jedes Mal das Passwort einzutippen? Entferne das PDF Passwort einmal. Sperren für Drucken oder Kopieren lassen sich ebenfalls aufheben."
    suffix: entsperrt
    runLabel: Entsperren und herunterladen
    stepsTitle: So entsperrst du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Braucht es zum Öffnen ein Passwort, erscheint ein Eingabefeld."
      - h: Passwort eingeben
        p: "Gib das Passwort ein, mit dem du die Datei normalerweise öffnest. Dateien, die sich ohne Passwort öffnen, brauchen nichts."
      - h: Herunterladen
        p: "Du bekommst dasselbe Dokument, ohne Passwort und ohne Sperren."
    body: |
      ## Zwei Arten von PDF-Schutz

      Manche PDFs verlangen ein Passwort zum **Öffnen**; bei Kontoauszügen, Gehaltsabrechnungen und Steuerunterlagen ist das oft so. Andere öffnen sich frei, **schränken** aber ein, was du tun kannst: Drucken, Text kopieren, Formulare ausfüllen. Dieses Werkzeug kümmert sich um beides, vorausgesetzt, du kannst die Datei normal öffnen. Willst du die Datei danach mit einem eigenen Passwort versehen, kannst du das [PDF mit einem Passwort schützen](/de/pdf-passwort-schuetzen/).

      ## Nur für deine eigenen Dokumente

      Um ein PDF Passwort zu entfernen, brauchst du das Passwort der Datei: Das hier ist kein Passwort-Knacker. Nutz es für Dokumente, die dir gehören oder die du ändern darfst, etwa deine eigenen Auszüge oder Dateien, deren Urheber dir das Passwort gegeben hat.

      ## Bleibt auf deinem Rechner

      Dein PDF und sein Passwort werden in deinem Browser verarbeitet und nirgendwohin geschickt. Entsperrte Kontoauszüge lassen sich danach auch [PDF komprimieren](/de/pdf-komprimieren/), was bei verschlüsselten Dateien nicht geht.
    faq:
      - q: Könnt ihr ein PDF entsperren, wenn ich das Passwort vergessen habe?
        a: "Nein. Das Passwort wird gebraucht, um die Datei zu entschlüsseln; wir versuchen nicht, es zu erraten oder zu knacken."
      - q: Wird der Inhalt verändert?
        a: "Nein. Seiten, Text, Bilder und Links bleiben gleich; nur die Verschlüsselung und die Sperren werden entfernt."
      - q: Kann ich es wieder mit einem anderen Passwort schützen?
        a: "Ja, mit PDF schützen."

