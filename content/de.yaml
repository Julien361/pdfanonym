  guide:
    slug: pdf-richtig-schwaerzen
    nav: PDF richtig schwärzen
    title: "PDF richtig schwärzen (und prüfen, ob es geklappt hat)"
    description: "Leitfaden zum PDF schwärzen: warum schwarze Kästen versagen, wie du kostenlos schwärzt, was bei Scans und Metadaten gilt, plus fünf Tests vor dem Versand."
    h1: PDF richtig schwärzen
    lede: "Ein PDF zu schwärzen dauert eine Minute. Es falsch zu schwärzen dauert genauso lange, und der Fehler fällt erst auf, wenn jemand anderes den Text findet. So machst du es richtig."
    cta_tool: redact
    cta: Kostenloses Schwärzungs-Werkzeug öffnen
    body: |
      ## Die Kurzfassung

      Nimm ein Werkzeug, das den Text **entfernt**, nicht eines, das ihn nur abdeckt. Öffne dein PDF im [Schwärzungs-Werkzeug von pdfanonym](/de/pdf-schwaerzen/), markier, was weg muss (oder such danach), drück **Anwenden**, lade die Datei herunter und prüf das Ergebnis: Versuch die geschwärzten Wörter zu kopieren und zu suchen. Kommt nichts zurück, hat die Schwärzung funktioniert.

      Der Rest dieses Leitfadens erklärt, warum dieser Test so wichtig ist und wie du mit den Fällen umgehst, an denen viele scheitern.

      ## Warum schwarze Rechtecke versagen

      Eine PDF-Seite besteht aus Anweisungen: „Schreib diese Zeichen hierhin“, „zeichne diese Form dorthin“. Wenn du ein schwarzes Rechteck über einen Namen legst, kommt einfach eine Anweisung obendrauf. Die Anweisung, die den Namen schreibt, steckt weiterhin in der Datei.

      Auf dem Bildschirm und auf Papier sieht das perfekt aus. Doch markier den Bereich und kopier ihn, und der Name landet in deiner Zwischenablage. Durchsuch das Dokument, und der Reader springt direkt zu ihm. Programme zur Textextraktion, Suchmaschinen und KI-Assistenten lesen die versteckten Wörter genauso leicht wie die sichtbaren.

      Das ist kein theoretisches Risiko. 2019 enthielt ein Schriftsatz der Anwälte von Paul Manafort in den USA „geschwärzte“ Passagen, die Journalisten einfach per Kopieren und Einfügen sichtbar machten. Ähnliche Pannen haben in vielen Ländern Sicherheitshandbücher, Verträge und personenbezogene Daten offengelegt.

      ## Schritt für Schritt: ein Text-PDF schwärzen

      1. **Behalte das Original.** Schwärzen ist absichtlich endgültig. Arbeite mit einer Kopie.
      2. **Öffne die Datei** in einem echten Schwärzungs-Werkzeug. Bei pdfanonym ziehst du sie auf [die Seite zum Schwärzen](/de/pdf-schwaerzen/), sie wird lokal geöffnet.
      3. **Finde jedes Vorkommen.** Gib einen Namen, ein Aktenzeichen oder eine Nummer ins Suchfeld ein und drück *Alle markieren*. E-Mails, Telefonnummern und IBANs findet die automatische Erkennung, wenn du dein [PDF anonymisieren](/de/pdf-anonymisieren/) lässt. Die Suche ignoriert Groß- und Kleinschreibung und Akzente, „Müller“ findet also auch „MULLER“. Wiederhole das für jede Angabe.
      4. **Markier den Rest von Hand.** Zieh über Passagen, klick auf einzelne Wörter, doppelklick auf eine Zeile, um sie ganz zu erfassen. Stehen Angaben in Formularfeldern, solltest du das [PDF vorher flatten](/de/pdf-flatten/).
      5. **Anwenden.** Der Text unter jeder Markierung wird gelöscht und durch einen schwarzen Balken ersetzt (oder durch eine weiße Fläche, wenn dir das lieber ist).
      6. **Entferne auch die Metadaten.** Lass die Option angehakt: In den Feldern Autor, Titel und Software stehen oft genau die Namen, die du gerade geschwärzt hast. Für Kommentare und Anhänge gibt es das eigene Werkzeug [PDF Metadaten entfernen](/de/pdf-metadaten-entfernen/).
      7. **Herunterladen und prüfen** (siehe unten).

      ## Ein gescanntes PDF schwärzen

      Ein Scan ist ein Foto einer Seite. Da gibt es keinen Text zu löschen, nur Pixel. Das hat zwei Folgen:

      - Die Suche nach einem Namen findet nichts, du musst jedes Vorkommen mit dem Auge aufspüren.
      - Die Schwärzung muss das Bild selbst verändern. In pdfanonym wechselst du in den Modus **Bereich**, setzt in den Optionen den Haken bei **Bilder** und ziehst über jede Passage ein Rechteck: Die Pixel darin werden aus dem Bild gelöscht.

      Manche Scans enthalten außerdem eine unsichtbare OCR-Textebene, die der Scanner hinzufügt, damit das Dokument durchsuchbar ist. Dann muss auch diese versteckte Textebene weg. Der Modus „Bereich“ entfernt unter dem Rechteck sowohl den Text als auch das Bild.

      ## Fünf Tests vor dem Versand

      1. **Kopiertest.** Markier den geschwärzten Bereich, kopier ihn und füg ihn in einen einfachen Texteditor ein. Es darf nichts erscheinen.
      2. **Suchtest.** Durchsuch das PDF nach jedem geschwärzten Wort. Null Treffer.
      3. **Eigenschaftentest.** Öffne in deinem Reader Datei, dann Eigenschaften. Autor, Titel und Betreff dürfen nichts verraten.
      4. **Kommentartest.** Öffne die Kommentarleiste: Anmerkungen aus der Überarbeitung können genau die Passage zitieren, die du entfernt hast.
      5. **Anhangtest.** Achte auf ein Büroklammer-Symbol oder eine Anhangleiste. Eine eingebettete Datei kann das ungeschwärzte Original enthalten.

      ## Schwärzen und DSGVO

      Gibst du ein Dokument auf ein Auskunftsersuchen nach Art. 15 DSGVO heraus, müssen Daten über andere Personen in der Regel entfernt werden, oder die Herausgabe muss begründet sein. Schwärzen ist der übliche Weg dafür. Machst du das über einen Dienst mit Upload, schickst du die Daten dieser Personen an einen weiteren Auftragsverarbeiter, über den du dann Rechenschaft ablegen musst. Ein Werkzeug, das lokal arbeitet, erspart dir diese Frage ganz. Bei vielen Dokumenten auf einmal kannst du die Dateien [PDF stapelweise anonymisieren](/de/pdf-stapel-anonymisieren/).
    faq:
      - q: Lässt sich eine Schwärzung im PDF wieder aufheben?
        a: "Wenn der Text wirklich entfernt wurde, nein: Es gibt nichts mehr wiederherzustellen. Wurde er nur von einer Form verdeckt, ja, oft schon mit einfachem Kopieren und Einfügen. Deshalb ist der Kopiertest so wichtig."
      - q: Kann der Adobe Acrobat Reader kostenlos schwärzen?
        a: "Der kostenlose Reader bietet keine echte Schwärzung, die ist den kostenpflichtigen Acrobat-Versionen vorbehalten. Ein Rechteck mit den Kommentarwerkzeugen zu zeichnen, schwärzt gar nichts."
      - q: Kann ich auch am Handy schwärzen?
        a: "pdfanonym funktioniert in mobilen Browsern: Öffne die Seite zum Schwärzen, wähl das PDF aus deinen Dateien und markier den Text mit dem Finger. Für lange Dokumente ist ein Computer bequemer."

  privacy:
    slug: datenschutz
    nav: Datenschutz
    title: "Datenschutz: Deine Dateien verlassen nie dein Gerät · pdfanonym"
    description: "pdfanonym verarbeitet PDFs in deinem Browser. Wir erhalten, speichern und sehen deine Dateien nicht, und wir setzen weder Cookies noch Tracker ein."
    h1: Datenschutz
    lede: "Kurz gesagt: Wir sehen deine Dateien nie, und wir tracken dich nicht."
    body: |
      ## Deine Dokumente

      PDFs, die du auf pdfanonym öffnest, werden **in deinem Browser** verarbeitet, auf deinem eigenen Gerät, von einer PDF-Engine, die mit der Seite geladen wird. Sie werden weder auf unsere Server noch auf die von jemand anderem hochgeladen. Wir haben keine Kopie davon, keine Möglichkeit, sie zu lesen, und nichts zu löschen.

      Du kannst das selbst überprüfen: Öffne die Entwicklertools deines Browsers, wähl den Tab „Netzwerk“ und bearbeite eine Datei. Keine Anfrage überträgt dein Dokument. Die Website sendet außerdem einen Content-Security-Policy-Header, der verhindert, dass die Seite eine Verbindung zu einer anderen Domain aufbaut.

      ## Cookies und Tracking

      pdfanonym setzt **keine Cookies**, verwendet **keine Analyse- oder Werbeskripte** und lädt **keine Ressourcen von Dritten** (Schriften und Skripte kommen von unserer eigenen Domain). Dein Browser speichert eventuell kleine Einstellungen lokal, sie verlassen nie dein Gerät.

      ## Käufe

      Wenn du einen Pro-Tarif kaufst, wird die Zahlung von Stripe abgewickelt. Stripe verarbeitet deine Karte, deine E-Mail-Adresse und deine Rechnungsdaten gemäß seiner eigenen Datenschutzerklärung; deine Kartennummer sehen wir nie. Unser Lizenzdienst erhält nur die Kennung deiner Stripe-Checkout-Sitzung und gibt einen signierten Lizenzschlüssel zurück, der in deinem Browser gespeichert wird. Rechnungsdaten (Name, E-Mail-Adresse, Anschrift, USt-IdNr., Rechnungen) werden von Stripe und METIS so lange aufbewahrt, wie es das Buchführungsrecht verlangt. Deine PDF-Dateien sind daran nie beteiligt.

      ## Server-Logs

      Wie bei jeder Website verarbeitet unser Hoster (Cloudflare) technische Daten, die zur Auslieferung der Seiten nötig sind, etwa deine IP-Adresse und deinen Browsertyp, und bewahrt aus Sicherheitsgründen eventuell kurzlebige Logs auf. Diese Logs enthalten nie deine Dokumente.

      ## Kontakt

      Fragen zum Datenschutz: contact@pdfanonym.com.

  terms:
    slug: nutzungsbedingungen
