  edit_text:
    slug: pdf-text-bearbeiten
    nav: Text bearbeiten
    card: Klick auf ein beliebiges Wort im PDF und ersetz es, in derselben Schrift.
    title: 'PDF-Text bearbeiten: Wort anklicken und ersetzen, kostenlos'
    description: 'Text in einem PDF im Browser bearbeiten: Wort anklicken, neues eintippen, herunterladen. Gleiche Stelle, Größe und Farbe. Ohne Upload, ohne Wasserzeichen.'
    h1: Text im PDF bearbeiten, <span class="hl">Wort für Wort</span>
    h1_plain: Text im PDF bearbeiten
    lede: 'Ein Datum, ein Name, ein Betrag, ein Tippfehler: Wort im PDF anklicken, richtiges eintippen, fertig. Der alte Text wird wirklich aus der Datei entfernt.'
    suffix: bearbeitet
    hint: Wort anklicken, neuen Text eintippen, mit Enter bestätigen (Esc bricht ab, Tab springt zum nächsten Wort). Leer lassen, um das Wort zu löschen.
    stepsTitle: So bearbeitest du Text in einem PDF
    steps:
    - h: PDF öffnen
      p: Zieh es auf die Seite. Es öffnet sich auf deinem Computer, nichts wird hochgeladen.
    - h: Wort anklicken
      p: Das Wort wird bearbeitbar. Ersatz eintippen und Enter drücken. Um mehrere Wörter auf einmal zu ersetzen, zieh vom einen zum anderen.
    - h: Herunterladen
      p: Jede Änderung erscheint sofort so, wie sie in der Datei sein wird. Rückgängig geht einen Schritt zurück, Herunterladen speichert das bearbeitete PDF.
    body: '## Das Wort wird ersetzt, nicht überdeckt


      Viele Werkzeuge „bearbeiten“ ein PDF, indem sie ein weißes Rechteck über den alten Text legen und darüber schreiben. Das alte Wort bleibt dann in der Datei und taucht beim Kopieren oder bei einer Suche wieder auf. Hier wird das ursprüngliche Wort wirklich von der Seite entfernt und das neue genau an seiner Stelle auf derselben Grundlinie geschrieben. Der Hintergrund (Farbe, Rahmen, Bild) bleibt unverändert.


      ## Gleiche Schrift, Größe und Farbe


      Enthält die Schrift des Dokuments alle Buchstaben, die du eintippst, wird sie wiederverwendet und das Ergebnis passt zum Rest der Seite. Andernfalls wird die nächstliegende Standardschrift gewählt (serifenlos, mit Serifen oder dicktengleich, fett oder kursiv wie das Original), in gleicher Größe und Farbe. Ist das neue Wort länger oder kürzer, rückt der Rest des Satzes nach; eine Tabellenspalte mit großem Abstand bleibt an ihrem Platz.


      ## Typische Anwendungen


      - Ein Datum, eine Referenz oder einen Betrag korrigieren, ohne das ganze Dokument neu zu erstellen.

      - Einen Tippfehler in einem PDF berichtigen, dessen Word-Datei nicht mehr vorliegt.

      - Einen Namen, eine Adresse oder eine Telefonnummer aktualisieren.


      Um dort zu schreiben, wo noch kein Text steht, nutz [Text einfügen](/de/text-in-pdf-einfuegen/). Um vertrauliche Angaben dauerhaft zu entfernen, ohne sie zu ersetzen, [schwärz das PDF](/de/pdf-schwaerzen/).


      ## Grenzen


      Ein gescanntes PDF enthält nur ein Bild der Seite, es gibt also keine Wörter zu bearbeiten. Senkrechter oder gedrehter Text ist nicht bearbeitbar. Zeichen außerhalb des westeuropäischen lateinischen Alphabets können nur geschrieben werden, wenn die Schrift des Dokuments sie bereits enthält.

      '
    faq:
    - q: Bleibt der alte Text versteckt in der Datei?
      a: Nein. Das ursprüngliche Wort wird aus dem Seiteninhalt gelöscht, bevor das neue geschrieben wird. Es taucht weder beim Kopieren noch bei einer Suche wieder auf.
    - q: Kann ich einen ganzen Satz ersetzen?
      a: 'Ja. Zieh vom ersten zum letzten Wort der Zeile: Sie werden gemeinsam durch deine Eingabe ersetzt. Ein Satz über mehrere Zeilen wird Zeile für Zeile bearbeitet.'
    - q: Warum ist die Schrift nicht genau dieselbe?
      a: PDFs betten oft nur die im Dokument verwendeten Buchstaben ein. Tippst du einen fehlenden Buchstaben, wird für dieses Wort die nächstliegende Standardschrift verwendet, in gleicher Größe und Farbe.
    - q: Wird meine Datei auf einen Server hochgeladen?
      a: Nein. Alles geschieht in deinem Browser; das PDF verlässt deinen Computer nicht.
