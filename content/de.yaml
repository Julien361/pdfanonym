pages:
  home:
    slug: ""
    title: "pdfanonym: PDF schwärzen und anonymisieren, privat im Browser"
    description: "Kostenlos PDF schwärzen, Text wirklich löschen und Metadaten entfernen, ohne Upload. PDF anonymisieren direkt im Browser: kein Konto, kein Wasserzeichen."
    h1: 'PDF schwärzen und bereinigen, <span class="hl">bevor</span> du es teilst'
    lede: "Namen schwärzen, Text löschen, versteckte Metadaten entfernen: So anonymisierst du ein PDF, ohne es aus der Hand zu geben. Alles passiert auf deinem eigenen Rechner, dein Dokument geht an keinen Server, auch nicht an unseren."
    cta: Jetzt PDF schwärzen
    toolsTitle: Wähl ein Werkzeug
    faq:
      - q: Ist pdfanonym wirklich kostenlos?
        a: "Ja. Alle 20 Werkzeuge sind kostenlos, ohne Konto, ohne Tageslimit und ohne Wasserzeichen. Ein optionaler <a href=\"/de/preise/\">Pro-Tarif</a> bietet Profis zusätzlich Stapel-Anonymisierung, erweiterte Erkennung und Berichte."
      - q: Wie kann ich prüfen, dass meine Datei nicht hochgeladen wird?
        a: "Öffne die Entwicklertools deines Browsers, geh auf den Tab „Netzwerk“ und bearbeite eine Datei: Du wirst keine Anfrage sehen, die sie überträgt. Die Seite liefert außerdem eine Sicherheitsrichtlinie mit, die ihr verbietet, Daten an andere Websites zu senden. Und der komplette Quellcode ist öffentlich einsehbar."
      - q: Funktioniert es auch offline?
        a: "Ja. Sobald eine Werkzeugseite fertig geladen ist, kannst du die Internetverbindung trennen und weiter an deinen PDFs arbeiten."
    body: |
      ## Warum noch ein PDF-Werkzeug?

      Weil die meisten einen entscheidenden Fehler machen. Wenn du in einem typischen Online-Editor einen Namen „schwärzt“, legt er nur ein Rechteck über den Text. Die Seite sieht sauber aus, aber jeder kann die Wörter darunter weiterhin markieren, kopieren oder durchsuchen. Genau das ist schon Anwälten in Gerichtsakten passiert, und auch Behörden.

      pdfanonym entfernt die Zeichen aus der Datei selbst. Was du löschst, ist weg: Es lässt sich weder kopieren noch finden noch wiederherstellen. Willst du nicht selbst suchen, kannst du ein [PDF anonymisieren](/de/pdf-anonymisieren/) lassen: E-Mails, Telefonnummern und IBANs werden automatisch gefunden.

      ## Privat durch Technik, nicht durch ein Versprechen

      Dienste mit Upload verlangen, dass du ihnen deinen Vertrag, deine Gehaltsabrechnung oder deinen Arztbrief anvertraust. Wir verlangen dieses Vertrauen nicht, weil wir die Datei nie bekommen. Die PDF-Engine läuft in deinem Browser (es ist [MuPDF](https://mupdf.com), kompiliert zu WebAssembly). Das Dokument geht also von deiner Festplatte auf deinen Bildschirm und wieder zurück auf deine Festplatte.

      Das zählt, wenn du Mandantenakten, Personalunterlagen oder irgendetwas bearbeitest, das unter die DSGVO fällt: Es gibt keinen Dritten, den du angeben musst, und hinterher nichts, was gelöscht werden müsste. Dasselbe gilt, wenn du mehrere Dateien [PDF zusammenfügen](/de/pdf-zusammenfuegen/) oder ein zu großes [PDF komprimieren](/de/pdf-komprimieren/) willst.

  redact:
    slug: pdf-schwaerzen
    nav: PDF schwärzen
    card: Namen, Nummern und heikle Passagen schwärzen. Der Text unter dem Balken wird gelöscht.
    title: "PDF schwärzen online: kostenlos und Text wirklich gelöscht"
    description: "PDF Text schwärzen und endgültig löschen: echtes Schwärzen im Browser, ohne Upload, ohne Konto, ohne Wasserzeichen. Alle Treffer auf einmal schwärzen."
    h1: 'PDF schwärzen: Text <span class="redacted">dauerhaft</span> unkenntlich machen'
    h1_plain: PDF schwärzen
    lede: "Markier einen Namen, eine Kontonummer oder einen ganzen Absatz: pdfanonym entfernt den Text aus der Datei und setzt einen schwarzen Balken an seine Stelle. So schwärzt du ein PDF richtig, ohne Upload."
    black: true
    suffix: geschwaerzt
    stepsTitle: PDF schwärzen in drei Schritten
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite oder wähl es auf deinem Rechner aus. Es öffnet sich sofort, weil es dein Gerät nie verlässt."
      - h: Markieren, was verschwinden soll
        p: "Zieh über den Text, klick auf ein Wort, doppelklick auf eine Zeile oder gib einen Namen ins Suchfeld ein und drück <b>Alle markieren</b>. Bei Scans wechselst du zu <b>Bereich</b> und ziehst ein Rechteck auf."
      - h: Anwenden und herunterladen
        p: "Drück <kbd>Entf</kbd> oder <b>Anwenden</b>, um den Text zu löschen, kontrollier das Ergebnis und klick auf <b>Herunterladen</b>. Versteckte Metadaten werden standardmäßig gleich mit entfernt."
    compare:
      title: Ein schwarzer Kasten ist noch keine Schwärzung
      intro: "Die meisten PDF-Editoren lassen dich ein schwarzes Rechteck zeichnen und nennen das Schwärzen. Der Unterschied fällt erst auf, wenn jemand den Text kopiert."
      bad_h: Kasten darübergelegt
      bad_p: "Die Seite sieht geschwärzt aus, aber die Wörter stecken noch in der Datei. Bereich markieren, kopieren, in eine E-Mail einfügen: Schon taucht der verdeckte Name auf. Die Suche findet ihn auch, genau wie jedes Programm zur Textextraktion."
      good_h: Echte Schwärzung
      good_p: "Die Zeichen unter dem Balken werden aus dem Seiteninhalt entfernt. Es bleibt nichts zum Kopieren, Suchen oder Extrahieren. Der schwarze Balken ist nur eine sichtbare Markierung, du kannst stattdessen auch eine weiße Fläche lassen."
    body: |
      ## Was kannst du schwärzen?

      Alles, was im PDF als Text vorliegt: Namen, Adressen, E-Mail-Adressen, Telefonnummern, Bankdaten (IBAN), Sozialversicherungs- oder Steuernummern, Gehälter, Aktenzeichen, als Text getippte Unterschriften. Das Suchfeld findet jedes Vorkommen auf allen Seiten und ignoriert dabei Groß- und Kleinschreibung sowie Akzente. So erwischst du den Nachnamen eines Mandanten mit einem Klick überall in einer 200-seitigen Datei. Willst du E-Mail-Adressen, Telefonnummern und IBANs nicht einzeln suchen, kannst du dein [PDF anonymisieren](/de/pdf-anonymisieren/): Die personenbezogenen Daten werden dabei automatisch erkannt.

      Ist dein PDF ein **Scan**, dann ist der „Text“ in Wahrheit ein Bild. Wechsle in den Modus **Bereich**, zieh ein Rechteck über die Stelle und setz in den Optionen den Haken bei **Bilder**: Die Pixel im Rechteck werden direkt im Bild gelöscht.

      ## Wer muss PDFs schwärzen?

      - **Anwälte und Kanzleimitarbeiter**, die Anlagen und Schriftsätze vorbereiten.
      - **Personalabteilungen**, die Gehaltsabrechnungen, Verträge oder Untersuchungsberichte weitergeben.
      - **Alle, die ein Auskunftsersuchen nach Art. 15 DSGVO oder eine Anfrage nach dem Informationsfreiheitsgesetz beantworten** und dabei Daten Dritter vor der Herausgabe entfernen müssen.
      - **Vermieter, Mieter und Selbstständige**, die Kontoauszüge oder Ausweise verschicken, von denen nur ein Teil der Angaben gebraucht wird.

      ## Schwärzung vor dem Versand prüfen

      Öffne die Datei nach dem Herunterladen, markier den geschwärzten Bereich und versuch ihn zu kopieren. Such danach eines der Wörter, die du entfernt hast. Es sollte nichts zurückkommen. Unser Leitfaden [PDF richtig schwärzen](/de/pdf-richtig-schwaerzen/) listet alle Tests auf. Denk auch an die unsichtbaren Angaben: Ein schwarzer Balken auf der Seite löscht weder Autor noch Titel aus den Dokumenteigenschaften, es sei denn, die Option dafür bleibt angehakt. Mehr dazu erfährst du unter [PDF Metadaten entfernen](/de/pdf-metadaten-entfernen/).
    faq:
      - q: Wird der Text wirklich gelöscht oder nur verdeckt?
        a: "Gelöscht. pdfanonym wendet die Schwärzung auf den Seiteninhalt an, die Zeichen existieren danach nicht mehr in der Datei. Kopieren, Suchen und Textextraktion liefern nichts."
      - q: Kann ich ein gescanntes PDF schwärzen?
        a: "Ja, mit dem Modus „Bereich“. Zieh ein Rechteck auf und setz in den Optionen den Haken bei „Bilder“: Der Teil des Scans unter dem Rechteck wird ausgeblendet. Die Textsuche funktioniert bei Scans nicht, weil es keine Textebene gibt."
      - q: Kann ich Text entfernen, ohne einen schwarzen Balken zu hinterlassen?
        a: "Ja. Nimm in den Optionen den Haken bei „Schwarzen Balken anzeigen“ raus oder nutz unser Werkzeug <a href=\"/de/pdf-text-loeschen/\">PDF Text löschen</a>, das stattdessen eine weiße Fläche lässt."
      - q: Gibt es ein Limit für Seitenzahl oder Dateigröße?
        a: "Kein festes Limit. Sehr große Dateien (mehrere hundert Seiten) hängen vom Arbeitsspeicher deines Rechners ab, normale Dokumente öffnen sich in einer Sekunde."
      - q: Kann ich eine Schwärzung rückgängig machen?
        a: "Ja, solange du die Seite nicht geschlossen hast: Drück Strg/Cmd+Z. Sobald die Datei heruntergeladen ist, ist die Schwärzung endgültig, und genau darum geht es."
      - q: Werden meine Dateien irgendwo gespeichert?
        a: "Nein. Sie werden nie hochgeladen, also gibt es bei uns nichts zu speichern oder zu löschen."

  remove:
    slug: pdf-text-loeschen
    nav: Text löschen
    card: Wörter oder Absätze aus einem PDF löschen und eine saubere weiße Fläche lassen.
    title: "PDF Text löschen oder entfernen, wirklich und gratis"
    description: "PDF Text löschen, entfernen oder weißen, ohne dass die Wörter darunter bleiben. Kostenloser PDF-Radierer im Browser: kein Upload, kein Konto."
    h1: 'PDF Text löschen, und zwar <span class="hl">wirklich</span>'
    h1_plain: PDF Text löschen
    lede: "Lösch ein Wort, eine Zeile oder einen ganzen Block aus deinem PDF. Der Text wird aus der Datei entfernt, nicht unter einem weißen Rechteck versteckt, und der Rest der Seite bleibt genau da, wo er war."
    black: false
    suffix: bearbeitet
    stepsTitle: So löschst du Text aus einem PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es hierher. Dein Browser liest es, es wird nirgendwohin geschickt."
      - h: Text auswählen
        p: "Zieh darüber, klick auf ein Wort oder such danach und drück <b>Alle markieren</b>. Mit dem Modus <b>Bereich</b> erfasst du einen ganzen Block."
      - h: Löschen und herunterladen
        p: "Drück <kbd>Entf</kbd>. Die Wörter verschwinden und hinterlassen eine weiße Fläche. Mit <kbd>Strg/Cmd</kbd>+<kbd>Z</kbd> machst du es rückgängig, danach lädst du die Datei herunter."
    compare:
      title: Warum Abdeck-Werkzeuge deinen Text zurücklassen
      intro: "Viele Werkzeuge bieten einen weißen Pinsel zum Abdecken an. Er malt eine weiße Form über die Wörter. Auf Papier funktioniert das, im PDF nicht."
      bad_h: Weiß übermalt
      bad_p: "Die Wörter liegen weiterhin unter der weißen Form. Kopier die Seite oder öffne sie in einem anderen Editor, und sie sind wieder da. Screenreader lesen sie sogar laut vor."
      good_h: Aus der Seite gelöscht
      good_p: "pdfanonym entfernt die Zeichen selbst. Der umgebende Text behält seine exakte Position, das Layout verrutscht also nicht, und darunter gibt es nichts mehr zu finden."
    body: |
      ## PDF weißen, ohne dass der Text darunter bleibt

      „Weißen“ heißt im PDF meist, ein weißes Rechteck über die Wörter zu malen, also digitales Tipp-Ex. Damit verschwindet der Text nur fürs Auge. pdfanonym macht, was man von Tipp-Ex eigentlich erwartet: Die Wörter werden aus der Datei gelöscht, an ihrer Stelle bleibt eine weiße Fläche. Markier den Text, drück <kbd>Entf</kbd>, und das Ergebnis sieht genauso aus wie geweißt, nur dass nichts mehr wiederherzustellen ist.

      ## Gut zu wissen

      PDFs sind keine Textverarbeitungsdateien: Jedes Wort sitzt an einer festen Stelle auf der Seite. Wenn du mitten in einer Zeile ein Wort löschst, rücken die folgenden Wörter **nicht** nach links, um die Lücke zu füllen. Es bleibt eine Leerstelle. Für die Vertraulichkeit ist das genau richtig, und das Layout bleibt intakt.

      Willst du Text durch etwas anderes **ersetzen**, lösch ihn zuerst hier und füg den neuen Wortlaut dann mit [Text in PDF einfügen](/de/text-in-pdf-einfuegen/) an derselben Stelle ein.

      ## Typische Anwendungen

      - Einen Preis, einen Namen oder ein Datum aus einem Angebot entfernen, bevor du es als Vorlage wiederverwendest.
      - Entwurfsnotizen oder vergessene „VERTRAULICH“-Vermerke aus einem Dokument löschen.
      - Persönliche Angaben aus einem Formular entfernen, bevor du es als Muster weitergibst. Den Namen im Autorenfeld erwischst du dabei nicht: Dafür gibt es [PDF Metadaten entfernen](/de/pdf-metadaten-entfernen/).

      Brauchst du stattdessen einen sichtbaren schwarzen Balken? Dann nimm [PDF schwärzen](/de/pdf-schwaerzen/).
    faq:
      - q: Verrutscht der restliche Text?
        a: "Nein. Jedes andere Zeichen behält seine exakte Position. Wo der gelöschte Text stand, bleibt eine Leerstelle."
      - q: Kann ich Text aus einem gescannten PDF löschen?
        a: "Scans enthalten ein Bild des Textes, keinen Text. Nutze den Modus „Bereich“ und setz den Haken bei „Bilder“, um diesen Teil des Bildes auszublenden."
      - q: Leidet die Qualität, wenn ich Text lösche?
        a: "Nein. Nur die ausgewählten Zeichen werden angefasst, der Rest der Seite, die Schriften und die Bilder bleiben, wie sie sind."
      - q: Ist das kostenlos?
        a: "Ja, ohne Konto, ohne Limit und ohne Wasserzeichen."

  metadata:
    slug: pdf-metadaten-entfernen
    nav: Metadaten bearbeiten
    card: Autor, Software, Datum, Kommentare und Anhänge sehen, bearbeiten oder entfernen, die in einem PDF versteckt sind.
    title: "PDF Metadaten bearbeiten oder entfernen, kostenlos"
    description: "PDF Metadaten bearbeiten oder entfernen: Sieh Autor, Titel, Software und Datum in deiner Datei, ändere sie oder lösch alles. Kostenlos im Browser, ohne Upload."
    h1: 'PDF <span class="hl">Metadaten</span> ansehen, bearbeiten oder entfernen'
    h1_plain: PDF Metadaten bearbeiten
    lede: "Dein PDF verrät womöglich deinen Namen, deine Firma, die verwendete Software und das Datum, an dem du es geschrieben hast, dazu Kommentare, die du längst vergessen hast. Sieh genau nach, was drinsteckt, und entferne es oder ersetze es durch deine eigenen Angaben."
    suffix: bereinigt
    reportCaption: Was dieses PDF außer dem sichtbaren Inhalt noch enthält
    runLabel: Metadaten entfernen und herunterladen
    stepsTitle: So entfernst du Metadaten aus einem PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Es wird auf deinem Rechner analysiert."
      - h: Bericht lesen
        p: "Jedes ausgefüllte Feld wird rot angezeigt: Autor, Titel, Software, Datum, XMP-Block, Kommentare, Anhänge, Skripte."
      - h: Bereinigen und herunterladen
        p: "Klick auf den Button. Wir speichern eine neue Datei ohne diese Angaben, prüfen sie erneut und zeigen dir, was übrig ist."
    body: |
      ## Was sind PDF-Metadaten?

      Neben den sichtbaren Seiten speichert ein PDF Informationen über sich selbst. Die **Dokumenteigenschaften** enthalten Titel, Autor, Betreff, Stichwörter, das Programm, mit dem die Datei erstellt wurde (zum Beispiel „Microsoft Word“), und das Programm, das daraus ein PDF gemacht hat, außerdem Erstellungs- und Änderungsdatum. Viele Dateien enthalten zusätzlich einen **XMP-Block**: eine zweite Kopie derselben Angaben im XML-Format, die manche Werkzeuge beim Bereinigen vergessen.

      Anderes reist mit der Datei mit, ohne im engeren Sinn „Metadaten“ zu sein: **Kommentare und Notizzettel**, **Hervorhebungen**, **angehängte Dateien** und manchmal **JavaScript**.

      ## Warum solltest du sie entfernen?

      - Im Autorenfeld steht oft der volle Name der Person, die die ursprüngliche Word-Datei geschrieben hat, oder der Name, auf den die Lizenz der Firma läuft.
      - Datumsangaben verraten, wann ein Dokument tatsächlich entstanden ist. In einer Verhandlung oder einem Streit kann das eine Rolle spielen.
      - Kommentare aus der Überarbeitung („Zahl noch mit dem Kunden abklären“) vergisst man leicht, und jeder kann sie lesen.
      - Angehängte Dateien können ein komplett anderes Dokument enthalten.

      ## PDF Metadaten bearbeiten statt entfernen

      Manchmal willst du keine leeren, sondern saubere, korrekte Eigenschaften: einen ordentlichen Titel, der in Browser-Tabs und Suchergebnissen erscheint, deine Firma als Autor, aussagekräftige Stichwörter. Öffne unter dem Bericht **Stattdessen Eigenschaften bearbeiten**, ändere Titel, Autor, Betreff, Stichwörter, Ersteller oder Erzeuger und lade die Datei herunter. Leere Felder werden entfernt. Der alte XMP-Block fliegt dabei gleich mit raus, weil manche Reader sonst weiter die alten Werte anzeigen.

      ## Was dieses Werkzeug nicht verändert

      Der sichtbare Inhalt deiner Seiten bleibt unberührt. Steht ein Name auf der Seite, löschst du ihn mit [PDF schwärzen](/de/pdf-schwaerzen/). Kombinierst du beides, bekommst du ein Dokument, das du bedenkenlos veröffentlichen kannst. Sollen Formularfelder und Kommentare nicht entfernt, sondern sichtbar auf der Seite bleiben, kannst du das [PDF flatten](/de/pdf-flatten/).
    faq:
      - q: Welche Metadaten werden entfernt?
        a: "Das Dokumentinformations-Dictionary (Titel, Autor, Betreff, Stichwörter, Ersteller, Erzeuger, Datumsangaben), der XMP-Metadatenstrom, private Anwendungsdaten und, wenn angehakt, Kommentare, Anhänge und JavaScript. Die Datei bekommt außerdem eine neue interne ID."
      - q: Kann ich Titel oder Autor ändern, statt sie zu löschen?
        a: "Ja. Öffne „Stattdessen Eigenschaften bearbeiten“ unter dem Bericht, gib die neuen Werte ein und lade die Datei herunter. Lässt du ein Feld leer, wird es entfernt."
      - q: Wie prüfe ich das Ergebnis?
        a: "Nach dem Bereinigen öffnet das Werkzeug die neue Datei erneut und zeigt dir ihren Bericht. Du kannst auch in deinem PDF-Reader unter Datei, dann Eigenschaften nachsehen."
      - q: Wird der sichtbare Inhalt verändert?
        a: "Nein. Text, Bilder und Layout bleiben exakt gleich."
      - q: Warum zeigt mein PDF-Reader trotzdem noch einen Erzeuger an?
        a: "Manche Reader zeigen einen Standardwert an, wenn das Feld leer ist, oder du hast die Originaldatei geöffnet. Öffne die heruntergeladene Kopie, deren Name auf „-bereinigt“ endet."

  flatten:
    slug: pdf-flatten
    nav: PDF flatten
    card: Formularfelder, Kommentare und Stempel in festen Inhalt verwandeln, den niemand mehr bearbeiten kann.
    title: "PDF flatten online kostenlos: Formulare und Kommentare fixieren"
    description: "PDF flatten: ausgefüllte Formularfelder, Kommentare und Unterschriften fest in die Seite einbrennen. Kostenlos, im Browser, ohne Upload, ohne Konto."
    h1: 'PDF flatten: Formulare und Anmerkungen <span class="hl">fixieren</span>'
    h1_plain: PDF flatten
    lede: "Formular ausgefüllt? Beim Flatten (auch „Formularfelder fixieren“ oder „PDF reduzieren“ genannt) werden Feldwerte, Kommentare und Stempel direkt in die Seite übernommen. Sie werden zuverlässig gedruckt und lassen sich nicht mehr ändern."
    suffix: flach
    reportCaption: Interaktive Elemente in diesem PDF
    runLabel: Flatten und herunterladen
    stepsTitle: So flattest du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh dein ausgefülltes Formular oder kommentiertes Dokument hierher."
      - h: Auswählen, was fixiert wird
        p: "Formularfelder, Kommentare und Stempel, oder beides. Versteckte Metadaten kannst du dabei gleich mit entfernen."
      - h: Herunterladen
        p: "Du bekommst ein ganz normales PDF, in dem alles fester Teil der Seite ist."
    body: |
      ## Was bedeutet es, ein PDF zu flatten?

      Ein interaktives PDF hat Ebenen über der eigentlichen Seite: Formularfelder zum Ausfüllen, Kontrollkästchen, Kommentare, Stempel, Zeichnungen. Der Reader zeigt sie an, aber es sind eigenständige Objekte, die sich bearbeiten, verschieben oder löschen lassen.

      Beim **Flatten** (deutsch etwa „reduzieren“ oder „fixieren“) werden diese Elemente in den Seiteninhalt gezeichnet und die interaktiven Objekte entfernt. Das Dokument sieht genauso aus wie vorher, verhält sich aber jetzt wie ein gedrucktes Blatt.

      ## Wann solltest du ein PDF flatten?

      - **Bevor du ein ausgefülltes Formular verschickst**, damit der Empfänger deine Angaben nicht ändern kann und jedes Programm sie gleich anzeigt.
      - **Vor dem Drucken**, weil manche Drucker und ältere Reader Formularfelder einfach weglassen.
      - **Vor dem Archivieren** von Verträgen oder Berichten. Soll niemand außer dem Empfänger die Datei öffnen, kannst du danach das [PDF mit einem Passwort schützen](/de/pdf-passwort-schuetzen/).
      - **Vor dem Schwärzen**: Text in einem Formularfeld gehört nicht zur Seite. Unser Werkzeug zum [Schwärzen](/de/pdf-schwaerzen/) übernimmt Felder automatisch, viele andere Werkzeuge aber nicht.
      - **Vor dem Hochladen in ein Portal**, das interaktive Formulare ablehnt oder leer anzeigt.

      ## Warum verschwinden meine Formularangaben, wenn ich ein PDF verschicke?

      Weil sie nie Teil der Seite waren. Formularwerte stecken in eigenen Feldobjekten, und jeder Reader entscheidet selbst, wie er sie darstellt. Manche Handy-Apps, E-Mail-Vorschauen, Drucker und ältere Reader lassen sie komplett weg oder zeigen sie erst, wenn du in ein Feld klickst. Wenn du das PDF-Formular fixierst, ist das Problem gelöst: Die Werte landen im Seiteninhalt, und den muss jedes Programm anzeigen.

      ## Flatten oder „Als PDF drucken“?

      Ein beliebter Trick ist, das Dokument über einen PDF-Drucker auszudrucken. Das klappt oft, baut aber die ganze Datei neu auf: Links, Lesezeichen und Barrierefreiheits-Tags können verloren gehen, und manche Treiber machen aus den Seiten Bilder oder ändern das Seitenformat. Flatten fasst nur die interaktiven Teile an und lässt alles andere, wie es war. Fehlen in einem flachen Formular die Felder ganz, kannst du vorher [Text in PDF einfügen](/de/text-in-pdf-einfuegen/) und das Ergebnis dann fixieren.

      ## Was beim Flatten fixiert wird

      | Element | Nach dem Flatten |
      |---|---|
      | Textfelder, Kontrollkästchen, Optionsfelder, Dropdown-Listen | Ihr aktueller Wert wird auf die Seite gezeichnet |
      | Kommentare, Hervorhebungen, Stempel, Zeichnungen | So auf die Seite gezeichnet, wie sie erscheinen |
      | Gezeichnete oder gestempelte Unterschrift | Bleibt als Teil der Seite erhalten |
      | Links und Lesezeichen | Bleiben erhalten |
      | Text | Bleibt echter, auswählbarer Text |
    faq:
      - q: Kann ich das Flatten rückgängig machen?
        a: "Nein. Nach dem Flatten sind die Feldwerte ganz normaler Seiteninhalt. Behalte deine Originaldatei, falls du das Formular noch einmal bearbeiten musst."
      - q: Bleibt meine Unterschrift erhalten?
        a: "Eine Unterschrift, die als Anmerkung gezeichnet oder gestempelt wurde, bleibt erhalten und wird Teil der Seite. Eine zertifizierte digitale Signatur dagegen wird durch jede Änderung an der Datei ungültig, auch durch das Flatten."
      - q: Leidet die Qualität beim Flatten?
        a: "Nein. Text bleibt gestochen scharf und auswählbar, nichts wird in ein Bild umgewandelt."
      - q: Wird die Datei durch das Flatten kleiner?
        a: "Meist ein wenig, weil die Feldobjekte wegfallen, aber der Unterschied ist gering. Beim Flatten geht es ums Fixieren, nicht ums Komprimieren."
      - q: Kann ich nur das Formular flatten und die Kommentare behalten?
        a: "Ja. Entferne vor dem Flatten den Haken bei „Kommentare, Stempel und Zeichnungen“: Dann werden nur die Formularfelder in die Seite übernommen."
      - q: Werden dabei auch Ebenen reduziert?
        a: "Nein. Optionale Inhaltsebenen (OCG), wie sie in manchen technischen Zeichnungen und Karten vorkommen, bleiben unverändert. Dieses Werkzeug fixiert Formularfelder und Anmerkungen, Ebenen reduziert es nicht."

  delete_pages:
    slug: pdf-seiten-loeschen
    nav: Seiten löschen
    card: Leere, doppelte oder überflüssige Seiten mit wenigen Klicks aus einem PDF entfernen.
    title: "PDF Seiten löschen: online, kostenlos und ohne Upload"
    description: "PDF Seiten löschen direkt im Browser: überflüssige Seiten anklicken, löschen, herunterladen. Kostenlos, ohne Upload, ohne Konto und ohne Wasserzeichen."
    h1: 'PDF Seiten löschen, <span class="hl">ohne Upload</span>'
    h1_plain: PDF Seiten löschen
    lede: "Um PDF Seiten zu löschen, siehst du alle Seiten als Vorschaubilder, klickst die überflüssigen an und entfernst sie. Dein PDF wird auf deinem Computer verarbeitet und nirgendwohin geschickt."
    suffix: bearbeitet
    hint: "Klick auf Seiten, um sie auszuwählen (Umschalt+Klick für einen Bereich), dann drück Entf oder „Auswahl löschen“."
    stepsTitle: So löschst du Seiten aus einem PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Nach einer Sekunde siehst du alle Seiten als Vorschaubilder."
      - h: Seiten zum Entfernen auswählen
        p: "Klick auf eine Seite, um sie auszuwählen, mit Umschalt+Klick wählst du einen Bereich, und über das ✕ auf einem Vorschaubild löschst du eine einzelne Seite."
      - h: Löschen und herunterladen
        p: "Drück <kbd>Entf</kbd> oder <b>Auswahl löschen</b>. Doch anders entschieden? <kbd>Strg/Cmd</kbd>+<kbd>Z</kbd>. Danach <b>Herunterladen</b>."
    body: |
      ## PDF Seiten löschen ohne Qualitätsverlust

      Wenn du PDF Seiten löschst, wird der Rest des Dokuments nicht neu kodiert: Die übrigen Seiten werden unverändert übernommen, mit Text, Schriften, Bildern, Kommentaren und Weblinks. Nichts wird komprimiert oder in Bilder umgewandelt, das Ergebnis sieht also genauso aus wie das Original, nur ohne die entfernten Seiten.

      ## Typische Gründe, Seiten aus einem PDF zu löschen

      - Leere Seiten vom beidseitigen Scannen. Brauchst du umgekehrt nur wenige Seiten, ist es oft schneller, die [PDF Seiten zu extrahieren](/de/pdf-seiten-extrahieren/).
      - Ein Deckblatt, eine Faxkopfzeile oder AGB, die du nicht mitschicken musst.
      - Seiten mit persönlichen Daten, die du nicht weitergeben solltest. Geht es nur um eine Zeile, [schwärze](/de/pdf-schwaerzen/) sie lieber, statt die ganze Seite zu löschen.
      - Doppelte Seiten, nachdem du mehrere Dokumente mit [PDF zusammenfügen](/de/pdf-zusammenfuegen/) kombiniert hast.

      ## Privat von Grund auf

      Online-Tools laden meist dein ganzes Dokument hoch, nur um eine Seite zu entfernen. Hier bleibt das PDF auf deinem Gerät: Die Seiten-Engine läuft in deinem Browser und funktioniert deshalb, einmal geladen, auch offline.
    faq:
      - q: Kann ich mehrere Seiten auf einmal löschen?
        a: "Ja. Klick jede Seite an, die weg soll, oder klick eine an und dann mit Umschalt+Klick eine andere, um alles dazwischen auszuwählen. Dann drück Entf."
      - q: Kann ich das Löschen rückgängig machen?
        a: "Ja, solange du die Seite nicht geschlossen hast: Drück Strg/Cmd+Z oder den Button Rückgängig, so oft du willst."
      - q: Wird die Datei kleiner, wenn ich Seiten lösche?
        a: "Meistens ja, denn Inhalte, die nur auf den entfernten Seiten verwendet wurden, fallen beim Speichern weg."
      - q: Gibt es ein Seitenlimit?
        a: "Kein festes Limit. Bei großen Dokumenten (mehrere hundert Seiten) hängt es vom Arbeitsspeicher deines Computers ab."

  extract_pages:
    slug: pdf-seiten-extrahieren
    nav: Seiten extrahieren
    card: Ausgewählte Seiten eines PDFs als neue, separate Datei speichern.
    title: "PDF Seiten extrahieren: online als neue Datei speichern"
    description: "PDF Seiten extrahieren und als neues PDF speichern. Kostenlos direkt im Browser: ohne Upload, ohne Konto, ohne Wasserzeichen und in Originalqualität."
    h1: 'PDF Seiten extrahieren und als <span class="hl">neue Datei</span> speichern'
    h1_plain: PDF Seiten extrahieren
    lede: "Wähl die Seiten, die du brauchst, in der gewünschten Reihenfolge und speichere sie als eigenes PDF. So kannst du PDF Seiten extrahieren, ohne die Originaldatei anzutasten."
    suffix: bearbeitet
    hint: "Wähl die Seiten aus, die du behalten willst (Umschalt+Klick für einen Bereich), dann „Auswahl extrahieren“. Du kannst sie vorher umsortieren."
    stepsTitle: So extrahierst du Seiten aus einem PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es hierher. Jede Seite erscheint als Vorschaubild."
      - h: Seiten auswählen
        p: "Klick die Seiten an, die du extrahieren willst. Mit Umschalt+Klick wählst du einen Bereich. Zieh die Vorschaubilder, um die Reihenfolge zu ändern."
      - h: Extrahieren
        p: "Klick auf <b>Auswahl extrahieren</b>: Ein neues PDF mit genau diesen Seiten wird heruntergeladen."
    body: |
      ## Extrahieren oder teilen?

      Beim Extrahieren kopierst du einzelne Seiten in ein neues Dokument, das Original bleibt vollständig. Willst du stattdessen das Original kürzen, kannst du die überflüssigen [PDF Seiten löschen](/de/pdf-seiten-loeschen/). So verschickst du am schnellsten nur den relevanten Teil einer langen Datei: ein Kapitel aus einem Bericht, die Unterschriftenseite eines Vertrags, die Rechnungen eines einzigen Monats aus einem Jahresexport.

      Du kannst aus derselben Datei mehrmals extrahieren: erste Gruppe auswählen, extrahieren, dann die nächste Gruppe auswählen und wieder extrahieren. Jede Extraktion lädt ein eigenes PDF herunter.

      ## Seiten aus mehreren PDFs kombinieren

      Klick auf **PDF hinzufügen**, um weitere Dateien zu laden (geht es dir nur ums Aneinanderhängen ganzer Dateien, nimm [PDF zusammenfügen](/de/pdf-zusammenfuegen/)). Ihre Seiten landen im selben Raster, du kannst sie mischen und umsortieren und dann die Auswahl extrahieren oder alles als ein Dokument herunterladen.

      ## Gleiche Qualität wie das Original

      Die Seiten werden unverändert übernommen, mit echtem Text, Schriften, Bildern, Kommentaren und Weblinks. Nichts wird in Bilder umgewandelt, die extrahierten Seiten bleiben also scharf und durchsuchbar. Brauchst du eine Seite als Bild, etwa für eine Präsentation, kannst du sie mit [PDF in JPG umwandeln](/de/pdf-in-jpg/) exportieren.
    faq:
      - q: Wird das Original-PDF verändert?
        a: "Nein. Beim Extrahieren entsteht eine neue Datei, dein Original bleibt genau so auf deinem Computer, wie es war."
      - q: Kann ich Seiten in einer anderen Reihenfolge extrahieren?
        a: "Ja. Zieh die Vorschaubilder vor dem Extrahieren in die gewünschte Reihenfolge: Das neue PDF übernimmt die Reihenfolge der ausgewählten Seiten im Raster."
      - q: Kann ich Seiten aus einem passwortgeschützten PDF extrahieren?
        a: "Wenn du das Passwort kennst, ja: Es wird beim Öffnen der Datei abgefragt. Das extrahierte PDF wird ohne Passwort gespeichert."
      - q: Funktioniert das auch auf dem Handy?
        a: "Ja. Tipp Seiten an, um sie auszuwählen, und halte ein Vorschaubild gedrückt, um es zu verschieben."

  rotate:
    slug: pdf-drehen
    nav: PDF drehen
    card: Eine Seite oder das ganze Dokument um 90° drehen und richtig herum speichern.
    title: "PDF drehen und speichern: online, kostenlos, ohne Upload"
    description: "PDF drehen: eine Seite oder das ganze Dokument um 90° nach links oder rechts drehen und dauerhaft speichern. Kostenlos, im Browser, ohne Upload und ohne Konto."
    h1: 'PDF Seiten drehen und <span class="hl">dauerhaft speichern</span>'
    h1_plain: PDF drehen
    lede: "Ein Scan ist quer oder auf dem Kopf gelandet? PDF drehen geht hier seitenweise oder für das ganze Dokument. Danach lädst du ein PDF herunter, das sich überall richtig herum öffnet."
    suffix: gedreht
    hint: "Dreh eine Seite mit den Pfeilen auf ihrem Vorschaubild oder wähl Seiten aus (keine = alle) und nutze Links / Rechts."
    stepsTitle: So drehst du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite, dann siehst du alle Seiten als Vorschaubilder."
      - h: Drehen
        p: "Nutze ↺ oder ↻ auf einer einzelnen Seite, oder wähl mehrere Seiten aus (oder keine, für die ganze Datei) und klick auf <b>Links</b> oder <b>Rechts</b>."
      - h: Herunterladen
        p: "Die Drehung wird in der Datei gespeichert: Sie öffnet sich in jedem Reader und auf jedem Gerät richtig herum."
    body: |
      ## PDF Seiten drehen und speichern, nicht nur in der Anzeige

      Der Drehen-Button der meisten PDF-Reader dreht nur die Ansicht. Datei schließen, verschicken, und sie liegt wieder quer. pdfanonym schreibt die Drehung ins PDF selbst, sodass jeder Reader die Seiten richtig herum anzeigt.

      ## Nur einzelne Seiten drehen

      Dokumente mit Hoch- und Querformat gemischt sind häufig: ein Bericht mit einer breiten Tabelle, ein Scan, bei dem ein einziges Blatt falsch herum eingezogen wurde. Dreh diese Seiten einzeln mit den Pfeilen auf ihren Vorschaubildern und lass die anderen, wie sie sind. Stimmt auch die Reihenfolge nicht, kannst du anschließend die [PDF Seiten sortieren](/de/pdf-seiten-sortieren/).

      ## Kein Qualitätsverlust

      Die Drehung ist eine Seiteneinstellung, keine Bildbearbeitung. Text bleibt Text, nichts wird neu komprimiert, und die Dateigröße ändert sich kaum. Hast du Seiten mit dem Handy fotografiert, wandelst du die Fotos zuerst mit [JPG in PDF umwandeln](/de/jpg-in-pdf/) um und drehst dann, was quer liegt.
    faq:
      - q: Wie drehe ich alle Seiten auf einmal?
        a: "Achte darauf, dass keine Seite ausgewählt ist, und klick dann auf Links oder Rechts: Die Drehung gilt für das ganze Dokument."
      - q: Wird die Drehung gespeichert?
        a: "Ja. Sie wird ins heruntergeladene PDF geschrieben, deshalb öffnet es sich in jedem Reader richtig herum."
      - q: Kann ich um 180° drehen?
        a: "Klick zweimal auf denselben Pfeil."
      - q: Verschlechtert das Drehen die Qualität?
        a: "Nein. Nur die Ausrichtung der Seite ändert sich, Text und Bilder werden nicht neu kodiert."

  reorder:
    slug: pdf-seiten-sortieren
    nav: Seiten sortieren
    card: Vorschaubilder per Drag & Drop verschieben und die Seiten eines PDFs in die richtige Reihenfolge bringen.
    title: "PDF Seiten sortieren: Reihenfolge per Drag & Drop ändern"
    description: "PDF Seiten sortieren per Drag & Drop, mehrere Dateien kombinieren und das Ergebnis herunterladen. Kostenlos, direkt im Browser, ohne Upload und ohne Konto."
    h1: 'PDF Seiten sortieren per <span class="hl">Drag & Drop</span>'
    h1_plain: PDF Seiten sortieren
    lede: "Ändere die Reihenfolge der Seiten, bis das Dokument stimmt, füg Seiten aus anderen PDFs hinzu und lade eine saubere Datei herunter. Nichts verlässt deinen Computer."
    suffix: sortiert
    hint: "Zieh ein Vorschaubild, um es zu verschieben. Auf dem Handy: gedrückt halten, dann ziehen."
    stepsTitle: So sortierst du PDF Seiten neu
    steps:
      - h: PDF öffnen
        p: "Zieh es hierher. Mit <b>PDF hinzufügen</b> lädst du weitere Dateien, um sie zu kombinieren."
      - h: Seiten an ihren Platz ziehen
        p: "Zieh ein Vorschaubild an die richtige Stelle und lass es los. Bei Bedarf kannst du dabei gleich Seiten löschen oder drehen."
      - h: Herunterladen
        p: "Klick auf <b>Herunterladen</b>, um das PDF in der neuen Reihenfolge zu speichern."
    body: |
      ## PDF Seiten sortieren in wenigen Sekunden

      Ein Dokument in falscher Reihenfolge gescannt? Die Zusammenfassung gehört vor den Anhang, die unterschriebene Seite ans Ende? Zieh die Vorschaubilder an ihren Platz, um die Reihenfolge zu ändern: Die Seitenzahlen passen sich laufend an, und mit Strg/Cmd+Z machst du jede Verschiebung rückgängig.

      ## Mehrere PDFs kombinieren und sortieren

      Mit **PDF hinzufügen** holst du weitere Dateien dazu, ganz wie beim [PDF zusammenfügen](/de/pdf-zusammenfuegen/). Alle Seiten erscheinen in einem Raster, so kannst du sie ineinander verschachteln, überflüssige entfernen und ein einziges, sauber sortiertes Dokument herunterladen. Für viele Streichungen auf einmal geht es schneller, die [PDF Seiten zu löschen](/de/pdf-seiten-loeschen/).

      ## Was erhalten bleibt

      Jede Seite wird unverändert übernommen: Text, Schriften, Bilder, Kommentare und Weblinks. Das Dokument wird nicht als Bilder neu aufgebaut, es bleibt also schlank und durchsuchbar. Steht die Reihenfolge, kannst du [PDF Seitenzahlen einfügen](/de/pdf-seitenzahlen/).
    faq:
      - q: Kann ich mehrere Seiten auf einmal verschieben?
        a: "Verschieb sie einzeln per Ziehen. Jede Verschiebung dauert eine Sekunde, und Strg/Cmd+Z macht die letzte rückgängig."
      - q: Kann ich hier PDFs zusammenfügen?
        a: "Ja. Klick auf „PDF hinzufügen“ (oder zieh mehrere Dateien auf einmal hierher), um sie zu kombinieren, die Seiten zu sortieren und eine einzige Datei herunterzuladen."
      - q: Passen sich die Lesezeichen der neuen Reihenfolge an?
        a: "Nein. Die neue Datei wird Seite für Seite aufgebaut und übernimmt weder die ursprünglichen Lesezeichen (Inhaltsverzeichnis) noch Links, die auf eine andere Seite des Dokuments springen. Weblinks auf den Seiten bleiben erhalten."
      - q: Funktioniert das auf dem Handy?
        a: "Ja. Halte ein Vorschaubild gedrückt und zieh es dann an seinen neuen Platz."

  grayscale:
    slug: pdf-schwarz-weiss
    nav: Schwarz-Weiß
    card: Ein farbiges PDF in Graustufen umwandeln, Text bleibt scharf und markierbar.
    title: "PDF schwarz weiß: PDF in Graustufen umwandeln, kostenlos"
    description: "PDF schwarz weiß machen, direkt im Browser: PDF in Graustufen umwandeln, Text bleibt markierbar, Bilder werden grau, nichts wird hochgeladen."
    h1: 'PDF in <span class="hl">Schwarz-Weiß</span> umwandeln'
    h1_plain: PDF schwarz weiß umwandeln
    lede: "Mach dein PDF schwarz weiß, um Tinte zu sparen, die Vorgaben einer Druckerei zu erfüllen oder ein Dokument für den Schwarz-Weiß-Druck vorzubereiten. Jede Farbe wird zu einem Grauton, und der Text bleibt echter, markierbarer Text."
    suffix: sw
    reportCaption: Dieses PDF
    runLabel: In Schwarz-Weiß umwandeln und herunterladen
    stepsTitle: So wandelst du ein PDF in Schwarz-Weiß um
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Es wird auf deinem Computer verarbeitet."
      - h: Umwandeln
        p: "Klick auf den Button. Text, Formen, Bilder, Kommentare und die Darstellung von Formularfeldern werden in Graustufen umgewandelt."
      - h: Prüfen und herunterladen
        p: "Die neue Datei wird sofort heruntergeladen, und eine Vorschau der ersten Seite erscheint, damit du das Ergebnis prüfen kannst."
    body: |
      ## PDF schwarz weiß, ohne die Seiten in Bilder zu verwandeln

      Wer ein PDF in Graustufen umwandeln will, landet oft bei Tools, die jede Seite als Bild „drucken“ und die Bilder wieder in ein PDF packen. Das funktioniert, aber der Text ist dann kein Text mehr: Du kannst ihn weder markieren noch durchsuchen noch kopieren, und die Datei wird oft deutlich größer. pdfanonym schreibt stattdessen die Farben im Dokument selbst um (wer die Datei vor allem kleiner machen will, kann das [PDF komprimieren](/de/pdf-komprimieren/)). Der Text bleibt bei jedem Zoom scharf, Links funktionieren weiter, und die Datei ist meist kleiner als das Original, weil Farbfotos zu einkanaligen Graustufenbildern werden.

      ## Was umgewandelt wird

      | Element | Ergebnis |
      |---|---|
      | Farbiger Text und Formen (RGB und CMYK) | Grautöne mit passender Helligkeit |
      | Fotos und Grafiken | Graustufenbilder |
      | Kommentare, Stempel, Darstellung von Formularfeldern | Graustufen |
      | Text | Weiterhin echter, markierbarer Text |

      Die Helligkeit bleibt dank der Standardformel für die Luminanz erhalten: Helle Farben bleiben hell, dunkle bleiben dunkel. Eine rote Überschrift wird also nicht zum schwarzen Block.

      ## Grenzen

      Ein paar seltene Elemente bleiben unverändert und werden nach der Umwandlung gemeldet: weiche Farbverläufe (Shadings), Schmuckfarben aus professionellen Druckdateien und winzige Bilder, die direkt im Seitencode stecken. Die Vorschau zeigt das Ergebnis, damit du es vor dem Drucken prüfen kannst. Musst du nur wenige Seiten drucken, kannst du sie vorher [aus dem PDF extrahieren](/de/pdf-seiten-extrahieren/).

      ## Schwarz-Weiß oder Graustufen?

      Was die meisten „schwarz weiß“ nennen, sind Graustufen: 256 Abstufungen zwischen Schwarz und Weiß, damit Fotos erkennbar bleiben. Genau das erzeugt dieses Tool. Der Drucker gibt die Grautöne dann nur mit schwarzer Tinte aus.
    faq:
      - q: Bleibt der Text markierbar?
        a: "Ja. Der Text wird nicht in ein Bild umgewandelt: Du kannst ihn genauso markieren, durchsuchen und kopieren wie vorher."
      - q: Wird die Datei kleiner?
        a: "Oft ja, weil Farbbilder mit einem statt drei Kanälen gespeichert werden. Dateien, die nur Text enthalten, ändern sich kaum."
      - q: Kann ich nur einzelne Seiten umwandeln?
        a: "Nicht mit diesem Tool. Nutz zuerst <a href=\"/de/pdf-seiten-extrahieren/\">Seiten extrahieren</a>, um nur die gewünschten Seiten zu behalten, und wandle dann diese Datei um."
      - q: Warum ist noch etwas farbig?
        a: "Weiche Farbverläufe und professionelle Schmuckfarben werden nicht umgewandelt. In Bürodokumenten sind sie selten; der Bericht nach der Umwandlung sagt dir, ob deine Datei welche enthält."

  anonymize:
    slug: pdf-anonymisieren
    nav: PDF anonymisieren
    card: E-Mails, Telefonnummern, IBANs und Namen automatisch erkennen und mit einem Klick schwärzen.
    title: "PDF anonymisieren: Personendaten automatisch schwärzen"
    description: "PDF anonymisieren im Browser: E-Mails, Telefonnummern, IBANs, Kartennummern und Namen automatisch finden und endgültig schwärzen. DSGVO-freundlich, ohne Upload."
    h1: 'PDF anonymisieren: Personendaten werden für dich <span class="redacted">gefunden</span>'
    h1_plain: PDF anonymisieren
    lede: "Öffne dein Dokument: pdfanonym durchsucht jede Seite nach E-Mails, Telefonnummern, Bankdaten, Kartennummern und Namen, und du schwärzt alles auf einmal. So kannst du ein PDF anonymisieren, ohne etwas hochzuladen."
    black: true
    suffix: anonymisiert
    stepsTitle: So anonymisierst du ein PDF
    steps:
      - h: PDF öffnen
        p: "Zieh es auf die Seite. Die Suche startet automatisch, auf deinem Rechner."
      - h: Treffer prüfen
        p: "Die personenbezogenen Daten werden nach Art gruppiert und mit Beispielen angezeigt. Nimm den Haken bei allem raus, was bleiben soll, und klick auf <b>Auswahl markieren</b>. Alles Weitere markierst du von Hand oder über das Suchfeld."
      - h: Schwärzen und herunterladen
        p: "Drück <kbd>Entf</kbd> oder <b>Anwenden</b>: Der Text wird aus der Datei gelöscht. Versteckte Metadaten werden gleich mit entfernt."
    body: |
      ## Was die Suche erkennt

      Wenn du ein PDF anonymisieren willst, sucht pdfanonym zuerst automatisch nach diesen Daten:

      | Daten | So wird geprüft |
      |---|---|
      | E-Mail-Adressen | Übliches Adressformat |
      | Telefonnummern | Internationale (+33, +49…) und nationale Formate |
      | IBANs | Offizielle Prüfsumme (mod 97): Ungültige Nummern werden ignoriert |
      | Kartennummern | Luhn-Prüfsumme; Firmennummern wie die SIRET werden ausgeschlossen |
      | Französische Sozialversicherungsnummern | Prüfschlüssel wird kontrolliert |
      | IP-Adressen | Nur gültige Bereiche |
      | Namen nach einer Anrede | Mr, Mrs, Dr, Monsieur, Madame, Herr, Frau, Sr., Sra., Sig.… |
      | Datumsangaben | Erkannt, aber nicht angehakt, weil Dokumente voller Daten sind, die nichts Persönliches verraten |

      Die Prüfsummen sind wichtig: Sie halten die Zahl der Fehltreffer niedrig. Du kannst dich also auf die Liste verlassen, statt Hunderte zufälliger Zahlen durchzugehen.

      ## Was sie nicht erraten kann

      Ein Name ohne Anrede („Jean Dupont unterschrieb…“) sieht aus wie jedes andere Wort und wird deshalb nicht automatisch erkannt. Gib ihn ins Suchfeld ein und drück **Alle markieren**: Jedes Vorkommen wird erfasst, ob großgeschrieben oder nicht, mit oder ohne Akzente. Postanschriften und handschriftliche Angaben werden ebenfalls nicht erkannt. Was die Erkennung übersieht, kannst du von Hand [im PDF schwärzen](/de/pdf-schwaerzen/). Lies das Dokument immer einmal durch, bevor du es weitergibst; welche Prüfungen sich lohnen, zeigt unser Leitfaden [PDF richtig schwärzen](/de/pdf-richtig-schwaerzen/).

      ## Warum lokales Anonymisieren zählt

      Eine Datei voller personenbezogener Daten an einen Online-Dienst zu schicken, um genau diese Daten zu entfernen, ist ein Widerspruch: Nach der DSGVO ziehst du damit einen weiteren Verarbeiter hinzu. pdfanonym läuft komplett in deinem Browser, die Daten verlassen dein Gerät also nie. Hast du Dutzende Dateien, kannst du sie in einem Durchgang [PDF stapelweise anonymisieren](/de/pdf-stapel-anonymisieren/).
    faq:
      - q: Werden die erkannten Daten wirklich entfernt?
        a: "Ja, sobald du die Schwärzung anwendest. Die Zeichen werden aus der Datei gelöscht, nicht unter einem Kasten versteckt, und die Metadaten des Dokuments (Autor, Titel…) werden ebenfalls bereinigt."
      - q: Funktioniert das auch bei gescannten PDFs?
        a: "Nein: Ein Scan enthält Bilder, keinen Text, es gibt also nichts zu analysieren. Nutz den Modus „Bereich“, um Passagen von Hand zu schwärzen."
      - q: Welche Sprachen und Länder werden abgedeckt?
        a: "E-Mails, internationale Telefonnummern, IBANs, Karten und IP-Adressen funktionieren für jedes Land. Anreden werden auf Englisch, Französisch, Deutsch, Spanisch, Italienisch und Portugiesisch erkannt. Sozialversicherungsnummern werden im französischen Format geprüft."
      - q: Kann ich einige der erkannten Angaben behalten?
        a: "Ja. Nimm vor dem Markieren den Haken bei einer Kategorie raus oder entferne einzelne Markierungen aus der Liste rechts."

  merge:
    slug: pdf-zusammenfuegen
    nav: PDF zusammenfügen
    card: Mehrere PDFs zu einer Datei zusammenfügen, in der Reihenfolge, die du willst.
    title: "PDF zusammenfügen online: kostenlos und ohne Upload"
    description: "PDF zusammenfügen im Browser: mehrere Dateien hineinziehen, Seiten per Drag & Drop sortieren und als ein Dokument laden. Kostenlos, ohne Upload, ohne Konto."
    h1: 'PDF zusammenfügen, <span class="hl">ohne etwas hochzuladen</span>'
    h1_plain: PDF zusammenfügen
    lede: "Zieh mehrere PDFs auf einmal hinein, bring die Seiten in die richtige Reihenfolge und lade ein einziges Dokument herunter. Deine Dateien werden auf deinem eigenen Rechner zusammengefügt."
    suffix: zusammengefuegt
    hint: "Zieh mehrere Dateien auf einmal hinein oder nutz „PDF hinzufügen“. Zieh die Vorschaubilder, um die Reihenfolge zu ändern."
    stepsTitle: So fügst du PDF-Dateien zusammen
    steps:
      - h: PDFs hineinziehen
        p: "Wähl mehrere Dateien auf einmal aus oder füg sie nacheinander mit <b>PDF hinzufügen</b> hinzu."
      - h: Seiten anordnen
        p: "Jede Seite erscheint als Vorschaubild. Zieh sie in die richtige Reihenfolge, dreh oder lösch Seiten bei Bedarf."
      - h: Herunterladen
        p: "Klick auf <b>Herunterladen</b> und du bekommst ein einziges PDF."
    body: |
      ## Zusammenfügen und aufräumen in einem Rutsch

      Ein PDF zusammenfügen heißt selten nur, Dateien aneinanderzuhängen. Hier erscheint jede Seite jeder Datei in einem gemeinsamen Raster. So setzt du die unterschriebene Seite an die richtige Stelle, wirfst eine leere Seite raus oder drehst einen quer liegenden Scan, bevor du herunterlädst. Für größere Umbauten kannst du die [PDF Seiten sortieren](/de/pdf-seiten-sortieren/), und danach [PDF Seitenzahlen einfügen](/de/pdf-seitenzahlen/), damit die Zählung über das ganze zusammengefügte Dossier läuft.

      ## Qualität und Links

      Die Seiten werden unverändert übernommen: Text bleibt Text, Bilder behalten ihre Auflösung, Kommentare und Weblinks bleiben erhalten. Ressourcen, die mehrere Seiten derselben Datei teilen, werden nur einmal gespeichert, deshalb bleibt das Ergebnis schlank. Ist es für einen E-Mail-Anhang trotzdem zu groß, kannst du das [PDF komprimieren](/de/pdf-komprimieren/).

      ## Privat durch Technik

      Wer Verträge, Gehaltsabrechnungen oder Arztunterlagen auf einer Website mit Upload zusammenfügt, schickt sie alle an einen Server. Hier verlassen sie dein Gerät nie.
    faq:
      - q: Wie viele Dateien kann ich zusammenfügen?
        a: "Es gibt kein festes Limit. Sehr große Mengen hängen vom Arbeitsspeicher deines Rechners ab."
      - q: Kann ich passwortgeschützte PDFs zusammenfügen?
        a: "Ja, wenn du die Passwörter kennst: Du wirst beim Hinzufügen nach jedem einzelnen gefragt. Die zusammengefügte Datei hat kein Passwort; bei Bedarf fügst du mit dem Werkzeug „PDF schützen“ eins hinzu."
      - q: Bleiben die Lesezeichen erhalten?
        a: "Nein. Die zusammengefügte Datei übernimmt weder die ursprünglichen Lesezeichen (Gliederung) noch Links, die auf eine andere Seite springen. Weblinks bleiben erhalten."

