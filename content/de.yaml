    title: "Nutzungsbedingungen · pdfanonym"
    description: "Nutzungsbedingungen von pdfanonym.com: kostenlose Tools ohne Gewähr, lokale Verarbeitung, deine Verantwortung, rechtmäßige Nutzung und Haftungsbeschränkung."
    h1: Nutzungsbedingungen
    lede: "Stand: 9. Oktober 2026. Mit der Nutzung von pdfanonym.com akzeptierst du diese Bedingungen."
    body: |
      ## 1. Der Dienst

      pdfanonym.com, herausgegeben von METIS (siehe [Impressum](/de/impressum/)), bietet kostenlose Online-Tools zur Bearbeitung von PDF-Dateien an: Schwärzen, Anonymisieren, Entfernen von Text, Bereinigen von Metadaten, Bearbeiten von Seiten, Umwandeln, Komprimieren, Unterschreiben und Schützen mit Passwort. Ein Konto ist nicht erforderlich.

      ## 2. Verarbeitung auf deinem Gerät

      Die Dateien werden in deinem Webbrowser auf deinem eigenen Gerät verarbeitet. Sie werden nicht an unsere Server gesendet, und wir haben keinen Zugriff darauf. Du bleibst der einzige Inhaber deiner Dokumente und ihres Inhalts. Die Seite [Datenschutz](/de/datenschutz/) erklärt das im Detail.

      ## 3. Bereitstellung ohne Gewähr

      Die kostenlosen Tools werden ohne Gewähr bereitgestellt (für kostenpflichtige Tarife gilt Abschnitt 9), ohne jede Garantie für Ergebnisse, Verfügbarkeit oder Eignung für einen bestimmten Zweck. Sie können jederzeit geändert, unterbrochen oder eingestellt werden.

      ## 4. Prüf das Ergebnis, bevor du es weitergibst

      Du bist dafür verantwortlich, jedes Dokument zu prüfen, bevor du es verwendest oder weitergibst. Insbesondere gilt:

      - **Die automatische Erkennung personenbezogener Daten ist nicht vollständig.** Namen ohne Anrede, Postanschriften, handschriftlicher Text, gescannte Seiten und ungewöhnliche Formate werden möglicherweise nicht erkannt. Lies das Dokument und vervollständige die Schwärzung selbst.
      - **Geschwärzt wird nur, was du markierst.** Informationen können auch in Bildern, Anhängen, Kommentaren oder anderen Kopien der Datei vorkommen. Unser [Leitfaden](/de/pdf-richtig-schwaerzen/) listet die durchzuführenden Prüfungen auf.
      - **Bewahre deine Originaldateien auf.** Änderungen durch die Tools, etwa Schwärzen, Flatten oder Verschlüsseln, sind bewusst dauerhaft.

      ## 5. Rechtmäßige Nutzung

      Du verpflichtest dich, die Tools nur für Dokumente zu verwenden, die dir gehören oder die du ändern darfst, und dabei die Gesetze einzuhalten. Insbesondere darfst du das Tool zum Entsperren nicht verwenden, um Schutzmaßnahmen von Dokumenten zu entfernen, die du nicht ändern darfst, und kein Tool verwenden, um Rechte Dritter zu verletzen, einschließlich Urheberrecht und Privatsphäre.

      ## 6. Elektronische Unterschrift

      Eine mit dem Unterschriften-Tool gezeichnete Unterschrift ist eine einfache elektronische Signatur im Sinne der europäischen eIDAS-Verordnung. Sie ersetzt keine fortgeschrittene oder qualifizierte elektronische Signatur, wo eine solche vorgeschrieben ist.

      ## 7. Haftung

