  guide:
    slug: como-censurar-un-pdf
    nav: Cómo censurar un PDF
    title: "Cómo censurar un PDF correctamente (y comprobar que funcionó)"
    description: "Guía para censurar PDF: por qué fallan los recuadros negros, cómo hacerlo gratis, escaneos, metadatos y cinco comprobaciones antes de enviar."
    h1: Cómo censurar un PDF correctamente
    lede: "Censurar un PDF lleva un minuto. Censurarlo mal lleva el mismo minuto, y el error solo se ve cuando otra persona encuentra el texto. Así se hace bien."
    cta_tool: redact
    cta: Abrir la herramienta gratuita de censura
    body: |
      ## La respuesta corta

      Usa una herramienta que **elimine** el texto, no una que lo tape. Abre tu PDF en [la herramienta de censura de pdfanonym](/es/censurar-pdf/), selecciona lo que debe desaparecer (o búscalo), pulsa **Aplicar**, descarga y comprueba el resultado intentando copiar y buscar las palabras censuradas. Si no aparece nada, la censura funcionó.

      El resto de esta guía explica por qué importa esa comprobación y cómo resolver los casos en los que más gente tropieza.

      ## Por qué fallan los rectángulos negros

      Una página PDF se construye con instrucciones: «escribe estos caracteres aquí», «dibuja esta forma allí». Cuando dibujas un rectángulo negro sobre un nombre, añades una instrucción más encima. La instrucción que escribe el nombre sigue en el archivo.

      En pantalla y en papel, el resultado parece perfecto. Pero selecciona la zona y cópiala, y el nombre acaba en tu portapapeles. Busca en el documento, y el lector salta directamente a él. Las herramientas de extracción de texto, los buscadores y los asistentes de IA leen las palabras ocultas con la misma facilidad que las visibles.

      No es un riesgo teórico. En 2019, un escrito judicial de los abogados de Paul Manafort en Estados Unidos contenía pasajes «censurados» que unos periodistas recuperaron simplemente copiándolos y pegándolos. Descuidos parecidos han dejado al descubierto manuales de seguridad, contratos y datos personales en muchos países.

      ## Paso a paso: censurar un PDF con texto

      1. **Conserva el original.** La censura es permanente por diseño. Trabaja sobre una copia.
      2. **Abre el archivo** en una herramienta de censura de verdad. Con pdfanonym, suéltalo en [la página de censura](/es/censurar-pdf/); se abre en local.
      3. **Encuentra cada aparición.** Escribe un nombre, una referencia o un número en el buscador y pulsa *Marcar todo*. La búsqueda ignora mayúsculas y acentos, así que «Müller» también encuentra «MULLER». Repite con cada dato. Para correos, teléfonos o IBAN, la herramienta para [anonimizar un PDF](/es/anonimizar-pdf/) los detecta automáticamente.
      4. **Marca el resto a mano.** Arrastra sobre los pasajes, haz clic en palabras sueltas, doble clic en una línea para tomarla entera.
      5. **Aplica.** El texto bajo cada marca se borra y se sustituye por un recuadro negro (o por un espacio en blanco, si lo prefieres).
      6. **Elimina también los metadatos.** Deja la opción marcada: los campos autor, título y software suelen contener justo los nombres que acabas de censurar. También puedes revisarlos y editarlos aparte con la herramienta para [eliminar los metadatos de un PDF](/es/eliminar-metadatos-pdf/).
      7. **Descarga y comprueba** (ver más abajo).

      ## Censurar un PDF escaneado

      Un escaneo es una foto de una página. No hay texto que borrar, solo píxeles. Eso tiene dos consecuencias:

      - Buscar un nombre no devuelve nada, así que tienes que localizar cada aparición a ojo.
      - La censura tiene que modificar la propia imagen. En pdfanonym, cambia al modo **Zona**, marca **imágenes** en las opciones y dibuja un rectángulo sobre cada pasaje: los píxeles de dentro se borran de la imagen.

      Algunos escaneos llevan además una capa de texto OCR invisible, que el escáner añade para que se pueda buscar en el documento. En ese caso también hay que eliminar esa capa oculta. El modo Zona elimina a la vez el texto y la imagen que quedan bajo el rectángulo.

      ## Cinco comprobaciones antes de enviar

      1. **Prueba de copia.** Selecciona la zona censurada, copia y pega en un editor de texto plano. No debería aparecer nada.
      2. **Prueba de búsqueda.** Busca en el PDF cada palabra censurada. Cero resultados.
      3. **Prueba de propiedades.** En tu lector, abre Archivo y luego Propiedades. El autor, el título y el asunto no deberían revelar nada.
      4. **Prueba de comentarios.** Abre el panel de comentarios: las notas de revisión pueden citar justo el pasaje que eliminaste. Si quieres conservarlas visibles, [aplana el PDF](/es/aplanar-pdf/) antes de censurar para que pasen a formar parte de la página.
      5. **Prueba de adjuntos.** Busca un icono de clip o un panel de adjuntos. Un archivo incrustado puede contener el original sin censurar.

      ## Censura y RGPD

      Según el RGPD, cuando entregas un documento en respuesta a una solicitud de acceso, por lo general hay que eliminar los datos de otras personas o justificar su comunicación. Censurar o anonimizar el documento es la forma habitual de hacerlo. Hacerlo con un servicio que exige subir el archivo supone enviar los datos de esas personas a otro encargado del tratamiento más, del que luego tendrías que rendir cuentas. Una herramienta que funciona en local evita la cuestión por completo. Si tienes muchos documentos que tratar, puedes [anonimizar PDF por lotes](/es/anonimizar-pdf-por-lotes/) en una sola pasada.
    faq:
      - q: "¿Se puede recuperar el texto de un PDF censurado?"
        a: "Si el texto se eliminó de verdad, no: no queda nada que recuperar. Si solo se tapó con una forma, sí, a menudo con un simple copiar y pegar. Por eso importa la prueba de copia."
      - q: "¿Adobe Acrobat Reader permite censurar gratis?"
        a: "El Reader gratuito no incluye censura real; está reservada a las versiones de pago de Acrobat. Dibujar un rectángulo con las herramientas de comentario no censura nada."
      - q: "¿Y censurar desde el teléfono?"
        a: "pdfanonym funciona en los navegadores móviles: abre la página de censura, elige el PDF entre tus archivos y marca el texto con el dedo. Para documentos largos, un PC resulta más cómodo."

  privacy:
    slug: privacidad
    nav: Privacidad
    title: "Privacidad: tus archivos no salen de tu dispositivo · pdfanonym"
    description: "pdfanonym procesa los PDF en tu navegador. No recibimos, guardamos ni vemos tus archivos, y no usamos cookies ni rastreadores."
    h1: Privacidad
    lede: "En resumen: nunca vemos tus archivos y no te rastreamos."
    body: |
      ## Tus documentos

      Los PDF que abres en pdfanonym se procesan **dentro de tu navegador**, en tu propio dispositivo, con un motor PDF que se descarga junto con la página. No se suben a nuestros servidores ni a los de nadie. No tenemos ninguna copia, ninguna forma de leerlos ni nada que borrar.

      Puedes comprobarlo: abre las herramientas para desarrolladores de tu navegador, selecciona la pestaña Red y procesa un archivo. Ninguna solicitud transporta tu documento. El sitio envía además una cabecera Content-Security-Policy que impide a la página conectarse a cualquier otro dominio.

      ## Cookies y rastreo

      pdfanonym **no instala cookies**, **no usa scripts de analítica ni de publicidad** y **no carga recursos de terceros** (las fuentes y los scripts se sirven desde nuestro propio dominio). Tu navegador puede guardar pequeñas preferencias en local; nunca salen de tu dispositivo.

      ## Compras

      Si compras un plan Pro, el pago lo gestiona Stripe, que trata los datos de tu tarjeta, tu correo electrónico y tus datos de facturación conforme a su propia política de privacidad; nunca vemos el número de tu tarjeta. Nuestro servicio de licencias solo recibe el identificador de tu sesión de pago de Stripe y devuelve una clave de licencia firmada, que se guarda en tu navegador. Los datos de facturación (nombre, correo electrónico, dirección, número de IVA, facturas) los conservan Stripe y METIS durante el tiempo que exige la normativa contable. Tus archivos PDF nunca intervienen.

      ## Registros del servidor

      Como cualquier sitio web, nuestro proveedor de alojamiento (Cloudflare) trata los datos técnicos necesarios para servir las páginas, como tu dirección IP y el tipo de navegador, y puede conservar registros de corta duración por seguridad. Esos registros nunca incluyen tus documentos.

      ## Contacto

      Preguntas sobre privacidad: contact@pdfanonym.com.

  terms:
    slug: condiciones-de-uso
    nav: Condiciones de uso
    title: "Condiciones de uso · pdfanonym"
    description: "Condiciones de uso de pdfanonym.com: herramientas gratuitas ofrecidas tal cual, procesamiento local, tus responsabilidades, uso lícito y limitación de responsabilidad."
    h1: Condiciones de uso
    lede: "Última actualización: 9 de octubre de 2026. Al usar pdfanonym.com, aceptas estas condiciones."
    body: |
      ## 1. El servicio

      pdfanonym.com, editado por METIS (consulta el [aviso legal](/es/aviso-legal/)), ofrece herramientas en línea gratuitas para procesar archivos PDF: censura, anonimización, eliminación de texto, limpieza de metadatos, edición de páginas, conversión, compresión, firma y protección con contraseña. No se necesita ninguna cuenta.

      ## 2. Procesamiento en tu dispositivo

      Los archivos se procesan en tu navegador web, en tu propio dispositivo. No se envían a nuestros servidores y no tenemos acceso a ellos. Sigues siendo el único titular de tus documentos y de su contenido. La [página de privacidad](/es/privacidad/) lo explica en detalle.

      ## 3. Servicio ofrecido tal cual

      Las herramientas gratuitas se ofrecen tal cual (los planes de pago se rigen por el apartado 9), sin ninguna garantía de resultado, disponibilidad o idoneidad para un fin determinado. Pueden modificarse, interrumpirse o retirarse en cualquier momento.

      ## 4. Revisa el resultado antes de compartirlo

      Eres responsable de revisar cada documento antes de usarlo o compartirlo. En particular:

      - **La detección automática de datos personales no es exhaustiva.** Es posible que no se detecten los nombres escritos sin tratamiento, las direcciones postales, el texto manuscrito, las páginas escaneadas y los formatos poco comunes. Lee el documento y completa tú mismo la censura.
      - **La censura solo se aplica a lo que marcas.** La información también puede aparecer en imágenes, archivos adjuntos, comentarios u otras copias del archivo. Nuestra [guía](/es/como-censurar-un-pdf/) enumera las comprobaciones que debes hacer.
      - **Conserva tus archivos originales.** Los cambios que hacen las herramientas, como la censura, el aplanado o el cifrado, son permanentes por diseño.

      ## 5. Uso lícito

      Te comprometes a usar las herramientas solo con documentos de los que eres titular o que estás autorizado a modificar, y respetando la ley. En particular, no debes usar la herramienta de desbloqueo para quitar protecciones de documentos que no tienes derecho a modificar, ni usar ninguna herramienta para vulnerar los derechos de terceros, incluidos los derechos de autor y la privacidad.

      ## 6. Firma electrónica

      Una firma dibujada con la herramienta de firma es una firma electrónica simple en el sentido del reglamento europeo eIDAS. No sustituye a una firma electrónica avanzada o cualificada cuando se exija una.

      ## 7. Responsabilidad

      En la medida permitida por la ley, METIS no será responsable de ningún daño derivado del uso de las herramientas o de la imposibilidad de usarlas, incluida la divulgación de información que no se haya censurado, la pérdida o alteración de archivos, o una decisión tomada a partir de un documento procesado. Nada de lo dispuesto en estas condiciones limita la responsabilidad que no pueda limitarse conforme a la ley aplicable, ni los derechos que asisten a los consumidores en virtud de las normas imperativas de su país de residencia.

      ## 8. Software de código abierto

      El código fuente del sitio se publica bajo la GNU Affero General Public License v3 (consulta [Código fuente](/es/codigo-fuente/)). Esa licencia rige tus derechos sobre el código. El nombre y el logotipo de pdfanonym no están cubiertos por ella.

      ## 9. Planes de pago (solo profesionales)

      Los planes de pago (pase de 24 horas, Pro, Equipo) los vende METIS **exclusivamente a clientes profesionales**: empresas, autónomos y organismos públicos que compran para los fines de su actividad comercial, empresarial o profesional. No se ofrecen a consumidores. Al realizar un pedido, confirmas que actúas como profesional.

      - **Los precios** figuran en la [página de precios](/es/precios/) sin IVA. El IVA se añade según las normas aplicables en tu país; las empresas de la UE con un número de IVA válido reciben la factura con el mecanismo de inversión del sujeto pasivo. El pago lo procesa Stripe.
      - **El acceso** comienza inmediatamente después del pago.
      - **Las suscripciones** (Pro, Equipo) se renuevan automáticamente por el mismo periodo hasta que se cancelan. Puedes cancelarlas en cualquier momento desde tu página de cuenta; la cancelación surte efecto al final del periodo ya pagado, que no se reembolsa.
      - **El pase de 24 horas** da acceso a las funciones Pro durante 24 horas desde el pago y no se renueva.
      - **Las licencias** son personales en Pro y por usuario en Equipo. La clave de licencia se guarda en tu navegador; conserva una copia para usarla en otro dispositivo.
      - **Preguntas y reclamaciones**: contact@pdfanonym.com.

      ## 10. Modificaciones y ley aplicable

      Estas condiciones pueden actualizarse; la fecha que figura en la parte superior de la página indica la última versión. Se rigen por la ley francesa. Contacto: contact@pdfanonym.com.

