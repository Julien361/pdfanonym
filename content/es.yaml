    description: 'Edita el texto de un PDF en el navegador: haz clic en una palabra, escribe la nueva y descarga. Mismo lugar, tamaño y color. Sin subir archivos ni marca de agua.'
    h1: Editar el texto de un PDF, <span class="hl">palabra por palabra</span>
    h1_plain: Editar el texto de un PDF
    lede: 'Una fecha, un nombre, un importe, una errata: haz clic en la palabra del PDF, escribe la correcta y listo. El texto antiguo se elimina de verdad del archivo.'
    suffix: editado
    hint: Haz clic en una palabra, escribe el texto nuevo y pulsa Intro para confirmar (Esc para cancelar, Tab para la palabra siguiente). Déjalo vacío para borrar la palabra.
    stepsTitle: Cómo editar el texto de un PDF
    steps:
    - h: Abre tu PDF
      p: Arrástralo a la página. Se abre en tu ordenador; no se sube nada.
    - h: Haz clic en una palabra
      p: La palabra pasa a modo edición. Escribe el reemplazo y pulsa Intro. Para reemplazar varias palabras a la vez, arrastra de una a otra.
    - h: Descarga
      p: Cada cambio se muestra al instante tal como quedará en el archivo. Deshacer vuelve atrás; Descargar guarda el PDF editado.
    body: '## La palabra se reemplaza, no se tapa


      Muchas herramientas «editan» un PDF poniendo un rectángulo blanco sobre el texto antiguo y escribiendo encima. La palabra antigua sigue en el archivo y reaparece al copiar y pegar o al buscar. Aquí, la palabra original se elimina de verdad de la página y la nueva se escribe exactamente en su lugar, sobre la misma línea base. El fondo (color, marco, imagen) no se toca.


      ## Misma fuente, mismo tamaño, mismo color


      Cuando la fuente del documento contiene todas las letras que escribes, se reutiliza y el resultado coincide con el resto de la página. Si no, se elige la fuente estándar más parecida (sin serifa, con serifa o monoespaciada, en negrita o cursiva como el original), con el mismo tamaño y color. Si la palabra nueva es más larga o más corta, el resto de la frase se desplaza para mantener el espaciado; una columna de tabla separada por un gran espacio no se mueve.


      ## Usos habituales


      - Corregir una fecha, una referencia o un importe sin rehacer todo el documento.

      - Arreglar una errata en un PDF del que ya no tienes el archivo Word.

      - Actualizar un nombre, una dirección o un número de teléfono.


      Para escribir donde todavía no hay texto, usa [Añadir texto](/es/anadir-texto-pdf/). Para eliminar definitivamente información sensible sin reemplazarla, [censura el PDF](/es/censurar-pdf/).


      ## Límites


      Un PDF escaneado solo contiene una imagen de la página, así que no hay palabras que editar. El texto vertical o girado no se puede editar. Los caracteres fuera del alfabeto latino de Europa occidental solo pueden escribirse si la fuente del documento ya los contiene.

      '
    faq:
    - q: ¿El texto antiguo queda oculto en el archivo?
      a: No. La palabra original se elimina del contenido de la página antes de escribir la nueva. No reaparece al copiar y pegar ni al buscar.
    - q: ¿Puedo reemplazar una frase entera?
      a: 'Sí. Arrastra desde la primera hasta la última palabra de la línea: se reemplazan juntas por lo que escribas. Una frase de varias líneas se edita línea por línea.'
    - q: ¿Por qué la fuente no es exactamente la misma?
      a: Los PDF suelen incluir solo las letras usadas en el documento. Si escribes una letra que falta, se usa la fuente estándar más parecida para esa palabra, con el mismo tamaño y color.
    - q: ¿Se sube mi archivo a un servidor?
      a: No. Todo ocurre en tu navegador; el PDF no sale de tu ordenador.
