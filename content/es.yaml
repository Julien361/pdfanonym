    slug: firmar-pdf
    nav: Firmar PDF
    card: Dibuja tu firma y colócala en el documento, sin imprimir ni escanear.
    title: "Firmar PDF online: dibuja tu firma, gratis y privado"
    description: "Firmar PDF online: dibuja tu firma con el ratón o con el dedo y colócala en el documento. Gratis, en tu navegador, sin subir nada, sin cuenta ni marca de agua."
    h1: 'Firmar un PDF con tu <span class="hl">propia firma</span>'
    h1_plain: Firmar PDF
    lede: "Para firmar un PDF ya no hace falta imprimir, firmar y escanear. Dibuja tu firma una vez, colócala donde corresponde y descarga el PDF firmado."
    suffix: firmado
    hint: "Haz clic en una página para colocar tu firma. Arrastra para moverla, usa la esquina para cambiar su tamaño."
    stepsTitle: Cómo firmar un PDF
    steps:
      - h: Abre tu PDF
        p: "Suelta el documento que vas a firmar. Se queda en tu equipo."
      - h: Dibuja tu firma
        p: "Dibújala con el ratón, el panel táctil o el dedo y haz clic en <b>Usar esta firma</b>."
      - h: Colócala y descarga
        p: "Haz clic donde va, ajusta su tamaño, añade la fecha con la herramienta <b>Texto</b> si hace falta y descarga."
    body: |
      ## Una firma limpia y transparente

      Tu dibujo se recorta automáticamente y se coloca con fondo transparente, así que queda sobre las líneas de firma y las tablas sin un recuadro blanco alrededor. Puedes colocarla en varias páginas y cambiar el tamaño de cada copia. Si también necesitas la fecha o tu nombre, puedes [añadir texto al PDF](/es/anadir-texto-pdf/) junto a la firma.

      ## ¿Qué tipo de firma es?

      Una firma dibujada es lo que el reglamento europeo eIDAS llama firma electrónica simple. Se usa mucho en documentos cotidianos: presupuestos, albaranes, formularios internos, contratos de alquiler entre particulares. Algunos documentos exigen una firma electrónica avanzada o cualificada, basada en un certificado y en la verificación de la identidad; para esos, usa un servicio de firma especializado.

      ## Tu firma se queda contigo

      La imagen de la firma se crea en tu navegador y se escribe en tu PDF, en tu equipo. Nunca la subimos ni la guardamos. Antes de enviarlo, puedes [aplanar el PDF](/es/aplanar-pdf/) para que la firma quede integrada en la página, y [proteger el PDF con contraseña](/es/proteger-pdf/) si contiene datos sensibles.
    faq:
      - q: "¿Puedo firmar desde el móvil?"
        a: "Sí. Abre la página en tu móvil, dibuja con el dedo y toca donde debe ir la firma."
      - q: "¿Puedo añadir la fecha y mi nombre?"
        a: "Sí. Cambia a la herramienta Texto en la barra de herramientas, haz clic junto a la firma y escribe."
      - q: "¿Se guarda mi firma para la próxima vez?"
        a: "No. No se guarda nada: la dibujas de nuevo para cada documento, lo que también significa que nadie más puede reutilizarla desde este sitio."

  watermark:
    slug: marca-de-agua-pdf
    nav: Marca de agua
    card: Estampa CONFIDENCIAL, BORRADOR o tu nombre en todas las páginas.
    title: "Poner marca de agua PDF online, gratis y privado"
    description: "Añade una marca de agua PDF de texto (CONFIDENCIAL, BORRADOR, COPIA…) a todas las páginas. Elige opacidad, color y dirección con vista previa. Sin subir nada."
    h1: 'Añadir una <span class="hl">marca de agua</span> a un PDF'
    h1_plain: Añadir marca de agua a PDF
    lede: "Con una marca de agua PDF señalas un documento como confidencial, como borrador o como copia para un destinatario concreto. Escribe el texto, ajústalo con la vista previa en directo y descarga."
    suffix: marcado
    runLabel: Añadir marca de agua y descargar
    stepsTitle: Cómo poner una marca de agua en un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página."
      - h: Configura la marca de agua
        p: "Escribe el texto y elige la opacidad, el color y la dirección. La vista previa de la primera página se actualiza sobre la marcha."
      - h: Descarga
        p: "La marca de agua se añade a todas las páginas."
    body: |
      ## Ideas de marca de agua

      - **CONFIDENCIAL** o **INTERNO** en documentos que no deben circular.
      - **BORRADOR** en versiones que no son definitivas.
      - **Copia para [destinatario]** en un documento de identidad o una nómina que envías a un casero o a una agencia: si se filtra, queda claro de dónde salió y para qué era.

      ## Lo que hace y lo que no hace una marca de agua

      Una marca de agua disuade del mal uso y deja clara la procedencia de una copia. No impide que alguien decidido la quite con un programa de edición. Para una protección más fuerte, [aplana](/es/aplanar-pdf/) también el archivo y [protégelo con contraseña](/es/proteger-pdf/).

      ## Caracteres

      La marca de agua usa Helvetica Bold, que cubre el alfabeto latino con los acentos de Europa occidental. Los demás sistemas de escritura no son compatibles.
    faq:
      - q: "¿El texto que hay bajo la marca de agua sigue siendo legible?"
        a: "Sí. La marca de agua es semitransparente; ajusta la opacidad entre el 5 % y el 60 %."
      - q: "¿Puedo poner la marca de agua solo en algunas páginas?"
        a: "Esta herramienta marca todas las páginas. Para marcar una selección, extrae primero esas páginas, ponles la marca de agua y luego únelas."
      - q: "¿Puedo usar una imagen como marca de agua?"
        a: "Todavía no: por ahora solo se admiten marcas de agua de texto."

  page_numbers:
    slug: numerar-paginas-pdf
    nav: Numerar páginas
    card: Numera las páginas de un PDF con la posición y el formato que elijas.
    title: "Numerar páginas PDF online, gratis y privado"
    description: "Numerar páginas PDF: posición, formato (1, Página 1, Página 1 de 10), número inicial, portada sin numerar. Vista previa en directo, sin subir nada."
    h1: 'Numerar las <span class="hl">páginas</span> de un PDF'
    h1_plain: Numerar páginas PDF
    lede: "Numerar páginas PDF de un informe, un anexo o un dossier lleva unos segundos. Elige dónde van los números y cómo se ven; la vista previa se actualiza en directo."
    suffix: numerado
    runLabel: Añadir números de página y descargar
    stepsTitle: Cómo numerar las páginas de un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página."
      - h: Elige posición y formato
        p: "Abajo o arriba; a la izquierda, en el centro o a la derecha; 1, Página 1 o Página 1 de 12; número inicial; omite la portada si hace falta."
      - h: Descarga
        p: "Los números se añaden a todas las páginas como texto real."
    body: |
      ## Formatos para cada uso

      Los números simples sirven para la mayoría de los documentos. «Página 1 de 12» es habitual en contratos y documentos oficiales, porque así una página que falta salta a la vista. Cuando un documento continúa otro, fija el número inicial (por ejemplo 25) y marca **Omitir la primera página (portada)** para dejar la portada sin numerar.

      ## Correctos en todas las páginas

      Los números se colocan según lo que ves en pantalla, incluso en páginas giradas o recortadas, así que nunca acaban de lado ni fuera de la página.

      ## Combínalo con otras herramientas

      ¿Preparas un dossier con varios documentos? Primero [une](/es/unir-pdf/) los archivos y luego numera el resultado para que la numeración recorra todo el conjunto. Si el dossier es confidencial, puedes añadir después una [marca de agua al PDF](/es/marca-de-agua-pdf/) en todas las páginas.
    faq:
      - q: "¿Puedo empezar la numeración en un número distinto de 1?"
        a: "Sí. Pon cualquier número en “Empezar en”."
      - q: "¿Puedo dejar la portada sin número?"
        a: "Sí. Marca “Omitir la primera página (portada)”: la numeración empieza en la segunda página."
      - q: "¿Los números son texto que se puede buscar?"
        a: "Sí. Se añaden como texto real en Helvetica."

  compress:
    slug: comprimir-pdf
    nav: Comprimir PDF
    card: Reduce el peso de un PDF para el correo y los portales encogiendo las imágenes demasiado grandes.
    title: "Comprimir PDF online: reducir tamaño PDF gratis y privado"
    description: "Comprimir PDF en tu navegador: las imágenes demasiado grandes se reducen y recomprimen, y las fuentes se recortan. Tres niveles, sin subir nada."
    h1: 'Comprimir un PDF <span class="hl">sin subirlo</span>'
    h1_plain: Comprimir PDF
    lede: "¿Pesa demasiado para enviarlo por correo o subirlo a un portal? Reduce el tamaño del PDF encogiendo las imágenes sobredimensionadas y los datos sin usar, conserva el texto nítido y compara el tamaño antes y después."
    suffix: comprimido
    runLabel: Comprimir y descargar
    stepsTitle: Cómo comprimir un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. Se muestra su tamaño actual."
      - h: Elige un nivel
        p: "Ligero, Recomendado o Fuerte. Recomendado va bien para pantalla e impresión de oficina."
      - h: Descarga
        p: "Ves el nuevo tamaño y el porcentaje ahorrado. Si no se puede reducir, tu archivo se queda como estaba."
    body: |
      ## Qué hace pesado un PDF

      Casi siempre, las imágenes. Una foto sacada directamente del móvil o un escaneo a 600 dpi contiene muchos más píxeles de los que necesita una página. Para comprimir el PDF, pdfanonym reduce cada imagen a la resolución que la página puede mostrar de verdad (unos 220, 150 o 100 dpi según el nivel) y la vuelve a comprimir. Las fuentes se recortan a los caracteres que realmente se usan y se eliminan los objetos sin usar. Si creas el PDF a partir de fotos, la herramienta para [convertir JPG a PDF](/es/jpg-a-pdf/) incrusta las imágenes sin recomprimir, así que conviene comprimir el resultado después.

      ## Qué puedes esperar

      | Documento | Resultado habitual |
      |---|---|
      | Fotos, escaneos en color, presentaciones | Gran reducción, a menudo del 50 % al 90 % |
      | Informes mixtos | Reducción moderada |
      | Documentos solo de texto, archivos ya optimizados | Poco o ningún cambio |

      El texto y los dibujos vectoriales nunca se convierten en imágenes, así que siguen perfectamente nítidos en cualquier nivel. Para documentos que se van a imprimir, [pasar el PDF a blanco y negro](/es/pdf-blanco-y-negro/) también reduce el peso de las fotos en color.

      ## Archivos grandes

      Todo se ejecuta en tu equipo, así que un escaneo de 100 páginas puede tardar unos segundos. No hay tiempo de subida ni límite de tamaño impuesto por un servidor. Si solo necesitas enseñar una página, [convertir el PDF a JPG](/es/pdf-a-jpg/) suele dar un archivo mucho más ligero.
    faq:
      - q: "¿La compresión reduce la calidad?"
        a: "Ligero mantiene las imágenes cerca del original. Con Recomendado la diferencia apenas se nota en pantalla y en impresión de oficina. Fuerte muestra una pérdida visible en las fotos al ampliar. El texto nunca se ve afectado."
      - q: "¿Por qué mi archivo apenas se ha reducido?"
        a: "Contiene pocos datos de imagen, o sus imágenes ya estaban comprimidas. En ese caso la herramienta te lo indica y deja tu archivo tal cual."
      - q: "¿Hay un límite de tamaño?"
        a: "No imponemos ningún límite; los archivos muy grandes dependen de la memoria de tu equipo."

  pdf_to_jpg:
    slug: pdf-a-jpg
    nav: PDF a JPG
    card: Convierte cada página de un PDF en una imagen JPG o PNG.
    title: "PDF a JPG online: convierte páginas en imágenes, gratis"
    description: "Pasa de PDF a JPG o PNG cada página, con calidad de pantalla o de impresión. Si hay varias páginas, se descargan en un ZIP. Sin subir nada y sin cuenta."
    h1: 'Convertir PDF a JPG: <span class="hl">páginas en imágenes</span>'
    h1_plain: PDF a JPG
    lede: "Pasa de PDF a JPG para compartir una página en redes sociales, insertarla en una presentación o enviarla donde no se aceptan PDF. Cada página se convierte en una imagen."
    suffix: imagenes
    runLabel: Convertir y descargar
    stepsTitle: Cómo convertir PDF a JPG
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página."
      - h: Elige formato y calidad
        p: "JPG para fotos y archivos pequeños, PNG para texto y dibujos nítidos. 150 dpi va bien para pantalla, 300 dpi para imprimir."
      - h: Descarga
        p: "Una página da una imagen; varias páginas se agrupan en un archivo ZIP."
    body: |
      ## ¿JPG o PNG?

      **JPG** genera archivos pequeños y se acepta en todas partes; es la opción adecuada para páginas con fotos. **PNG** no tiene pérdida: el texto y las líneas se mantienen perfectamente nítidos, a cambio de archivos más grandes. Si solo quieres enviar el documento más ligero, quizá te baste con [comprimir el PDF](/es/comprimir-pdf/) sin convertirlo.

      ## ¿Qué calidad?

      | Ajuste | Uso |
      |---|---|
      | 96 dpi | Pantallas, mensajes, vistas previas |
      | 150 dpi | Uso general, presentaciones |
      | 300 dpi | Impresión, archivo |

      ## Convertido en tu equipo

      Las páginas las genera el mismo motor que usan muchos lectores de PDF, directamente en tu navegador. Tu documento no se envía a ningún sitio. Para convertir solo una página, [extrae las páginas del PDF](/es/extraer-paginas-pdf/) que necesitas antes; para volver a juntar imágenes en un documento, usa [convertir JPG a PDF](/es/jpg-a-pdf/).
    faq:
      - q: "¿Cómo convierto una sola página?"
        a: "Usa Extraer páginas para quedarte con la página que necesitas y luego convierte ese archivo. Una sola página se descarga como una sola imagen."
      - q: "¿Puedo volver a convertir las imágenes en PDF?"
        a: "Sí, con JPG a PDF."
      - q: "¿El texto de las imágenes se puede seleccionar?"
        a: "No. Una imagen es una foto de la página; conserva el PDF si necesitas texto seleccionable."

  jpg_to_pdf:
    slug: jpg-a-pdf
    nav: JPG a PDF
    card: Junta fotos y escaneos en un solo PDF, en el orden que elijas.
    title: "JPG a PDF online: convierte imágenes en PDF, gratis"
    description: "Pasa de JPG a PDF: convierte JPG, PNG y otras imágenes en un único PDF. Reordena arrastrando, elige tamaño de página y margen. Gratis y sin subir nada."
    h1: 'De JPG a PDF: tus imágenes en <span class="hl">un solo PDF</span>'
    h1_plain: JPG a PDF
    lede: "Fotos de tiques, páginas escaneadas, capturas de pantalla: suéltalas, ordénalas y pasa de JPG a PDF en un único archivo listo para enviar."
    suffix: imagenes
    hint: "Arrastra las miniaturas para cambiar el orden. ✕ quita una imagen."
    runLabel: Crear PDF
    stepsTitle: Cómo convertir JPG a PDF
    steps:
      - h: Suelta tus imágenes
        p: "JPG, PNG y otros formatos habituales. Añade más con <b>Añadir imágenes</b>."
      - h: Ordena y configura
        p: "Arrastra para reordenar. Elige el tamaño de página (igual que la imagen, A4 o Letter) y el margen."
      - h: Crea el PDF
        p: "Una imagen por página, en tu orden, descargadas en un solo archivo."
    body: |
      ## Tamaño de página: ¿cuál elegir?

      **Igual que la imagen** crea páginas que se ajustan exactamente a cada foto, lo ideal para capturas de pantalla y fotos. **A4** o **Letter** coloca cada imagen en una página estándar, centrada y escalada para que quepa, mejor para documentos que vas a imprimir o enviar a una administración. Las imágenes horizontales reciben automáticamente páginas horizontales. Si una foto sale de lado, puedes [rotar el PDF](/es/rotar-pdf/) página por página.

      ## Formatos compatibles

      JPG y PNG se añaden tal cual, sin recomprimir. Los demás formatos que tu navegador puede abrir (GIF, BMP, WebP y, en algunos dispositivos, HEIC) se convierten primero. Las fotos de móvil pesan mucho: si el PDF final es demasiado grande para enviarlo, [comprime el PDF](/es/comprimir-pdf/) después.

      ## Privado por diseño

      Tiques, documentos de identidad y extractos bancarios son cosas que la gente suele convertir en PDF. Aquí las imágenes se quedan en tu dispositivo. Para añadirlas a un documento que ya tienes, [une los PDF](/es/unir-pdf/) en un solo archivo.
    faq:
      - q: "¿Se reduce la calidad de las imágenes?"
        a: "Las imágenes JPG y PNG se incrustan tal cual, sin recomprimir. Usa Comprimir PDF después si el archivo pesa demasiado."
      - q: "¿Cuántas imágenes puedo añadir?"
        a: "No hay un límite fijo; las fotos muy grandes usan más memoria."
      - q: "¿Puedo mezclar fotos y un PDF existente?"
        a: "Crea aquí un PDF con las fotos y luego usa Unir PDF para combinarlo con tu otro documento."

  protect:
    slug: proteger-pdf
    nav: Proteger PDF
    card: Bloquea un PDF con contraseña mediante cifrado AES-256.
    title: "Proteger PDF con contraseña online: AES-256, gratis"
    description: "Proteger PDF con contraseña y cifrado AES-256, eligiendo qué se permite (imprimir, copiar, editar). El archivo y la contraseña se quedan contigo."
    h1: 'Proteger un PDF con <span class="hl">contraseña</span>'
    h1_plain: Proteger PDF con contraseña
    lede: "Protege tu PDF con contraseña antes de enviarlo por correo o guardarlo en la nube: el documento queda cifrado y solo quien tenga la contraseña puede abrirlo."
    suffix: protegido
    runLabel: Proteger y descargar
    stepsTitle: Cómo proteger un PDF con contraseña
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página."
      - h: Elige una contraseña
        p: "Escríbela dos veces. Elige si se permite imprimir, copiar o editar una vez abierto el archivo."
      - h: Descarga
        p: "El PDF se cifra con AES-256, el cifrado PDF estándar más fuerte."
    body: |
      ## Cifrado fuerte, hecho en local

      El PDF se cifra con AES-256. Sin la contraseña, su contenido no se puede leer. Como el cifrado se hace en tu navegador, ni el documento ni la contraseña se envían nunca a un servidor. El cifrado protege el contenido, pero quien tenga la contraseña verá también el autor y los comentarios: si no deben llegar al destinatario, [elimina los metadatos del PDF](/es/eliminar-metadatos-pdf/) antes de protegerlo.

      ## Elige una buena contraseña

      Usa al menos 12 caracteres, idealmente varias palabras sin relación entre sí. Envía la contraseña por un canal distinto al del archivo: si mandas el PDF por correo, da la contraseña por teléfono o por SMS. Si más adelante necesitas quitarla, podrás [desbloquear el PDF](/es/desbloquear-pdf/) con esa misma contraseña.

      ## Permisos

      También puedes restringir la impresión, la copia y la edición para quien abra el archivo. Los lectores más comunes respetan estas restricciones, pero por sí solas no son una protección fuerte; lo que mantiene privado el contenido es la contraseña. Si lo que quieres es que nadie cambie las respuestas de un formulario, [aplanar el PDF](/es/aplanar-pdf/) antes de protegerlo es más eficaz.
    faq:
      - q: "¿Qué pasa si olvido la contraseña?"
        a: "No se puede recuperar, ni nosotros ni nadie: nunca la vemos. Guarda una copia del archivo sin proteger en un lugar seguro."
      - q: "¿Qué lectores pueden abrir el archivo protegido?"
        a: "Todos los lectores de PDF actuales (Adobe Acrobat Reader, los navegadores, Vista Previa de Apple, las apps móviles) admiten AES-256."
      - q: "¿Puedo quitar la contraseña más adelante?"
        a: "Sí, con Desbloquear PDF, siempre que conozcas la contraseña."

  unlock:
    slug: desbloquear-pdf
    nav: Desbloquear PDF
    card: Quita la contraseña o las restricciones de impresión y copia de tu propio PDF.
    title: "Desbloquear PDF online: quitar contraseña PDF y restricciones"
    description: "Desbloquear PDF: quita la contraseña de un PDF que puedes abrir o quita sus límites de impresión y copia. En tu navegador, sin subir nada. Solo tus documentos."
    h1: 'Desbloquear un PDF <span class="hl">que es tuyo</span>'
    h1_plain: Desbloquear PDF
    lede: "¿Cansado de escribir cada vez la contraseña de tu propio extracto bancario? Quita la contraseña del PDF una sola vez. También puedes levantar las restricciones que bloquean la impresión o la copia."
    suffix: desbloqueado
    runLabel: Desbloquear y descargar
    stepsTitle: Cómo desbloquear un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. Si necesita contraseña para abrirse, aparece un campo."
      - h: Escribe la contraseña
        p: "Escribe la contraseña que usas normalmente para abrirlo. Los archivos que se abren sin contraseña no necesitan nada."
      - h: Descarga
        p: "Obtienes el mismo documento, sin contraseña ni restricciones."
    body: |
      ## Dos tipos de protección PDF

      Algunos PDF piden una contraseña para **abrirlos**; es habitual en extractos bancarios, nóminas y documentos fiscales. Otros se abren sin problema pero **restringen** lo que puedes hacer: imprimir, copiar texto, rellenar formularios. Esta herramienta resuelve los dos casos, siempre que puedas abrir el archivo con normalidad. Una vez desbloqueado, puedes trabajar con él en las demás herramientas, por ejemplo para [comprimir el PDF](/es/comprimir-pdf/) antes de enviarlo.

      ## Solo para tus propios documentos

      Para desbloquear hace falta la contraseña del archivo: no es un programa para descifrar contraseñas. Úsala con documentos que te pertenecen o que tienes permiso para modificar, como tus propios extractos o archivos cuyo autor te dio la contraseña.

      ## Se queda en tu equipo

      Tu PDF y su contraseña se procesan en tu navegador y nunca se envían a ningún sitio. Si después quieres volver a cifrarlo, puedes [proteger el PDF](/es/proteger-pdf/) con una contraseña nueva.
    faq:
      - q: "¿Se puede desbloquear un PDF si olvidé la contraseña?"
        a: "No. La contraseña es necesaria para descifrar el archivo; no intentamos adivinarla ni romperla."
      - q: "¿Cambia el contenido?"
        a: "No. Las páginas, el texto, las imágenes y los enlaces quedan igual; solo se eliminan el cifrado y las restricciones."
      - q: "¿Puedo volver a protegerlo con otra contraseña?"
        a: "Sí, con Proteger PDF."

  batch:
    slug: anonimizar-pdf-por-lotes
    nav: Anonimizar por lotes
    card: "Pro: anonimiza decenas de PDF de una vez, con un informe CSV."
    title: "Anonimizar PDF por lotes: censura muchos documentos a la vez"
    description: "Anonimiza varios PDF de una vez: correos, teléfonos, IBAN, nombres, direcciones y tus propias listas de términos, censurados en cada archivo. ZIP e informe CSV. Local, Pro."
    h1: 'Anonimiza <span class="hl">muchos PDF</span> a la vez'
    h1_plain: Anonimizar PDF por lotes
    lede: "Suelta una carpeta de documentos, elige lo que debe desaparecer y recibe todos los archivos censurados en un ZIP, con un informe CSV para tus registros. Sigue siendo 100 % local."
    suffix: anonimizado
    runLabel: Anonimizar todo
    stepsTitle: Cómo funciona la anonimización por lotes
    steps:
      - h: Suelta tus PDF
        p: "Selecciona todos los archivos que necesites. Se procesan uno tras otro en tu equipo."
      - h: Elige qué censurar
        p: "Marca las categorías (correos, teléfonos, IBAN, nombres, direcciones…) y añade tus propios términos: nombres de clientes, números de expediente, códigos internos."
      - h: Descarga el ZIP
        p: "Cada archivo se censura y se limpia de metadatos. Un informe CSV indica, por archivo y por página, cuántos elementos se eliminaron en cada categoría."
    body: |
      ## Pensado para el trabajo recurrente

      Responder a solicitudes de acceso del RGPD, preparar expedientes, publicar resoluciones, compartir documentos de RR. HH. con un auditor: cuando los mismos tipos de datos deben desaparecer de muchos documentos, el modo por lotes hace en una pasada lo que, si no, te llevaría una tarde.

      ## Qué se detecta

      Todo lo que encuentra el [anonimizador gratuito](/es/anonimizar-pdf/) (correos, teléfonos, IBAN, tarjetas, números de seguridad social, IP, nombres tras un tratamiento), más la detección Pro: nombres escritos sin tratamiento, direcciones postales, fechas de nacimiento, matrículas y números de IVA. Tus listas de términos se aplican a todos los archivos, sin tener en cuenta mayúsculas ni tildes.

      ## Revisa antes de compartir

      La detección automática no es exhaustiva. El informe CSV te ayuda a localizar los archivos en los que no se encontró nada o muy poco, que merecen una revisión más atenta. El texto de las páginas escaneadas no se analiza. Para revisar lo que queda en las propiedades de un archivo (autor, título, fechas), usa la herramienta para [eliminar los metadatos de un PDF](/es/eliminar-metadatos-pdf/).
    faq:
      - q: "¿El modo por lotes está incluido en el plan Pro?"
        a: "Sí, en el pase de 24 horas y en los planes Pro y Equipo."
      - q: "¿Cuántos archivos puedo procesar a la vez?"
        a: "No hay un límite fijo. Los archivos se procesan uno a uno, así que el límite es la memoria de tu equipo y tu paciencia: cientos de documentos normales no son problema."
      - q: "¿Se suben mis archivos para el procesamiento por lotes?"
        a: "No. Como todas las herramientas de pdfanonym, el modo por lotes funciona por completo en tu navegador."

