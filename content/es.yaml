pages:
  home:
    slug: ""
    title: "pdfanonym: censurar y anonimizar PDF en tu navegador, gratis"
    description: "Censura y anonimiza PDF gratis: borra nombres, cifras y metadatos ocultos sin subir el archivo. Texto eliminado de verdad, sin cuenta ni marca de agua."
    h1: 'Limpia tus PDF <span class="hl">antes</span> de compartirlos'
    lede: "Censura nombres, borra texto, elimina los metadatos ocultos. Todo ocurre en tu propio equipo: tu documento nunca se envía a un servidor, ni siquiera al nuestro."
    cta: Censurar un PDF ahora
    toolsTitle: Elige una herramienta
    faq:
      - q: "¿pdfanonym es gratis de verdad?"
        a: "Sí. Las 20 herramientas son gratuitas, sin cuenta, sin límite diario y sin marca de agua. Un <a href=\"/es/precios/\">plan Pro</a> opcional añade la anonimización por lotes, la detección ampliada y los informes para profesionales."
      - q: "¿Cómo puedo comprobar que mi archivo no se sube?"
        a: "Abre las herramientas para desarrolladores de tu navegador, ve a la pestaña Red y procesa un archivo: no verás ninguna solicitud que lo transporte. La página incluye además una política de seguridad que le prohíbe enviar datos a cualquier otro sitio. Y el código fuente completo está disponible para que lo leas."
      - q: "¿Funciona sin conexión?"
        a: "Sí. Cuando una página de herramienta termina de cargarse, puedes desconectarte de internet y seguir trabajando con tus PDF."
    body: |
      ## ¿Por qué otra herramienta PDF?

      Porque la mayoría falla en algo esencial. Cuando «tachas» un nombre en un editor online típico, lo que hace es dibujar un rectángulo encima del texto. La página parece limpia, pero cualquiera puede seleccionar, copiar o buscar las palabras que hay debajo. Hay abogados que han caído en esta trampa en escritos judiciales, y también organismos públicos.

      Para [anonimizar un PDF](/es/anonimizar-pdf/) de verdad, pdfanonym elimina los caracteres del propio archivo. Lo que borras desaparece: no se puede copiar, buscar ni recuperar.

      ## Privado por diseño, no por promesa

      Los servicios que obligan a subir el archivo te piden que les confíes tu contrato, tu nómina o tu informe médico. Nosotros no te pedimos esa confianza porque nunca recibimos el archivo. El motor PDF se ejecuta dentro de tu navegador (es [MuPDF](https://mupdf.com), compilado a WebAssembly), así que el documento va de tu disco a tu pantalla y vuelve a tu disco.

      Eso importa si manejas expedientes de clientes, documentos de recursos humanos o cualquier cosa sujeta al RGPD: no hay ningún tercero que declarar ni nada que borrar después. Lo mismo vale cuando necesitas [unir PDF](/es/unir-pdf/) o [comprimir un PDF](/es/comprimir-pdf/): el archivo no sale de tu equipo.

  redact:
    slug: censurar-pdf
    nav: Censurar PDF
    card: Tacha nombres, cifras y pasajes sensibles. El texto bajo el recuadro se borra.
    title: "Censurar PDF online gratis y privado (texto borrado de verdad)"
    description: "Censura tu PDF y borra el texto para siempre, en tu navegador: sin subir nada, sin cuenta, sin marca de agua. Busca y tacha cada aparición de una vez."
    h1: 'Censurar un PDF: <span class="redacted">tachar</span> texto para siempre'
    h1_plain: Censurar PDF
    lede: "Selecciona un nombre, un número de cuenta o un párrafo entero: pdfanonym lo elimina del archivo y deja un recuadro negro en su lugar. No se sube nada."
    black: true
    suffix: censurado
    stepsTitle: Cómo censurar un PDF en tres pasos
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página o elígelo desde tu equipo. Se abre al instante, porque nunca sale de tu dispositivo."
      - h: Marca lo que debe desaparecer
        p: "Arrastra sobre el texto, haz clic en una palabra, doble clic en una línea, o escribe un nombre en el buscador y pulsa <b>Marcar todo</b>. Para escaneos, cambia a <b>Zona</b> y dibuja un rectángulo."
      - h: Aplica y descarga
        p: "Pulsa <kbd>Supr</kbd> o <b>Aplicar</b> para borrar el texto, revisa el resultado y luego <b>Descargar</b>. Los metadatos ocultos también se eliminan por defecto."
    compare:
      title: Un recuadro negro no es censurar
      intro: "La mayoría de los editores PDF te dejan dibujar un rectángulo negro y lo llaman censura. La diferencia solo se nota cuando alguien copia el texto."
      bad_h: Dibujar un recuadro encima
      bad_p: "La página parece censurada, pero las palabras siguen en el archivo. Selecciona la zona, copia, pega en un correo: aparece el nombre oculto. La búsqueda también lo encuentra, igual que cualquier herramienta de extracción de texto."
      good_h: Censura real
      good_p: "Los caracteres bajo el recuadro se eliminan del contenido de la página. No queda nada que copiar, buscar ni extraer. El recuadro negro es solo una marca visual, e incluso puedes elegir dejar un espacio en blanco."
    body: |
      ## ¿Qué puedes censurar?

      Todo lo que sea texto en el PDF: nombres, direcciones, correos electrónicos, teléfonos, datos bancarios (IBAN), números de seguridad social o de identificación fiscal, salarios, referencias de expedientes, firmas escritas como texto. El buscador encuentra cada aparición en todas las páginas, sin distinguir mayúsculas ni acentos, así que el apellido de un cliente queda marcado en todo un archivo de 200 páginas con un solo clic. Si prefieres que los correos, teléfonos o IBAN se encuentren solos, usa la herramienta para [anonimizar un PDF](/es/anonimizar-pdf/), que detecta automáticamente los datos personales.

      Si tu PDF es un **escaneo**, el «texto» es en realidad una imagen. Cambia al modo **Zona**, dibuja un rectángulo sobre el pasaje y marca **imágenes** en las opciones: los píxeles dentro del rectángulo se borran de la propia imagen.

      ## ¿Quién necesita censurar o anonimizar un PDF?

      - **Abogados y asistentes jurídicos** que preparan pruebas documentales y escritos judiciales.
      - **Equipos de recursos humanos** que comparten nóminas, contratos o informes de investigación.
      - **Cualquiera que responda a una solicitud de acceso del RGPD o de acceso a la información pública**, cuando hay que retirar los datos de terceros antes de entregar el documento.
      - **Propietarios, inquilinos y trabajadores independientes** que envían extractos bancarios o documentos de identidad de los que solo hace falta una parte.

      ## Comprueba la censura antes de enviar

      Después de descargar, abre el archivo, selecciona la zona censurada e intenta copiarla; luego busca una de las palabras que eliminaste. No debería aparecer nada. Nuestra guía sobre [cómo censurar un PDF correctamente](/es/como-censurar-un-pdf/) recoge todas las comprobaciones. Ten en cuenta que la censura no toca el autor ni el título ocultos en las propiedades del archivo, salvo si dejas marcada la opción de metadatos; para saber más, mira cómo [eliminar los metadatos de un PDF](/es/eliminar-metadatos-pdf/).
    faq:
      - q: "¿El texto se borra de verdad o solo se tapa?"
        a: "Se borra. pdfanonym aplica la censura al contenido de la página, así que los caracteres dejan de existir en el archivo. Copiar, buscar o extraer el texto no devuelve nada."
      - q: "¿Puedo censurar un PDF escaneado?"
        a: "Sí, con el modo Zona. Dibuja un rectángulo y marca “imágenes” en las opciones: la parte de la imagen escaneada que queda bajo el rectángulo se deja en blanco. La búsqueda de texto no funciona en los escaneos porque no tienen capa de texto."
      - q: "¿Puedo eliminar el texto sin dejar un recuadro negro?"
        a: "Sí. Desmarca “Dejar un recuadro negro” en las opciones, o usa nuestra herramienta para <a href=\"/es/borrar-texto-pdf/\">borrar texto de un PDF</a>, que deja un espacio en blanco."
      - q: "¿Hay un límite de páginas o de tamaño?"
        a: "No hay un límite fijo. Los archivos muy grandes (varios cientos de páginas) dependen de la memoria de tu equipo, pero los documentos habituales se abren en un segundo."
      - q: "¿Puedo deshacer una censura?"
        a: "Sí, mientras no hayas cerrado la página: pulsa Ctrl/Cmd+Z. Una vez descargado el archivo, la censura es permanente, y de eso se trata."
      - q: "¿Se guardan mis archivos en algún sitio?"
        a: "No. Nunca se suben, así que no tenemos nada que guardar ni que borrar."

  remove:
    slug: borrar-texto-pdf
    nav: Borrar texto
    card: Borra palabras o párrafos de un PDF y deja un espacio en blanco limpio.
    title: "Borrar texto PDF o usar tipex, de verdad (gratis y sin conexión)"
    description: "Borra, elimina o pon tipex al texto de un PDF sin dejar las palabras debajo. Un borrador de PDF gratuito que funciona en tu navegador: sin subidas, sin cuenta."
    h1: 'Borrar texto de un PDF, <span class="hl">de verdad</span>'
    h1_plain: Borrar texto de un PDF
    lede: "Borra una palabra, una línea o un bloque entero de tu PDF. El texto se elimina del archivo, no se esconde bajo un rectángulo blanco, y el resto de la página se queda exactamente donde estaba."
    black: false
    suffix: editado
    stepsTitle: Cómo borrar texto de un PDF
    steps:
      - h: Abre el PDF
        p: "Suéltalo aquí. Lo lee tu navegador, no se envía a ningún sitio."
      - h: Selecciona el texto
        p: "Arrastra sobre él, haz clic en una palabra, o búscalo y pulsa <b>Marcar todo</b>. Usa el modo <b>Zona</b> para barrer un bloque entero."
      - h: Borra y descarga
        p: "Pulsa <kbd>Supr</kbd>. Las palabras desaparecen y dejan un espacio en blanco. Deshaz con <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd> y luego descarga."
    compare:
      title: "Por qué el «corrector» de otras herramientas deja tu texto debajo"
      intro: "Muchas herramientas ofrecen un pincel corrector. Pinta una forma blanca sobre las palabras, algo que funciona en papel y falla en un PDF."
      bad_h: Corrector blanco encima
      bad_p: "Las palabras siguen bajo la forma blanca. Copia la página, o ábrela en otro editor, y vuelven a aparecer. Los lectores de pantalla también las leen en voz alta."
      good_h: Borrado de la página
      good_p: "pdfanonym elimina los propios caracteres. El texto de alrededor conserva su posición exacta, así que el diseño no se mueve, y no queda nada debajo que encontrar."
    body: |
      ## Cómo poner tipex en un PDF sin dejar el texto debajo

      En un PDF, el «tipex» suele consistir en pintar un rectángulo blanco sobre las palabras, la versión digital del corrector líquido. Solo oculta el texto a la vista. pdfanonym hace lo que de verdad esperas de un tipex: las palabras se borran del archivo y en su lugar queda un espacio en blanco. Selecciona el texto, pulsa <kbd>Supr</kbd> y el resultado se ve exactamente igual que con tipex, salvo que no queda nada que recuperar.

      ## Antes de eliminar texto de un PDF, conviene saberlo

      Un PDF no es un documento de procesador de textos: cada palabra ocupa una posición fija en la página. Cuando eliminas una palabra en mitad de una línea, las siguientes **no** se desplazan a la izquierda para llenar el hueco; queda un espacio en blanco. Es justo lo que buscas por confidencialidad, y además mantiene intacto el diseño.

      Si necesitas **reemplazar** un texto por otro, bórralo primero aquí y luego escribe el nuevo en el mismo hueco con la herramienta para [añadir texto a un PDF](/es/anadir-texto-pdf/).

      ## Usos habituales

      - Quitar un precio, un nombre o una fecha de un presupuesto antes de reutilizarlo como plantilla.
      - Eliminar notas de borrador o menciones «CONFIDENCIAL» olvidadas en un documento.
      - Borrar datos personales de un formulario antes de compartir un ejemplo. Si el nombre figura también como autor del archivo, [elimina los metadatos del PDF](/es/eliminar-metadatos-pdf/).

      ¿Prefieres una barra negra visible? Usa [Censurar PDF](/es/censurar-pdf/).
    faq:
      - q: "¿Se moverá el texto restante?"
        a: "No. Todos los demás caracteres conservan su posición exacta. Queda un espacio en blanco donde estaba el texto eliminado."
      - q: "¿Puedo borrar texto de un PDF escaneado?"
        a: "Los escaneos contienen una imagen del texto, no texto. Usa el modo Zona y marca “imágenes” para dejar en blanco esa parte de la imagen."
      - q: "¿Borrar texto reduce la calidad?"
        a: "No. Solo se tocan los caracteres seleccionados; el resto de la página, las fuentes y las imágenes se quedan tal cual."
      - q: "¿Es gratis?"
        a: "Sí, sin cuenta, sin límite y sin marca de agua."

  metadata:
    slug: eliminar-metadatos-pdf
    nav: Editar o eliminar metadatos
    card: Consulta, edita o elimina el autor, el software, las fechas, los comentarios y los adjuntos ocultos en un PDF.
    title: "Editar metadatos PDF: ver, cambiar o eliminar, gratis"
    description: "Editor de metadatos PDF gratuito: mira el autor, el título, el software y las fechas ocultos en un PDF, cámbialos o elimínalos todos. En tu navegador, sin subir nada."
    h1: 'Ver, editar o eliminar los <span class="hl">metadatos</span> de un PDF'
    h1_plain: Editor de metadatos PDF
    lede: "Tu PDF puede llevar tu nombre, tu empresa, el software que usaste y la fecha en que lo escribiste, además de comentarios que ya habías olvidado. Mira exactamente qué contiene y luego elimínalo o sustitúyelo por tus propios valores."
    suffix: limpio
    reportCaption: Lo que lleva este PDF además de su contenido visible
    runLabel: Eliminar metadatos y descargar
    stepsTitle: Cómo eliminar los metadatos de un PDF
    steps:
      - h: Abre el PDF
        p: "Suéltalo en la página. Se analiza en tu equipo."
      - h: Lee el informe
        p: "Cada campo con contenido aparece en rojo: autor, título, software, fechas, bloque XMP, comentarios, adjuntos, scripts."
      - h: Limpia y descarga
        p: "Haz clic en el botón. Guardamos un archivo nuevo sin todo eso, lo volvemos a comprobar y te mostramos lo que queda."
    body: |
      ## ¿Qué son los metadatos de un PDF?

      Además de las páginas que ves, un PDF guarda información sobre sí mismo. Las **propiedades del documento** incluyen un título, un autor, un asunto, palabras clave, la aplicación que creó el archivo (por ejemplo «Microsoft Word») y la que lo convirtió en PDF, además de las fechas de creación y modificación. Muchos archivos contienen también un **bloque XMP**, una segunda copia de esos mismos datos en XML que algunas herramientas olvidan limpiar.

      Otras cosas viajan con el archivo sin ser «metadatos» en sentido estricto: **comentarios y notas adhesivas**, **resaltados**, **archivos adjuntos** y, a veces, **JavaScript**. Si quieres conservar visibles los comentarios y sellos pero sin que nadie pueda editarlos, puedes [aplanar el PDF](/es/aplanar-pdf/) antes de limpiar los metadatos.

      ## ¿Por qué eliminarlos?

      - El campo autor suele contener el nombre completo de quien escribió el Word original, o el nombre al que está registrada la licencia de la empresa.
      - Las fechas revelan cuándo se redactó realmente un documento, algo que puede pesar en una negociación o en un litigio.
      - Los comentarios que quedan de una revisión («comprobar esta cifra con el cliente») se olvidan con facilidad y se leen con la misma facilidad.
      - Un archivo adjunto puede contener otro documento entero.

      ## Editar metadatos PDF en lugar de eliminarlos

      A veces no quieres propiedades vacías, sino limpias y correctas: un título adecuado que aparezca en las pestañas del navegador y en los resultados de búsqueda, tu empresa como autor, palabras clave con sentido. Abre **Editar las propiedades en su lugar** debajo del informe, cambia el título, el autor, el asunto, las palabras clave, el creador o el productor, y descarga. Los campos vacíos se eliminan. El antiguo bloque XMP se descarta al mismo tiempo, porque si no algunos lectores seguirían mostrando los valores anteriores.

      ## Lo que esta herramienta no cambia

      No toca el contenido visible de tus páginas. Si un nombre aparece impreso en la página, usa [Censurar PDF](/es/censurar-pdf/) para borrarlo. Combina las dos herramientas y tendrás un documento listo para publicar.
    faq:
      - q: "¿Qué metadatos se eliminan?"
        a: "El diccionario de información del documento (título, autor, asunto, palabras clave, creador, productor, fechas), el flujo de metadatos XMP, los datos privados de aplicaciones y, si los marcas, los comentarios, los adjuntos y el JavaScript. El archivo recibe además un nuevo identificador interno."
      - q: "¿Puedo cambiar el título o el autor en lugar de borrarlos?"
        a: "Sí. Abre “Editar las propiedades en su lugar” debajo del informe, escribe los nuevos valores y descarga. Deja un campo vacío para eliminarlo."
      - q: "¿Cómo compruebo el resultado?"
        a: "Tras la limpieza, la herramienta vuelve a abrir el archivo nuevo y muestra otra vez su informe. También puedes comprobarlo en tu lector de PDF, en Archivo y luego Propiedades."
      - q: "¿Cambia el contenido visible?"
        a: "No. El texto, las imágenes y el diseño quedan exactamente igual."
      - q: "¿Por qué mi lector de PDF sigue mostrando un productor?"
        a: "Algunos lectores muestran un valor por defecto cuando el campo está vacío, o bien el archivo que abriste es el original. Abre la copia descargada, cuyo nombre termina en “-limpio”."

  flatten:
    slug: aplanar-pdf
    nav: Aplanar PDF
    card: Convierte campos de formulario, comentarios y sellos en contenido fijo que nadie puede editar.
    title: "Aplanar PDF online gratis: bloquea formularios y anotaciones"
    description: "Aplanar PDF: convierte campos de formulario rellenados, comentarios y firmas en contenido fijo de la página. Gratis, en tu navegador, sin subir nada."
    h1: 'Aplanar un PDF: <span class="hl">bloquea</span> formularios y anotaciones'
    h1_plain: Aplanar PDF
    lede: "¿Completaste un formulario? Al aplanar el PDF, los valores de los campos, los comentarios y los sellos se integran en la propia página: se imprimen sin sorpresas y ya no se pueden modificar."
    suffix: aplanado
    reportCaption: Elementos interactivos encontrados en este PDF
    runLabel: Aplanar y descargar
    stepsTitle: Cómo aplanar un PDF
    steps:
      - h: Abre el PDF
        p: "Suelta aquí tu formulario completado o tu documento anotado."
      - h: Elige qué aplanar
        p: "Campos de formulario, comentarios y sellos, o ambos. Puedes eliminar los metadatos ocultos al mismo tiempo."
      - h: Descarga
        p: "Obtienes un PDF normal en el que todo forma parte de la página."
    body: |
      ## ¿Qué significa aplanar un PDF?

      Un PDF interactivo tiene capas encima de la página: campos de formulario en los que escribir, casillas, comentarios, sellos, dibujos. El lector los muestra, pero son objetos independientes que se pueden editar, mover o borrar.

      **Aplanar** dibuja esos elementos dentro del contenido de la página y elimina los objetos interactivos. El documento se ve igual, pero ahora se comporta como una hoja impresa.

      ## ¿Cuándo conviene aplanar?

      - **Antes de enviar un formulario completado**, para que el destinatario no pueda alterar tus respuestas y todos los visores las muestren igual.
      - **Antes de imprimir**, porque algunas impresoras y lectores antiguos omiten los campos de formulario.
      - **Antes de archivar** contratos o informes. Si además el archivo no debe abrirlo cualquiera, [protege el PDF con contraseña](/es/proteger-pdf/) después de aplanarlo.
      - **Antes de censurar**: el texto escrito en un campo de formulario no forma parte de la página. Nuestra [herramienta de censura](/es/censurar-pdf/) integra los campos automáticamente, pero muchas otras no lo hacen.
      - **Antes de subirlo a un portal** que rechaza los formularios interactivos o los muestra vacíos.

      ## ¿Por qué desaparecen las respuestas de mi formulario al enviar un PDF?

      Porque nunca formaron parte de la página. Los valores de un formulario viven en objetos de campo independientes, y cada lector decide cómo dibujarlos. Algunas apps móviles, vistas previas de correo, impresoras y lectores antiguos los omiten por completo, o solo los muestran al hacer clic en un campo. Aplanar lo resuelve escribiendo los valores en el contenido de la página, donde todos los visores tienen que mostrarlos. Si tu formulario no tiene campos rellenables, puedes [añadir texto al PDF](/es/anadir-texto-pdf/) directamente sobre la página.

      ## Aplanar o «Imprimir como PDF»

      Un truco habitual es imprimir el documento en una impresora PDF. A menudo funciona, pero reconstruye todo el archivo: se pueden perder enlaces, marcadores y etiquetas de accesibilidad, y algunos controladores convierten las páginas en imágenes o cambian el tamaño de página. Aplanar solo toca las partes interactivas y deja todo lo demás como estaba.

      ## Qué se aplana

      | Elemento | Después de aplanar |
      |---|---|
      | Campos de texto, casillas, botones de opción, listas desplegables | Su valor actual se dibuja en la página |
      | Comentarios, resaltados, sellos, dibujos | Se dibujan en la página tal como se ven |
      | Firma dibujada o estampada | Se conserva como parte de la página |
      | Enlaces y marcadores | Se conservan |
      | Texto | Sigue siendo texto real y seleccionable |
    faq:
      - q: "¿Se puede revertir el aplanado de un PDF?"
        a: "No. Una vez aplanado, los valores de los campos son contenido normal de la página. Conserva el archivo original si crees que tendrás que editar el formulario de nuevo."
      - q: "¿Se mantiene mi firma?"
        a: "Una firma dibujada o estampada como anotación se conserva y pasa a formar parte de la página. En cambio, una firma digital certificada queda invalidada por cualquier cambio en el archivo, incluido el aplanado."
      - q: "¿Aplanar reduce la calidad?"
        a: "No. El texto sigue siendo texto nítido y seleccionable; nada se convierte en imagen."
      - q: "¿Aplanar reduce el tamaño del archivo?"
        a: "Normalmente un poco, porque se eliminan los objetos de campo, pero la diferencia es pequeña. Aplanar sirve para bloquear el contenido, no para comprimirlo."
      - q: "¿Puedo aplanar solo el formulario y conservar los comentarios?"
        a: "Sí. Desmarca “Comentarios, sellos y dibujos” antes de aplanar: solo los campos de formulario se integran en la página."
      - q: "¿Aplana también las capas?"
        a: "No. Las capas de contenido opcional (OCG), que se usan en algunos planos técnicos y mapas, se conservan tal cual. Esta herramienta aplana campos de formulario y anotaciones."

  delete_pages:
    slug: eliminar-paginas-pdf
    nav: Eliminar páginas
    card: Quita páginas en blanco, duplicadas o que sobran de un PDF en pocos clics.
    title: "Eliminar páginas PDF online, gratis y sin subir el archivo"
    description: "Eliminar páginas de un PDF en tu navegador: haz clic en las que sobran, elimínalas y descarga. Gratis, sin subir nada, sin registro y sin marca de agua."
    h1: 'Eliminar páginas de un PDF <span class="hl">sin subirlo</span>'
    h1_plain: Eliminar páginas PDF
    lede: "Ve todas las páginas en miniatura, haz clic en las que no necesitas y elimínalas. Tu PDF se procesa en tu equipo y nunca se envía a ningún sitio."
    suffix: editado
    hint: "Haz clic en las páginas para seleccionarlas (Mayús+clic para un rango) y pulsa Supr o “Eliminar seleccionadas”."
    stepsTitle: Cómo eliminar páginas de un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. Las miniaturas de todas las páginas aparecen en un segundo."
      - h: Selecciona las páginas que sobran
        p: "Haz clic en una página para seleccionarla, Mayús+clic para seleccionar un rango, o usa la ✕ de una miniatura para eliminar una sola página."
      - h: Elimina y descarga
        p: "Pulsa <kbd>Supr</kbd> o <b>Eliminar seleccionadas</b>. ¿Te equivocaste? <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd>. Después, <b>Descargar</b>."
    body: |
      ## Eliminar páginas PDF sin perder calidad

      Eliminar páginas de un PDF no vuelve a codificar el resto del documento: las páginas que quedan se copian tal cual, con su texto, sus fuentes, sus imágenes, sus comentarios y sus enlaces web. No se comprime ni se convierte nada en imagen, así que el resultado es idéntico al original, sin las páginas que quitaste. Si solo quieres conservar unas pocas páginas, es más rápido [extraer páginas del PDF](/es/extraer-paginas-pdf/) a un archivo nuevo.

      ## Motivos habituales para eliminar páginas

      - Páginas en blanco que deja un escáner a doble cara.
      - Una portada, la cabecera de un fax o unas condiciones generales que no hace falta enviar.
      - Páginas con datos personales que no deberías compartir. Si solo se trata de una línea, mejor [censúrala](/es/censurar-pdf/) en lugar de eliminar la página entera.
      - Duplicados después de [unir varios PDF](/es/unir-pdf/).

      ## Privado desde el diseño

      Los servicios online para eliminar páginas suelen subir el documento completo para quitar una sola hoja. Aquí el PDF se queda en tu dispositivo: el motor de páginas funciona en tu navegador, por eso también funciona sin conexión una vez cargado.
    faq:
      - q: ¿Puedo eliminar varias páginas a la vez?
        a: "Sí. Haz clic en cada página que quieras quitar, o haz clic en una y Mayús+clic en otra para seleccionar todas las intermedias, y luego pulsa Supr."
      - q: ¿Puedo deshacer una eliminación?
        a: "Sí, mientras no hayas cerrado la página: pulsa Ctrl/Cmd+Z o el botón Deshacer, tantas veces como necesites."
      - q: ¿Eliminar páginas reduce el tamaño del archivo?
        a: "Normalmente sí, porque el contenido que solo usaban las páginas eliminadas se descarta al guardar el archivo."
      - q: ¿Hay un límite de páginas?
        a: "No hay un límite fijo. Los documentos grandes (varios cientos de páginas) dependen de la memoria de tu equipo."

  extract_pages:
    slug: extraer-paginas-pdf
    nav: Extraer páginas
    card: Guarda las páginas que elijas de un PDF en un archivo nuevo e independiente.
    title: "Extraer páginas PDF online: guárdalas en un archivo nuevo"
    description: "Extraer páginas de un PDF y guardarlas en un archivo nuevo, gratis y en tu navegador: sin subir nada, sin registro, sin marca de agua y con la calidad original."
    h1: 'Extraer páginas de un PDF a un <span class="hl">archivo nuevo</span>'
    h1_plain: Extraer páginas PDF
    lede: "Elige las páginas que necesitas, en el orden que quieras, y guárdalas en un PDF aparte. El archivo original no se toca."
    suffix: editado
    hint: "Selecciona las páginas que quieres conservar (Mayús+clic para un rango) y luego “Extraer seleccionadas”. Antes puedes cambiar su orden."
    stepsTitle: Cómo extraer páginas de un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo aquí. Cada página aparece en miniatura."
      - h: Selecciona las páginas
        p: "Haz clic en las páginas que quieres extraer. Mayús+clic selecciona un rango. Arrastra las miniaturas para cambiar su orden."
      - h: Extrae
        p: "Haz clic en <b>Extraer seleccionadas</b>: se descarga un PDF nuevo solo con esas páginas."
    body: |
      ## ¿Extraer o dividir?

      Extraer páginas de un PDF significa copiar algunas de ellas en un documento nuevo, mientras el original sigue completo. Es la forma más rápida de enviar solo la parte que importa de un archivo largo: un capítulo de un informe, la página de firmas de un contrato, las facturas de un solo mes dentro de un export anual. Si prefieres quedarte con todo salvo unas pocas hojas, puedes [eliminar páginas del PDF](/es/eliminar-paginas-pdf/) directamente.

      Puedes extraer varias veces del mismo archivo: selecciona un primer grupo, extrae, luego selecciona otro grupo y vuelve a extraer. Cada extracción descarga un PDF distinto.

      ## Combina páginas de varios PDF

      Haz clic en **Añadir PDF** para cargar más archivos. Sus páginas se suman a la cuadrícula, puedes mezclarlas y reordenarlas, y después extraer la selección o descargarlo todo como un único documento. Si solo quieres juntar documentos completos, la herramienta para [unir PDF](/es/unir-pdf/) va más directa.

      ## La misma calidad que el original

      Las páginas se copian tal cual, con texto real, fuentes, imágenes, comentarios y enlaces web. Nada se convierte en imagen, así que las páginas extraídas siguen nítidas y se puede buscar en ellas. Si alguna contiene datos que no deben salir, [censúralos en local](/es/censurar-pdf/) antes de enviarla. Si necesitas una página como imagen, extráela y luego [convierte el PDF a JPG](/es/pdf-a-jpg/).
    faq:
      - q: ¿Se modifica el PDF original?
        a: "No. La extracción crea un archivo nuevo; el original queda exactamente igual en tu equipo."
      - q: ¿Puedo extraer páginas en otro orden?
        a: "Sí. Arrastra las miniaturas al orden que quieras antes de extraer: el PDF nuevo sigue el orden de las páginas seleccionadas en la cuadrícula."
      - q: ¿Puedo extraer páginas de un PDF protegido con contraseña?
        a: "Si conoces la contraseña, sí: se te pide al abrir el archivo. El PDF extraído se guarda sin contraseña."
      - q: ¿Funciona en el móvil?
        a: "Sí. Toca las páginas para seleccionarlas y mantén pulsada una miniatura para moverla."

  rotate:
    slug: rotar-pdf
    nav: Rotar PDF
    card: Gira 90° una página o todo el documento y guárdalo en la posición correcta.
    title: "Rotar PDF online y guardarlo girado, gratis y privado"
    description: "Rotar PDF o girar una sola página 90° a la izquierda o a la derecha y guardarlo de forma permanente. Gratis, en tu navegador, sin subir nada ni registrarte."
    h1: 'Rotar páginas PDF y <span class="hl">guardarlas</span> así'
    h1_plain: Rotar PDF
    lede: "Arregla un escaneo que salió de lado o al revés. Rota páginas sueltas o el documento entero y descarga un PDF que se abre derecho en cualquier sitio."
    suffix: rotado
    hint: "Rota una página con las flechas de su miniatura, o selecciona páginas (ninguna = todas) y usa Izquierda / Derecha."
    stepsTitle: Cómo rotar un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página y verás todas las páginas en miniatura."
      - h: Rota
        p: "Usa ↺ o ↻ en una sola página, o selecciona varias (o ninguna, para todo el archivo) y haz clic en <b>Izquierda</b> o <b>Derecha</b>."
      - h: Descarga
        p: "La rotación queda guardada en el archivo: se abrirá bien en cualquier lector y en cualquier dispositivo."
    body: |
      ## Rotar PDF de forma permanente, no solo en pantalla

      El botón de girar de la mayoría de los lectores PDF solo cambia la vista. Cierras el archivo, lo envías, y vuelve a estar de lado. pdfanonym escribe la rotación en el propio PDF, así que cualquier lector muestra las páginas en la posición correcta. Si tus páginas son fotos hechas con el móvil, [convierte primero las imágenes JPG a PDF](/es/jpg-a-pdf/) y luego gira las que hayan quedado de lado.

      ## Girar solo algunas páginas

      Los documentos que mezclan vertical y horizontal son frecuentes: un informe con una tabla ancha, un escaneo en el que una hoja entró al revés. Gira esas páginas una a una con las flechas de su miniatura y deja las demás como están. Si además están en mal orden, usa la herramienta para [ordenar páginas de un PDF](/es/ordenar-paginas-pdf/).

      ## Sin pérdida de calidad

      La rotación es un ajuste de la página, no una transformación de imagen. El texto sigue siendo texto, no se recomprime nada y el tamaño del archivo apenas cambia. Todo ocurre en tu navegador, igual que el [censurado de PDF en local](/es/censurar-pdf/).
    faq:
      - q: ¿Cómo roto todas las páginas a la vez?
        a: "Asegúrate de que no haya ninguna página seleccionada y haz clic en Izquierda o Derecha: la rotación se aplica a todo el documento."
      - q: ¿Se guarda la rotación?
        a: "Sí. Se escribe en el PDF descargado, así que se abre derecho en cualquier lector."
      - q: ¿Puedo girar 180°?
        a: "Haz clic dos veces en la misma flecha."
      - q: ¿Rotar reduce la calidad?
        a: "No. Solo cambia el ajuste de orientación de la página; el texto y las imágenes no se vuelven a codificar."

  reorder:
    slug: ordenar-paginas-pdf
    nav: Ordenar páginas
    card: Arrastra y suelta las miniaturas para poner las páginas de un PDF en el orden correcto.
    title: "Ordenar páginas PDF online: arrastrar y soltar, gratis"
    description: "Ordenar páginas PDF arrastrando y soltando, combinar varios archivos y descargar el resultado. Gratis, en tu navegador, sin subir nada y sin registro."
    h1: 'Ordenar páginas PDF <span class="hl">arrastrando y soltando</span>'
    h1_plain: Ordenar páginas PDF
    lede: "Mueve las páginas hasta que el documento se lea en el orden correcto, añade páginas de otros PDF y descarga un archivo limpio. Nada sale de tu equipo."
    suffix: ordenado
    hint: "Arrastra una miniatura para moverla. En el móvil, mantén pulsado y luego arrastra."
    stepsTitle: Cómo ordenar las páginas de un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo aquí. Añade más archivos con <b>Añadir PDF</b> para combinarlos."
      - h: Arrastra las páginas a su sitio
        p: "Arrastra una miniatura y suéltala donde corresponde. Si hace falta, elimina o rota páginas por el camino."
      - h: Descarga
        p: "Haz clic en <b>Descargar</b> para guardar el PDF con el nuevo orden."
    body: |
      ## Ordenar páginas PDF en segundos

      ¿Escaneaste un documento desordenado? ¿Necesitas el resumen antes de los anexos, o la página firmada al final? Arrastra las miniaturas a su sitio: los números de página se actualizan sobre la marcha y Ctrl/Cmd+Z deshace cualquier movimiento. Si sobra alguna hoja, también puedes [eliminar páginas del PDF](/es/eliminar-paginas-pdf/), y una vez todo en su sitio, [numerar las páginas del PDF](/es/numerar-paginas-pdf/) para que la numeración siga el nuevo orden.

      ## Combina y ordena varios PDF

      Usa **Añadir PDF** para incorporar otros archivos. Todas las páginas aparecen en una sola cuadrícula, así que puedes intercalarlas, quitar las que no necesitas y descargar un único documento bien ordenado. Para juntar archivos completos sin tocar el orden, también puedes [unir PDF](/es/unir-pdf/) directamente.

      ## Qué se conserva

      Cada página se copia tal cual: texto, fuentes, imágenes, comentarios y enlaces web. El documento no se reconstruye como imágenes, así que sigue siendo ligero y se puede buscar en él. Para ocultar un dato antes de compartirlo, usa el [censurado de PDF en local](/es/censurar-pdf/).
    faq:
      - q: ¿Puedo mover varias páginas a la vez?
        a: "Muévelas una a una arrastrándolas; cada movimiento lleva un segundo y Ctrl/Cmd+Z revierte el último."
      - q: ¿Puedo unir PDF aquí?
        a: "Sí. Haz clic en “Añadir PDF” (o suelta varios archivos a la vez) para combinarlos, ordena las páginas y descarga un solo archivo."
      - q: ¿Los marcadores siguen el nuevo orden?
        a: "No. El archivo nuevo se construye página a página y no conserva los marcadores originales (el índice), ni los enlaces que llevan a otra página del documento. Los enlaces web de las páginas sí se conservan."
      - q: ¿Funciona en el móvil?
        a: "Sí. Mantén pulsada una miniatura y luego arrástrala a su nuevo sitio."

  grayscale:
    slug: pdf-blanco-y-negro
    nav: Blanco y negro
    card: Convierte un PDF en color a escala de grises con el texto nítido y seleccionable.
    title: "PDF a blanco y negro: convertir a escala de grises gratis"
    description: "Pasa un PDF a blanco y negro en tu navegador: el texto sigue siendo seleccionable, las imágenes pasan a escala de grises y no se sube nada. Gratis."
    h1: 'Convertir un PDF a <span class="hl">blanco y negro</span>'
    h1_plain: Convertir un PDF a blanco y negro
    lede: "Pasa tu PDF a blanco y negro para ahorrar tinta, cumplir los requisitos de una imprenta o preparar un documento para imprimir sin color. Cada color se convierte en un tono de la escala de grises y el texto sigue siendo texto real y seleccionable."
    suffix: bn
    reportCaption: Este PDF
    runLabel: Convertir a blanco y negro y descargar
    stepsTitle: Cómo convertir un PDF a blanco y negro
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. Se procesa en tu equipo."
      - h: Convierte
        p: "Haz clic en el botón. Texto, formas, imágenes, comentarios y la apariencia de los campos de formulario pasan a escala de grises."
      - h: Revisa y descarga
        p: "El nuevo archivo se descarga al instante y aparece una vista previa de su primera página para que compruebes el resultado."
    body: |
      ## PDF a blanco y negro sin convertir las páginas en imágenes

      Para pasar un PDF a blanco y negro, muchos conversores «imprimen» cada página como imagen y vuelven a meter esas imágenes en un PDF. Funciona, pero el texto deja de ser texto: no puedes seleccionarlo, buscarlo ni copiarlo, y el archivo suele pesar mucho más. pdfanonym reescribe los colores dentro del propio documento, en escala de grises. El texto se ve nítido con cualquier zoom, los enlaces siguen funcionando y el archivo suele pesar menos que el original, porque las fotos en color pasan a ser imágenes en escala de grises de un solo canal. Si necesitas reducirlo aún más, [comprime el PDF](/es/comprimir-pdf/) después de convertirlo.

      ## Qué se convierte

      | Elemento | Resultado |
      |---|---|
      | Texto y formas en color (RGB y CMYK) | Tonos de gris con el mismo brillo |
      | Fotos e ilustraciones | Imágenes en escala de grises |
      | Comentarios, sellos, apariencia de los campos de formulario | Escala de grises |
      | Texto | Sigue siendo texto real y seleccionable |

      El brillo se conserva con la fórmula estándar de luminancia: los colores claros siguen siendo claros y los oscuros, oscuros. Un título rojo no se convierte en un bloque negro.

      ## Límites

      Algunos elementos poco habituales se dejan como están y se indican después de la conversión: los degradados suaves (sombreados), los colores directos que se usan en archivos de impresión profesional y las imágenes diminutas incrustadas directamente en el código de la página. La vista previa muestra el resultado para que lo revises antes de imprimir. La conversión se aplica a todo el documento: para convertir solo algunas páginas, [extrae primero las páginas del PDF](/es/extraer-paginas-pdf/) que necesitas.

      ## ¿Blanco y negro o escala de grises?

      Lo que casi todo el mundo llama «blanco y negro» es en realidad escala de grises: 256 tonos entre el negro y el blanco, lo que mantiene las fotos legibles. Eso es lo que genera esta herramienta. Después, la impresora reproduce los grises solo con tinta negra.
    faq:
      - q: ¿El texto seguirá siendo seleccionable?
        a: "Sí. El texto no se convierte en imagen: puedes seleccionarlo, buscarlo y copiarlo igual que antes."
      - q: ¿Reduce el tamaño del archivo?
        a: "A menudo sí, porque las imágenes en color se guardan con un canal en lugar de tres. Los archivos que solo contienen texto apenas cambian."
      - q: ¿Puedo convertir solo algunas páginas?
        a: "No con esta herramienta. Usa primero <a href=\"/es/extraer-paginas-pdf/\">Extraer páginas</a> para quedarte con las páginas que necesitas y luego convierte ese archivo."
      - q: ¿Por qué algo sigue en color?
        a: "Los degradados suaves y los colores directos profesionales no se convierten. Son raros en documentos de oficina; el informe que aparece después de la conversión te indica si tu archivo los contiene."

  anonymize:
    slug: anonimizar-pdf
    nav: Anonimizar PDF
    card: Detecta correos, teléfonos, IBAN y nombres automáticamente y censúralos con un clic.
    title: "Anonimizar PDF: censura automática de datos personales"
    description: "Anonimizar PDF: encuentra correos, teléfonos, IBAN, tarjetas y nombres automáticamente y censúralos para siempre. Apto para el RGPD, sin salir del navegador."
    h1: 'Anonimizar un PDF: datos personales <span class="redacted">localizados</span> por ti'
    h1_plain: Anonimizar PDF
    lede: "Abre tu documento para anonimizar el PDF: pdfanonym analiza cada página en busca de correos, teléfonos, datos bancarios, números de tarjeta y nombres, y te deja censurarlos todos de una vez. No se sube nada."
    black: true
    suffix: anonimizado
    stepsTitle: Cómo anonimizar un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. El análisis empieza solo, en tu equipo."
      - h: Revisa lo que se encontró
        p: "Los datos personales se agrupan por tipo, con ejemplos. Desmarca lo que deba quedarse y haz clic en <b>Marcar seleccionados</b>. Añade cualquier otra cosa a mano o con el buscador."
      - h: Censura y descarga
        p: "Pulsa <kbd>Supr</kbd> o <b>Aplicar</b>: el texto se borra del archivo. Los metadatos ocultos también se eliminan."
    body: |
      ## Qué detecta el análisis

      | Dato | Cómo se comprueba |
      |---|---|
      | Direcciones de correo electrónico | Formato estándar de dirección |
      | Números de teléfono | Formatos internacionales (+33, +49…) y nacionales |
      | IBAN | Dígitos de control oficiales (mod 97): los números no válidos se ignoran |
      | Números de tarjeta bancaria | Algoritmo de Luhn; se excluyen los números de empresa como el SIRET |
      | Números de seguridad social franceses | Clave de control verificada |
      | Direcciones IP | Solo rangos válidos |
      | Nombres tras un tratamiento | Mr, Mrs, Dr, Monsieur, Madame, Herr, Frau, Sr., Sra., Sig.… |
      | Fechas | Se detectan pero quedan desmarcadas, porque los documentos están llenos de fechas que no son personales |

      Los dígitos de control importan: reducen los falsos positivos, así que puedes fiarte de la lista en lugar de revisar cientos de números al azar. Si tienes decenas de archivos, puedes [anonimizar PDF por lotes](/es/anonimizar-pdf-por-lotes/) con las mismas reglas.

      ## Lo que no puede adivinar

      Un nombre escrito sin tratamiento («Jean Dupont firmó…») parece una palabra cualquiera, así que no se detecta automáticamente. Escríbelo en el buscador y pulsa **Marcar todo**: se encuentran todas sus apariciones, en mayúsculas o no, con o sin acentos. Tampoco se detectan las direcciones postales ni la información manuscrita: márcalas a mano con la herramienta para [censurar un PDF](/es/censurar-pdf/). Lee siempre el documento una vez antes de compartirlo; nuestra guía sobre [cómo censurar un PDF correctamente](/es/como-censurar-un-pdf/) detalla las comprobaciones.

      ## Por qué importa anonimizar en local

      Enviar un archivo lleno de datos personales a un servicio online para quitarle esos datos personales es una contradicción: según el RGPD, supone recurrir a otro encargado del tratamiento. pdfanonym funciona por completo en tu navegador, así que los datos nunca salen de tu dispositivo.
    faq:
      - q: "¿Los datos detectados se eliminan de verdad?"
        a: "Sí, en cuanto aplicas la censura. Los caracteres se borran del archivo, no se ocultan bajo un recuadro, y los metadatos del documento (autor, título…) también se limpian."
      - q: "¿Funciona con PDF escaneados?"
        a: "No: un escaneo contiene imágenes, no texto, así que no hay nada que analizar. Usa el modo Zona para tachar los pasajes a mano."
      - q: "¿Qué idiomas y países abarca?"
        a: "Los correos, los teléfonos internacionales, los IBAN, las tarjetas y las direcciones IP funcionan para cualquier país. Los tratamientos se reconocen en inglés, francés, alemán, español, italiano y portugués. Los números de seguridad social se comprueban con el formato francés."
      - q: "¿Puedo conservar algunos de los datos detectados?"
        a: "Sí. Desmarca una categoría antes de marcar, o quita marcas sueltas de la lista de la derecha."

  merge:
    slug: unir-pdf
    nav: Unir PDF
    card: Combina varios PDF en un solo archivo, en el orden que elijas.
    title: "Unir PDF online gratis y privado (sin subir archivos)"
    description: "Unir PDF en tu navegador: suelta varios archivos, reordena las páginas arrastrando y descarga un único documento. Gratis, sin subir nada y sin cuenta."
    h1: 'Unir PDF <span class="hl">sin subir los archivos</span>'
    h1_plain: Unir PDF
    lede: "Para unir PDF, suelta varios archivos a la vez, coloca las páginas en el orden correcto y descarga un único documento. Tus archivos se combinan en tu propio equipo."
    suffix: unido
    hint: "Suelta varios archivos a la vez o usa “Añadir PDF”. Arrastra las miniaturas para cambiar el orden."
    stepsTitle: Cómo unir archivos PDF
    steps:
      - h: Suelta tus PDF
        p: "Selecciona varios archivos a la vez o añádelos uno a uno con <b>Añadir PDF</b>."
      - h: Ordena las páginas
        p: "Cada página aparece en miniatura. Arrastra para reordenar y, si hace falta, rota o elimina páginas."
      - h: Descarga
        p: "Haz clic en <b>Descargar</b> para obtener un único PDF."
    body: |
      ## Unir y ordenar de una vez

      Unir PDF rara vez consiste solo en pegar archivos uno detrás de otro. Aquí todas las páginas de todos los archivos aparecen en una sola cuadrícula, así que puedes poner la página firmada donde corresponde, quitar una página en blanco o girar un escaneo torcido antes de descargar. Para reorganizar un solo documento sin añadir otros, usa la herramienta para [ordenar páginas de un PDF](/es/ordenar-paginas-pdf/). Cuando el dossier esté listo, puedes [numerar las páginas del PDF](/es/numerar-paginas-pdf/) para que la numeración recorra todo el conjunto.

      ## Calidad y enlaces

      Las páginas se copian tal cual: el texto sigue siendo texto, las imágenes conservan su resolución y se mantienen los comentarios y los enlaces web. Los recursos que comparten varias páginas de un mismo archivo se guardan una sola vez, así que el resultado sigue siendo ligero. Si aun así pesa demasiado para un correo, [comprime el PDF](/es/comprimir-pdf/) unido.

      ## Privado por diseño

      Unir contratos, nóminas o informes médicos en un sitio que obliga a subirlos supone enviarlos todos a un servidor. Aquí nunca salen de tu dispositivo.
    faq:
      - q: "¿Cuántos archivos puedo unir?"
        a: "No hay un límite fijo. Los conjuntos muy grandes dependen de la memoria de tu equipo."
      - q: "¿Puedo unir PDF protegidos con contraseña?"
        a: "Sí, si conoces sus contraseñas: se te pide cada una al añadir el archivo. El archivo unido no tiene contraseña; si hace falta, añádele una con la herramienta Proteger PDF."
      - q: "¿Se conservan los marcadores?"
        a: "No. El archivo unido no conserva los marcadores originales (el índice) ni los enlaces que llevan a otra página. Los enlaces web sí se conservan."

  add_text:
    slug: anadir-texto-pdf
    nav: Añadir texto
    card: Escribe en cualquier punto de una página PDF, como en un formulario sin campos.
    title: "Añadir texto a PDF online: escribe donde quieras, gratis"
    description: "Añadir texto a PDF en tu navegador: haz clic donde quieras, escribe, elige tamaño y color, y descarga. Texto real, sin subir nada, sin cuenta ni marca de agua."
    h1: 'Añadir texto a un PDF, <span class="hl">en cualquier punto de la página</span>'
    h1_plain: Añadir texto a PDF
    lede: "Añadir texto a PDF te sirve para rellenar un formulario sin campos, poner una fecha o una nota, o completar un documento antes de imprimirlo. Haz clic, escribe, descarga."
    suffix: editado
    hint: "Haz clic en una página para escribir. Arrastra un texto para moverlo, haz clic en él para editarlo, Supr para borrarlo."
    stepsTitle: Cómo añadir texto a un PDF
    steps:
      - h: Abre tu PDF
        p: "Suéltalo en la página. Se abre en tu equipo."
      - h: Haz clic y escribe
        p: "Haz clic donde debe ir el texto y escribe. Elige el tamaño y el color en la barra de herramientas; arrastra un texto para moverlo."
      - h: Descarga
        p: "El texto se escribe en el PDF como texto real y seleccionable."
    body: |
      ## Texto real, no una imagen

      Lo que escribes se añade a la página como texto de verdad, en una fuente estándar (Helvetica). Se ve nítido con cualquier zoom, se puede seleccionar y buscar, y se imprime exactamente como aparece en pantalla. Para sustituir un texto que ya está, [edita el texto del PDF](/es/editar-texto-pdf/) directamente: haz clic en la palabra y escribe la nueva.

      ## Usos habituales

      - Rellenar un formulario «plano», que tiene casillas en la página pero ningún campo rellenable. Si el formulario sí tiene campos, rellénalos en tu lector y luego [aplana el PDF](/es/aplanar-pdf/) para fijar las respuestas.
      - Añadir una fecha, una referencia o «Leído y conforme» antes de firmar.
      - Escribir una nota en un plano o en un documento antes de devolverlo.

      Para añadir también una firma manuscrita, cambia a **Firma** en la barra de herramientas o usa [Firmar PDF](/es/firmar-pdf/).

      ## Caracteres

      El texto se escribe en Helvetica, que cubre el alfabeto latino con los acentos de Europa occidental (é, ü, ñ, ç, ß…). Los caracteres que quedan fuera de ese conjunto, como el cirílico o el chino, se sustituyen por un signo de interrogación.
    faq:
      - q: "¿Puedo editar el texto que ya estaba en el PDF?"
        a: "No con esta herramienta: añade texto nuevo. Para cambiar una palabra que ya está, usa Editar texto: haz clic en la palabra y escribe la nueva."
      - q: "¿Puedo escribir varias líneas?"
        a: "Sí. Pulsa Enter mientras escribes para empezar una línea nueva."
      - q: "¿El texto añadido se puede editar después?"
        a: "No en pdfanonym una vez descargado: pasa a formar parte de la página. Conserva el original si crees que tendrás que hacer cambios."

