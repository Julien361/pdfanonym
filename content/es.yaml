    body: |
      ## Licencia

      El sitio se distribuye bajo la **GNU Affero General Public License, versión 3** (AGPL-3.0). Se basa en [MuPDF](https://mupdf.com), de Artifex Software, usado bajo la misma licencia y compilado a WebAssembly.

      ## Descarga

      - [Código fuente completo de este sitio (zip)](/source/pdfanonym-source.zip): plantillas, textos, scripts, estilos y script de compilación.
      - GitHub : [github.com/Julien361/pdfanonym](https://github.com/Julien361/pdfanonym)
      - El motor PDF es el paquete oficial [mupdf.js](https://www.npmjs.com/package/mupdf), incluido sin modificar en el archivo comprimido (carpeta `src/assets/mupdf`). Artifex publica su propio código fuente en [github.com/ArtifexSoftware/mupdf.js](https://github.com/ArtifexSoftware/mupdf.js).

      ## Ejecútalo tú mismo

      Descomprime el archivo y sirve la carpeta `src` con cualquier servidor web estático, o ejecuta `python3 build.py` para regenerar las páginas. Sin base de datos, sin backend.

