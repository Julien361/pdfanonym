    title: "Condizioni d'uso · pdfanonym"
    description: "Condizioni d'uso di pdfanonym.com: strumenti gratuiti forniti così come sono, elaborazione locale, le tue responsabilità, uso lecito e limitazione di responsabilità."
    h1: Condizioni d'uso
    lede: "Ultimo aggiornamento: 9 ottobre 2026. Utilizzando pdfanonym.com, accetti queste condizioni."
    body: |
      ## 1. Il servizio

      pdfanonym.com, pubblicato da METIS (vedi le [note legali](/it/note-legali/)), offre strumenti online gratuiti per elaborare file PDF: oscuramento, anonimizzazione, cancellazione di testo, pulizia dei metadati, modifica delle pagine, conversione, compressione, firma e protezione con password. Non è richiesto alcun account.

      ## 2. Elaborazione sul tuo dispositivo

      I file vengono elaborati nel tuo browser web, sul tuo dispositivo. Non vengono inviati ai nostri server e non abbiamo alcun accesso a essi. Resti l'unico titolare dei tuoi documenti e del loro contenuto. La [pagina sulla privacy](/it/privacy/) lo spiega in dettaglio.

      ## 3. Fornitura così com'è

      Gli strumenti sono forniti gratuitamente e così come sono, senza alcuna garanzia di risultato, disponibilità o idoneità a uno scopo particolare. Possono essere modificati, interrotti o rimossi in qualsiasi momento.

      ## 4. Controlla il risultato prima di condividerlo

      Sei responsabile di controllare ogni documento prima di utilizzarlo o condividerlo. In particolare:

      - **Il rilevamento automatico dei dati personali non è esaustivo.** Nomi scritti senza titolo, indirizzi postali, testo scritto a mano, pagine scansionate e formati non comuni potrebbero non essere rilevati. Leggi il documento e completa tu stesso l'oscuramento.
      - **L'oscuramento si applica solo a ciò che contrassegni.** Le informazioni possono comparire anche in immagini, allegati, commenti o altre copie del file. La nostra [guida](/it/come-oscurare-un-pdf/) elenca i controlli da effettuare.
      - **Conserva i tuoi file originali.** Le modifiche apportate dagli strumenti, come oscuramento, appiattimento o cifratura, sono permanenti per scelta progettuale.

      ## 5. Uso lecito

      Ti impegni a utilizzare gli strumenti solo per documenti di cui sei titolare o che sei autorizzato a modificare, e nel rispetto della legge. In particolare, non devi utilizzare lo strumento di sblocco per rimuovere le protezioni da documenti che non hai il diritto di modificare, né utilizzare alcuno strumento per violare i diritti altrui, compresi il diritto d'autore e la riservatezza.

      ## 6. Firma elettronica

      Una firma tracciata con lo strumento di firma è una firma elettronica semplice ai sensi del regolamento europeo eIDAS. Non sostituisce una firma elettronica avanzata o qualificata laddove questa sia richiesta.

      ## 7. Responsabilità

      Nei limiti consentiti dalla legge, METIS non sarà responsabile di alcun danno derivante dall'uso degli strumenti o dall'impossibilità di utilizzarli, compresa la divulgazione di informazioni non oscurate, la perdita o l'alterazione di file, o una decisione presa sulla base di un documento elaborato. Nulla in queste condizioni limita la responsabilità che non può essere limitata ai sensi della legge applicabile, né i diritti di cui godono i consumatori in base alle norme imperative del loro paese di residenza.

      ## 8. Software open source

      Il codice sorgente del sito è pubblicato sotto la GNU Affero General Public License v3 (vedi [Codice sorgente](/it/codice-sorgente/)). Tale licenza disciplina i tuoi diritti sul codice. Il nome e il logo di pdfanonym non sono coperti da essa.

      ## 9. Formule a pagamento (solo professionisti)

      Le formule a pagamento (pass 24 ore, Pro, Team) sono vendute da METIS **esclusivamente a clienti professionisti**: società, lavoratori autonomi ed enti pubblici che acquistano per scopi legati alla propria attività imprenditoriale, commerciale o professionale. Non sono offerte ai consumatori. Effettuando un ordine, confermi di agire in qualità di professionista.

      - **I prezzi** sono indicati nella [pagina dei prezzi](/it/prezzi/) IVA esclusa. L'IVA viene aggiunta secondo le regole applicabili nel tuo paese; le aziende dell'UE con una partita IVA valida ricevono la fattura in regime di inversione contabile (reverse charge). Il pagamento è gestito da Stripe.
      - **L'accesso** inizia subito dopo il pagamento.
      - **Gli abbonamenti** (Pro, Team) si rinnovano automaticamente per lo stesso periodo fino alla disdetta. Puoi disdire in qualsiasi momento dalla tua pagina account; la disdetta ha effetto alla fine del periodo già pagato, che non viene rimborsato.
      - **Il pass 24 ore** dà accesso alle funzioni Pro per 24 ore dal pagamento e non si rinnova.
      - **Le licenze** sono personali per Pro e per utente per Team. La chiave di licenza è salvata nel tuo browser; conservane una copia per usarla su un altro dispositivo.
      - **Domande e reclami**: contact@pdfanonym.com.

      ## 10. Modifiche e legge applicabile

      Queste condizioni possono essere aggiornate; la data in cima alla pagina indica l'ultima versione. Sono regolate dalla legge francese. Contatto: contact@pdfanonym.com.

