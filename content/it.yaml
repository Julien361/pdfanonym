  guide:
    slug: come-oscurare-un-pdf
    nav: Come oscurare un PDF
    title: "Come oscurare un PDF davvero (e controllare il risultato)"
    description: "Guida pratica per oscurare un PDF: perché i riquadri neri non bastano, come farlo gratis, come gestire scansioni e metadati, e cinque verifiche finali."
    h1: Come oscurare un PDF nel modo giusto
    lede: "Oscurare un PDF richiede un minuto. Oscurarlo male richiede lo stesso minuto, e l'errore viene fuori solo quando qualcun altro trova il testo. Ecco come farlo bene."
    cta_tool: redact
    cta: Apri lo strumento gratuito per oscurare PDF
    body: |
      ## La risposta breve

      Usa uno strumento che **rimuove** il testo, non uno che lo copre. Apri il PDF nello [strumento di oscuramento di pdfanonym](/it/oscurare-pdf/), seleziona ciò che deve sparire (o cercalo), premi **Applica**, scarica, poi controlla il risultato provando a copiare e a cercare le parole oscurate. Se non salta fuori niente, l'oscuramento ha funzionato.

      Il resto della guida spiega perché questo controllo è così importante e come gestire i casi in cui si sbaglia più spesso.

      ## Perché i rettangoli neri non funzionano

      Una pagina PDF è fatta di istruzioni: "scrivi questi caratteri qui", "disegna questa forma là". Quando disegni un rettangolo nero sopra un nome, aggiungi un'istruzione in più, sopra le altre. L'istruzione che scrive il nome è ancora nel file.

      Sullo schermo e sulla carta il risultato sembra perfetto. Ma se selezioni l'area e la copi, il nome finisce negli appunti. Se cerchi nel documento, il lettore ci salta dritto. Gli strumenti di estrazione del testo, i motori di ricerca e gli assistenti di intelligenza artificiale leggono le parole nascoste con la stessa facilità di quelle visibili.

      Non è un rischio teorico. Nel 2019, negli Stati Uniti, un atto depositato in tribunale dagli avvocati di Paul Manafort conteneva passaggi "oscurati" che i giornalisti hanno recuperato semplicemente copiandoli e incollandoli. Errori simili hanno esposto manuali di sicurezza, contratti e dati personali in molti paesi.

      ## Passo per passo: oscurare un PDF con testo

      1. **Conserva l'originale.** L'oscuramento è definitivo, ed è fatto apposta. Lavora su una copia.
      2. **Apri il file** in un vero strumento di oscuramento. Con pdfanonym, trascinalo sulla [pagina di oscuramento](/it/oscurare-pdf/); si apre in locale.
      3. **Trova tutte le occorrenze.** Scrivi un nome, un riferimento o un numero nella casella di ricerca e premi *Segna tutto*. La ricerca ignora maiuscole e accenti, quindi "Müller" trova anche "MULLER". Ripeti per ogni informazione. Per email, telefoni e IBAN puoi anche [anonimizzare il PDF](/it/anonimizzare-pdf/) con il rilevamento automatico.
      4. **Segna il resto a mano.** Trascina sui passaggi, fai clic sulle singole parole, doppio clic su una riga per prenderla tutta.
      5. **Applica.** Il testo sotto ogni segno viene cancellato e sostituito da un riquadro nero (o da uno spazio bianco, se preferisci).
      6. **Rimuovi anche i metadati.** Lascia l'opzione spuntata: i campi autore, titolo e software contengono spesso proprio i nomi che hai appena oscurato. Lo stesso lavoro si fa anche da solo, per [rimuovere i metadati di un PDF](/it/rimuovere-metadati-pdf/) senza oscurare nulla.
      7. **Scarica e controlla** (vedi sotto).

      ## Oscurare un PDF scansionato

      Una scansione è una foto della pagina. Non c'è testo da cancellare, solo pixel. Due conseguenze:

      - Cercare un nome non trova niente, quindi devi individuare ogni occorrenza a occhio.
      - L'oscuramento deve modificare l'immagine stessa. In pdfanonym passa alla modalità **Area**, spunta **immagini** nelle opzioni e disegna un rettangolo su ogni passaggio: i pixel all'interno vengono sbiancati nell'immagine.

      Alcune scansioni hanno anche un livello di testo OCR invisibile, aggiunto dallo scanner per rendere il documento ricercabile. In quel caso va eliminato anche il livello di testo nascosto. La modalità Area rimuove sia il testo sia l'immagine sotto il rettangolo.

      ## Cinque controlli prima di inviare

      1. **Prova della copia.** Seleziona l'area oscurata, copia, incolla in un editor di testo semplice. Non deve comparire nulla.
      2. **Prova della ricerca.** Cerca nel PDF ogni parola oscurata. Zero risultati.
      3. **Prova delle proprietà.** Nel lettore apri File, poi Proprietà. Autore, titolo e oggetto non devono rivelare nulla.
      4. **Prova dei commenti.** Apri il pannello dei commenti: le note di revisione possono citare proprio il passaggio che hai rimosso. Per sicurezza, [appiattisci il PDF](/it/appiattire-pdf/) prima di oscurarlo, così commenti e campi modulo diventano parte della pagina.
      5. **Prova degli allegati.** Cerca l'icona della graffetta o un pannello allegati. Un file incorporato può contenere l'originale non oscurato.

      ## Oscuramento e GDPR

      Con il GDPR, quando consegni un documento in risposta a una richiesta di accesso, i dati che riguardano altre persone in genere vanno rimossi, oppure la loro comunicazione va giustificata. Oscurarli è il modo abituale per farlo. Se lo fai con un servizio che richiede l'upload, invii i dati di quelle persone a un ulteriore responsabile del trattamento, di cui poi dovresti rendere conto. Uno strumento che lavora in locale toglie di mezzo la questione. Se le richieste sono numerose, puoi [anonimizzare i PDF in blocco](/it/anonimizzare-pdf-in-blocco/) invece di trattarli uno alla volta.
    faq:
      - q: "Si può recuperare il testo di un PDF oscurato?"
        a: "Se il testo è stato davvero rimosso, no: non resta niente da recuperare. Se era solo coperto da una forma, sì, spesso con un semplice copia e incolla. Ecco perché la prova della copia è importante."
      - q: "Adobe Acrobat Reader permette di oscurare gratis?"
        a: "Il Reader gratuito non include il vero oscuramento, che è riservato alle versioni a pagamento di Acrobat. Disegnare un rettangolo con gli strumenti di commento non oscura niente."
      - q: "E se voglio oscurare dal telefono?"
        a: "pdfanonym funziona nei browser mobili: apri la pagina di oscuramento, scegli il PDF dai tuoi file e segna il testo con il dito. Per i documenti lunghi il computer resta più comodo."

  privacy:
    slug: privacy
    nav: Privacy
    title: "Privacy: i tuoi file restano sul dispositivo · pdfanonym"
    description: "pdfanonym elabora i PDF nel tuo browser. Non riceviamo, non conserviamo e non vediamo i tuoi file, e non usiamo né cookie né tracker."
    h1: Privacy
    lede: "In breve: non vediamo mai i tuoi file e non ti tracciamo."
    body: |
      ## I tuoi documenti

      I PDF che apri su pdfanonym vengono elaborati **dentro il tuo browser**, sul tuo dispositivo, da un motore PDF che si scarica insieme alla pagina. Non vengono caricati sui nostri server né su quelli di altri. Non ne abbiamo copia, non abbiamo modo di leggerli e non c'è niente da cancellare.

      Puoi verificarlo tu stesso: apri gli strumenti per sviluppatori del browser, seleziona la scheda Rete ed elabora un file. Nessuna richiesta trasporta il tuo documento. Il sito invia inoltre un'intestazione Content-Security-Policy che impedisce alla pagina di connettersi a qualsiasi altro dominio.

      ## Cookie e tracciamento

      pdfanonym non imposta **nessun cookie**, non usa **script di analisi o pubblicitari** e non carica **risorse di terze parti** (font e script arrivano dal nostro dominio). Il tuo browser può salvare in locale qualche piccola preferenza, che non lascia mai il tuo dispositivo.

      ## Acquisti

      Se acquisti una formula Pro, il pagamento è gestito da Stripe, che tratta la tua carta, la tua email e i tuoi dati di fatturazione secondo la propria informativa sulla privacy; non vediamo mai il numero della tua carta. Il nostro servizio di licenze riceve solo l'identificativo della tua sessione di pagamento Stripe e restituisce una chiave di licenza firmata, che viene salvata nel tuo browser. I dati di fatturazione (nome, email, indirizzo, partita IVA, fatture) sono conservati da Stripe e da METIS per il tempo richiesto dalla normativa contabile. I tuoi file PDF non sono mai coinvolti.

      ## Log del server

      Come per qualsiasi sito web, il nostro hosting (Cloudflare) tratta i dati tecnici necessari a servire le pagine, come il tuo indirizzo IP e il tipo di browser, e può conservare log di breve durata per motivi di sicurezza. Questi log non contengono mai i tuoi documenti.

      ## Contatti

      Domande sulla privacy: contact@pdfanonym.com.

  terms:
