  guide:
    slug: how-to-redact-a-pdf
    nav: How to redact a PDF
    title: "How to redact a PDF properly (and check that it worked)"
    description: "A practical guide to redacting PDFs: why black boxes fail, how to redact for free, how to handle scans and metadata, and five checks before you send."
    h1: How to redact a PDF properly
    lede: "Redacting a PDF takes a minute. Redacting it badly takes the same minute, and the mistake only shows when someone else finds the text. Here is how to do it right."
    cta_tool: redact
    cta: Open the free redaction tool
    body: |
      ## The short answer

      Use a tool that **removes** the text, not one that covers it. Open your PDF in [pdfanonym's redaction tool](/redact-pdf/), select what must go (or search for it), press **Apply**, download, then check the result by trying to copy and search the redacted words. If nothing comes back, the redaction worked.

      The rest of this guide explains why that check matters and how to deal with the cases that trip people up.

      ## Why black rectangles fail

      A PDF page is built from instructions: "write these characters here", "draw this shape there". When you draw a black rectangle over a name, you add one more instruction on top. The instruction that writes the name is still in the file.

      The result looks perfect on screen and on paper. But select the area and copy it, and the name lands in your clipboard. Search the document, and the reader jumps straight to it. Text extraction tools, search engines and AI assistants read the hidden words as easily as the visible ones.

      This is not a theoretical risk. In 2019, a court filing by Paul Manafort's lawyers in the United States contained "redacted" passages that journalists recovered simply by copying and pasting them. Similar slips have exposed security manuals, contracts and personal data in many countries.

      ## Step by step: redacting a text PDF

      1. **Keep the original.** Redaction is permanent by design. Work on a copy.
      2. **Open the file** in a real redaction tool. With pdfanonym, drop it on [the redaction page](/redact-pdf/); it opens locally. pdfanonym merges form fields automatically; with other tools, [flatten the PDF](/flatten-pdf/) first so typed answers become part of the page.
      3. **Find every occurrence.** Type a name, a reference or a number in the search box and press *Mark all*. Searches ignore capitals and accents, so "Müller" also finds "MULLER". Repeat for each piece of information. To have emails, phone numbers and IBANs found for you, [anonymize the PDF](/anonymize-pdf/) instead.
      4. **Mark the rest by hand.** Drag across passages, click single words, double-click a line to take all of it.
      5. **Apply.** The text under each mark is deleted and replaced by a black box (or white space if you prefer).
      6. **Remove the metadata too.** Leave the option ticked: the author, title and software fields often contain exactly the names you just redacted. You can also [remove PDF metadata](/remove-pdf-metadata/) on its own and see every field.
      7. **Download and check** (see below).

      ## Redacting a scanned PDF

      A scan is a photo of a page. There is no text to delete, only pixels. Two consequences:

      - Searching for a name finds nothing, so you have to locate each occurrence by eye.
      - The redaction must change the image itself. In pdfanonym, switch to **Area** mode, tick **images** in the options and draw a rectangle over each passage: the pixels inside are blanked out of the image.

      Some scans also carry an invisible OCR text layer, added by the scanner so the document can be searched. In that case the hidden text layer must go too. Area mode removes both the text and the image under the rectangle.

      ## Five checks before you send

      1. **Copy test.** Select the redacted area, copy, paste into a plain text editor. Nothing should appear.
      2. **Search test.** Search the PDF for each redacted word. Zero results.
      3. **Properties test.** In your reader, open File, then Properties. The author, title and subject should not reveal anything.
      4. **Comments test.** Open the comments panel: review notes can quote the very passage you removed.
      5. **Attachments test.** Look for a paperclip icon or an attachments panel. An embedded file can hold the unredacted original.

      ## Redaction and GDPR

      Under the GDPR, when you disclose a document in response to an access request, data about other people generally has to be removed or the disclosure has to be justified. Redaction is the usual way to do it. Doing it with an upload-based service means sending those people's data to yet another processor, which you would then have to account for. A tool that works locally avoids the question entirely. When many documents are involved, you can [batch anonymize PDF files](/batch-anonymize-pdf/) in one pass.
    faq:
      - q: Can a redacted PDF be un-redacted?
        a: "If the text was truly removed, no: there is nothing left to recover. If it was only covered by a shape, yes, often with a simple copy and paste. That is why the copy test matters."
      - q: Does Adobe Acrobat Reader redact for free?
        a: "The free Reader does not include true redaction; it is reserved for the paid versions of Acrobat. Drawing a rectangle with the comment tools does not redact anything."
      - q: What about redacting on a phone?
        a: "pdfanonym works in mobile browsers: open the redaction page, pick the PDF from your files and mark text with your finger. A computer is more comfortable for long documents."

  privacy:
    slug: privacy
    nav: Privacy
    title: "Privacy: your files never leave your device · pdfanonym"
    description: "pdfanonym processes PDFs in your browser. We do not receive, store or see your files, and we do not use cookies or trackers."
    h1: Privacy
    lede: "Short version: we never see your files, and we do not track you."
    body: |
      ## Your documents

      PDFs you open on pdfanonym are processed **inside your browser**, on your own device, by a PDF engine that is downloaded with the page. They are not uploaded to our servers or to anyone else's. We have no copy of them, no way to read them and nothing to delete.

      You can verify this: open your browser's developer tools, select the Network tab and process a file. No request carries your document. The site also sends a Content-Security-Policy header that prevents the page from connecting to any other domain.

      ## Cookies and tracking

      pdfanonym sets **no cookies**, uses **no analytics or advertising scripts**, and loads **no third-party resources** (fonts and scripts are served from our own domain). Your browser may store small preferences locally; they never leave your device.

      ## Purchases

      If you buy a Pro plan, payment is handled by Stripe, which processes your card, email and billing details under its own privacy policy; we never see your card number. Our licence service only receives the identifier of your Stripe checkout session and returns a signed licence key, which is stored in your browser. Billing records (name, email, address, VAT number, invoices) are kept by Stripe and METIS for as long as accounting law requires. Your PDF files are never involved.

      ## Server logs

      Like any website, our host (Cloudflare) processes technical data needed to deliver the pages, such as your IP address and browser type, and may keep short-lived logs for security. These logs never include your documents.

      ## Contact

      Questions about privacy: contact@pdfanonym.com.

