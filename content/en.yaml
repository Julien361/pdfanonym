      ## 2. Processing on your device

      Files are processed in your web browser, on your own device. They are not sent to our servers, and we have no access to them. You remain the only holder of your documents and of their content. The [privacy page](/privacy/) explains this in detail.

      ## 3. Provided as is

      The free tools are provided as is (paid plans are covered by section 9), without any guarantee of results, availability or fitness for a particular purpose. They may change, be interrupted or be removed at any time.

      ## 4. Check the result before you share it

      You are responsible for checking every document before using or sharing it. In particular:

      - **Automatic detection of personal data is not exhaustive.** Names written without a title, postal addresses, handwritten text, scanned pages and uncommon formats may not be detected. Read the document and complete the redaction yourself.
      - **Redaction only applies to what you mark.** Information can also appear in images, attachments, comments or other copies of the file. Our [guide](/how-to-redact-a-pdf/) lists the checks to perform.
      - **Keep your original files.** Changes made by the tools, such as redaction, flattening or encryption, are permanent by design.

      ## 5. Lawful use

      You agree to use the tools only for documents you own or are authorised to modify, and in compliance with the law. In particular, you must not use the unlock tool to remove protections from documents you have no right to modify, nor use any tool to infringe the rights of others, including copyright and privacy.

      ## 6. Electronic signature

      A signature drawn with the signing tool is a simple electronic signature within the meaning of the European eIDAS regulation. It does not replace an advanced or qualified electronic signature where one is required.

      ## 7. Liability

      To the extent permitted by law, METIS shall not be liable for any damage resulting from the use of the tools or the inability to use them, including the disclosure of information that was not redacted, the loss or alteration of files, or a decision taken on the basis of a processed document. Nothing in these terms limits liability that cannot be limited under applicable law, nor the rights consumers enjoy under the mandatory law of their country of residence.

      ## 8. Open source software

      The source code of the site is published under the GNU Affero General Public License v3 (see [Source code](/source-code/)). That license governs your rights over the code. The pdfanonym name and logo are not covered by it.

      ## 9. Paid plans (professionals only)

      Paid plans (24-hour pass, Pro, Team) are sold by METIS **exclusively to professional customers**: companies, self-employed people and public bodies buying for the purposes of their trade, business or profession. They are not offered to consumers. By ordering, you confirm that you act in a professional capacity.

      - **Prices** are shown on the [pricing page](/pricing/) excluding VAT. VAT is added according to the rules applicable to your country; EU businesses with a valid VAT number are invoiced under the reverse-charge mechanism. Payment is processed by Stripe.
      - **Access** starts immediately after payment.
      - **Subscriptions** (Pro, Team) renew automatically for the same period until cancelled. You can cancel at any time from your account page; cancellation takes effect at the end of the period already paid, which is not refunded.
      - **The 24-hour pass** gives access to Pro features for 24 hours from payment and does not renew.
      - **Licences** are personal for Pro and per user for Team. The licence key is stored in your browser; keep a copy to use it on another device.
      - **Questions and claims**: contact@pdfanonym.com.

      ## 10. Changes and applicable law

