  edit_text:
    slug: edit-pdf-text
    nav: Edit text
    card: Click any word in a PDF and replace it, in the same font.
    title: 'Edit PDF Text Online: Click Any Word and Replace It, Free'
    description: 'Edit the text of a PDF in your browser: click a word, type the new one, download. Same position, size and color. No upload, no watermark.'
    h1: Edit text in a PDF, <span class="hl">word by word</span>
    h1_plain: Edit text in a PDF
    lede: 'A date, a name, an amount, a typo: click the word in the PDF, type the right one, done. The old text is really removed from the file.'
    suffix: edited
    hint: Click a word, type the new text, press Enter to confirm (Esc to cancel, Tab for the next word). Leave it empty to erase the word.
    stepsTitle: How to edit text in a PDF
    steps:
    - h: Open your PDF
      p: Drop it on the page. It opens on your computer; nothing is uploaded.
    - h: Click a word
      p: The word becomes editable. Type the replacement and press Enter. To replace several words at once, drag from one to the other.
    - h: Download
      p: Each change shows right away exactly as it will be in the file. Undo steps back, Download saves the edited PDF.
    body: '## The word is replaced, not covered up


      Many tools "edit" a PDF by placing a white box over the old text and writing on top. The old word then stays in the file: it comes back with copy and paste or a search. Here, the original word is really removed from the page, then the new one is written exactly in its place, on the same baseline. The background (color, frame, image) is left untouched.


      ## Same font, same size, same color


      When the document''s own font contains every letter you type, it is reused and the result matches the rest of the page. Otherwise the closest standard font is chosen (sans-serif, serif or monospace, bold or italic like the original) at the same size and in the same color. If the new word is longer or shorter, the rest of the sentence shifts to keep the spacing; a table column separated by a wide gap stays where it is.


      ## Common uses


      - Fix a date, a reference or an amount without rebuilding the whole document.

      - Correct a typo in a PDF when you no longer have the Word file.

      - Update a name, an address or a phone number.


      To write where there is no text yet, use [Add text](/add-text-to-pdf/) instead. To permanently remove sensitive information without replacing it, [redact the PDF](/redact-pdf/).


      ## Limits


      A scanned PDF only holds a picture of the page, so there are no words to edit. Vertical or rotated text cannot be edited. Characters outside the Western European Latin alphabet can only be written if the document''s font already contains them.

      '
    faq:
    - q: Does the old text stay hidden in the file?
      a: No. The original word is deleted from the page content before the new one is written. It does not come back with copy and paste or a search.
    - q: Can I replace a whole sentence?
      a: 'Yes. Drag from the first to the last word on the line: they are replaced together by what you type. A sentence that spans several lines is edited line by line.'
    - q: Why is the font not exactly the same?
      a: PDFs often embed only the letters used in the document. If you type a missing letter, the closest standard font is used for that word, at the same size and in the same color.
    - q: Is my file uploaded to a server?
      a: No. Everything happens in your browser; the PDF never leaves your computer.
