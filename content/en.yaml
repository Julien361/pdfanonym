pages:
  home:
    slug: ""
    title: "pdfanonym: redact and clean PDFs privately, in your browser"
    description: "Free PDF redaction that really deletes text. Remove names, numbers and hidden metadata from PDFs without uploading them. No account, no watermark."
    h1: 'Clean your PDFs <span class="hl">before</span> you share them'
    lede: "Redact names, delete text, strip hidden metadata. Everything happens on your own computer: your document is never sent to a server, not even ours."
    cta: Redact a PDF now
    toolsTitle: Pick a tool
    faq:
      - q: Is pdfanonym really free?
        a: "Yes. All 20 tools are free, with no account, no daily limit and no watermark. An optional <a href=\"/pricing/\">Pro plan</a> adds batch anonymization, extended detection and reports for professionals."
      - q: How can I check that my file is not uploaded?
        a: "Open your browser's developer tools, go to the Network tab and process a file: you will see no request carrying it. The page also ships a security policy that forbids it from sending data to any other site. And the full source code is available to read."
      - q: Does it work offline?
        a: "Yes. Once a tool page has finished loading, you can disconnect from the internet and keep working on your PDFs."
    body: |
      ## Why another PDF tool?

      Because most of them get one thing wrong. When you "black out" a name in a typical online editor, it draws a rectangle on top of the text. The page looks clean, yet anyone can still select, copy or search the words underneath. Lawyers have been caught out by this in court filings, and so have government agencies.

      pdfanonym removes the characters from the file itself. What you delete is gone: it cannot be copied, searched or recovered. To find personal data without hunting for it, [anonymize the PDF](/anonymize-pdf/) and let emails, phone numbers and IBANs be detected for you.

      ## Private by design, not by promise

      Upload-based services ask you to trust them with your contract, your payslip or your medical letter. We don't ask for that trust because we never receive the file. The PDF engine runs inside your browser (it is [MuPDF](https://mupdf.com), compiled to WebAssembly), so the document goes from your disk to your screen and back to your disk. The same goes for everyday jobs: you can [merge PDF files](/merge-pdf/) or [compress a PDF](/compress-pdf/) without the documents ever reaching a server.

      That matters if you handle client files, HR documents or anything covered by GDPR: there is no third party to declare and nothing to delete afterwards.

  redact:
    slug: redact-pdf
    nav: Redact PDF
    card: Black out names, numbers and sensitive passages. The text under the box is deleted.
    title: "Redact PDF online, free and private (text really deleted)"
    description: "Black out text in a PDF and delete it for good. Real redaction in your browser: no upload, no account, no watermark. Search and redact every occurrence at once."
    h1: 'Redact a PDF: <span class="redacted">black out</span> text for good'
    h1_plain: Redact PDF
    lede: "Select a name, an account number or a whole paragraph, and pdfanonym removes it from the file and leaves a black box in its place. Nothing is uploaded."
    black: true
    suffix: redacted
    stepsTitle: How to redact a PDF in three steps
    steps:
      - h: Open your PDF
        p: "Drop it on the page or pick it from your computer. It opens instantly, because it never leaves your device."
      - h: Mark what must disappear
        p: "Drag across text, click a word, double-click a line, or type a name in the search box and press <b>Mark all</b>. For scans, switch to <b>Area</b> and draw a rectangle."
      - h: Apply and download
        p: "Press <kbd>Del</kbd> or <b>Apply</b> to delete the text, check the result, then <b>Download</b>. Hidden metadata is removed too by default."
    compare:
      title: A black box is not redaction
      intro: "Most PDF editors let you draw a black rectangle and call it redaction. The difference only shows up when someone copies the text."
      bad_h: Drawing a box on top
      bad_p: "The page looks redacted, but the words are still in the file. Select the area, copy, paste into an email: the hidden name appears. Search finds it too, and so does any text extraction tool."
      good_h: Real redaction
      good_p: "The characters under the box are removed from the page content. There is nothing left to copy, search or extract. The black box is just a visual marker, and you can even choose to leave white space instead."
    body: |
      ## What can you redact?

      Anything that is text in the PDF: names, addresses, email addresses, phone numbers, bank details (IBAN), social security or tax numbers, salaries, case references, signatures typed as text. The search box finds every occurrence across all pages, ignoring capitals and accents, so a client's surname is caught everywhere in a 200-page file with one click. If you would rather have emails, phone numbers and IBANs found for you, [anonymize the PDF](/anonymize-pdf/) to detect personal data automatically.

      If your PDF is a **scan**, the "text" is really a picture. Switch to **Area** mode, draw a rectangle over the passage and tick **images** in the options: the pixels inside the rectangle are erased from the image itself.

      ## Who uses PDF redaction?

      - **Lawyers and paralegals** preparing exhibits and court filings.
      - **HR teams** sharing payslips, contracts or investigation reports.
      - **Anyone answering a GDPR or freedom-of-information request**, where third-party data must be removed before disclosure.
      - **Landlords, tenants and freelancers** sending bank statements or ID documents that only need part of the information.

      ## Check your redaction before sending

      After downloading, open the file, select the redacted area and try to copy it, then search for one of the words you removed. Nothing should come back. Our guide on [how to redact a PDF properly](/how-to-redact-a-pdf/) lists all the checks. Keep in mind that redacting the page does not touch the author or title hidden in the file properties unless the metadata option stays ticked; to review every field, [remove PDF metadata](/remove-pdf-metadata/) with the dedicated tool.
    faq:
      - q: Is the text really deleted, or just covered?
        a: "Deleted. pdfanonym applies the redaction to the page content, so the characters no longer exist in the file. Copy, search and text extraction return nothing."
      - q: Can I redact a scanned PDF?
        a: "Yes, with Area mode. Draw a rectangle and tick “images” in the options: the part of the scanned image under the rectangle is blanked out. Text search does not work on scans because there is no text layer."
      - q: Can I remove the text without leaving a black box?
        a: "Yes. Untick “Leave a black box” in the options, or use our <a href=\"/remove-text-from-pdf/\">remove text from PDF</a> tool, which leaves blank space instead."
      - q: Is there a page or file size limit?
        a: "No fixed limit. Very large files (several hundred pages) depend on your computer's memory, but everyday documents open in a second."
      - q: Can I undo a redaction?
        a: "Yes, as long as you have not closed the page: press Ctrl/Cmd+Z. Once the file is downloaded, the redaction is permanent, which is the point."
      - q: Are my files stored anywhere?
        a: "No. They are never uploaded, so there is nothing on our side to store or delete."

  remove:
    slug: remove-text-from-pdf
    nav: Remove text
    card: Erase words or paragraphs from a PDF and leave clean white space.
    title: "Remove or white out text in a PDF, for real (free, offline)"
    description: "Delete, erase or white out text in a PDF without leaving the words underneath. Free PDF eraser that runs in your browser: no upload, no account."
    h1: 'Remove text from a PDF, <span class="hl">for real</span>'
    h1_plain: Remove text from PDF
    lede: "Erase a word, a line or a whole block from your PDF. The text is deleted from the file, not hidden under a white rectangle, and the rest of the page stays exactly where it was."
    black: false
    suffix: edited
    stepsTitle: How to remove text from a PDF
    steps:
      - h: Open the PDF
        p: "Drop it here. It is read by your browser, not sent anywhere."
      - h: Select the text
        p: "Drag across it, click a word, or search for it and press <b>Mark all</b>. Use <b>Area</b> mode to sweep a whole block."
      - h: Delete and download
        p: "Press <kbd>Del</kbd>. The words disappear and leave white space. Undo with <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd>, then download."
    compare:
      title: Why "white-out" tools leave your text behind
      intro: "Many tools offer a white-out brush. It paints a white shape over the words, which works on paper and fails in a PDF."
      bad_h: White-out on top
      bad_p: "The words are still under the white shape. Copy the page, or open it in another editor, and they come back. Screen readers read them aloud too."
      good_h: Deleted from the page
      good_p: "pdfanonym removes the characters themselves. The surrounding text keeps its exact position, so the layout does not move, and there is nothing underneath to find."
    body: |
      ## How to white out a PDF without leaving the text behind

      "Whiteout" in a PDF usually means painting a white rectangle over words, the digital version of correction fluid. It hides the text from the eye only. pdfanonym does what people actually expect from a whiteout: the words are erased from the file and white space is left in their place. Select the text, press <kbd>Del</kbd>, and the result looks exactly like a whiteout, except that nothing is left to recover.

      ## Good to know

      PDFs are not word-processing files: each word sits at a fixed position on the page. When you remove a word in the middle of a line, the following words do **not** slide left to fill the gap; a blank space remains. That is exactly what you want for confidentiality, and it keeps the layout intact. Removing text does not clean the file properties, so also [remove the PDF metadata](/remove-pdf-metadata/) if the author or title fields name someone.

      If you need to **replace** text with something else, remove it here first, then [add the new text to the PDF](/add-text-to-pdf/) in the blank space.

      ## Common uses

      - Removing a price, a name or a date from a quote before reusing it as a template.
      - Deleting draft notes or "CONFIDENTIAL" mentions left in a document.
      - Clearing personal details from a form before sharing a sample.

      Need a visible black bar instead? Use [Redact PDF](/redact-pdf/).
    faq:
      - q: Will the remaining text move?
        a: "No. Every other character keeps its exact position. A blank space is left where the removed text was."
      - q: Can I remove text from a scanned PDF?
        a: "Scans contain an image of the text, not text. Use Area mode and tick “images” to blank out that part of the image."
      - q: Does removing text reduce quality?
        a: "No. Only the selected characters are touched; the rest of the page, fonts and images are kept as they are."
      - q: Is it free?
        a: "Yes, with no account, no limit and no watermark."

