      ## How the licence works

      After payment, a licence key is stored in your browser. It is checked on your device, without contacting our servers, so Pro features work offline and your documents still never leave your computer. To use Pro on another device or share a Team licence with a colleague, copy the key from your [account page](/account/).

      ## Why paid features at all?

      The free tools cost us very little to run, which is why they stay free. Pro funds the development of the features professionals ask for and keeps the site free of advertising.
    faq:
      - q: Can individuals buy Pro?
        a: "No. Paid plans are reserved for professionals buying for their work. All the free tools remain available to everyone, without an account."
      - q: Can I cancel my subscription?
        a: "Yes, anytime from your account page. You keep Pro until the end of the period already paid; there is no automatic refund for that period."
      - q: Do I get an invoice?
        a: "Yes. Stripe sends a receipt and an invoice by email. Enter your company name and VAT number at checkout to have them on the invoice."
      - q: What happens when the 24-hour pass ends?
        a: "Pro features are locked again. Files you already processed stay as they are. Nothing renews automatically."
      - q: Is my payment information safe?
        a: "Payment is handled by Stripe on its own secure page. We never receive your card details."

